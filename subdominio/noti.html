<!DOCTYPE html>
<html>
<head>
    <title>Enviar Notificación Masiva - AUTOMÁTICO</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>📨 Enviar Notificación a TODOS los Usuarios</h1>
    
    <div style="background:#f0f0f0; padding:15px; border-radius:10px; margin:10px 0;">
        <strong>📱 Usuarios encontrados:</strong> <span id="totalUsuarios">Cargando...</span>
        <button onclick="cargarTokens()" style="margin-left:10px; padding:5px 10px;">🔄 Recargar</button>
    </div>
    
    <input type="text" id="titulo" placeholder="Título" style="width:100%; margin:10px 0; padding:10px;" value="LEGADO AVICOLA">
    
    <input type="text" id="mensaje" placeholder="Mensaje" style="width:100%; margin:10px 0; padding:10px;" value="Notificación importante">
    
    <button onclick="enviarATodos()" style="padding:10px 20px; background:#8B4513; color:white; border:none;">📤 ENVIAR A TODOS</button>
    
    <div id="resultado" style="margin-top:20px; white-space:pre-wrap; background:#f8f9fa; padding:15px; border-radius:10px;"></div>

    <script>
    // ✅ ESPERAR a que Firebase cargue completamente
    function esperarFirebase() {
        return new Promise((resolve) => {
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                resolve();
            } else {
                const checkInterval = setInterval(() => {
                    if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 100);
            }
        });
    }
    
    // Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyASox7mRak5V0py29htEVWCVeipGpA0yfs",
        authDomain: "galloslivebadge.firebaseapp.com",
        databaseURL: "https://galloslivebadge-default-rtdb.firebaseio.com",
        projectId: "galloslivebadge",
        messagingSenderId: "979482928760",
        appId: "1:979482928760:web:3ea879dc4ee1e020df6f8d"
    };
    
    let tokensLista = [];
    let db = null;
    
    // Inicializar Firebase SOLO una vez
    async function initFirebase() {
        if (typeof firebase === 'undefined') {
            console.error('Firebase no cargado');
            return false;
        }
        
        if (firebase.apps.length === 0) {
            firebase.initializeApp(firebaseConfig);
        }
        
        db = firebase.database();
        return true;
    }
    
    // Cargar tokens automáticamente desde Realtime Database
    async function cargarTokens() {
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '🔄 Inicializando Firebase...';
        
        // Inicializar Firebase
        const inicializado = await initFirebase();
        if (!inicializado) {
            resultadoDiv.innerHTML = '❌ Error: Firebase no cargó correctamente. Recarga la página.';
            return;
        }
        
        resultadoDiv.innerHTML = '🔄 Cargando tokens desde Firebase...';
        
        try {
            const snapshot = await db.ref('pushTokens').once('value');
            
            if (snapshot.exists()) {
                const usuarios = snapshot.val();
                tokensLista = [];
                
                for (const [uid, data] of Object.entries(usuarios)) {
                    if (data.token && data.token.trim()) {
                        tokensLista.push({
                            uid: uid,
                            token: data.token,
                            fecha: data.fecha
                        });
                    }
                }
                
                document.getElementById('totalUsuarios').innerHTML = `${tokensLista.length} usuarios registrados`;
                resultadoDiv.innerHTML = `✅ Cargados ${tokensLista.length} tokens automáticamente desde Firebase`;
            } else {
                document.getElementById('totalUsuarios').innerHTML = '0 usuarios';
                resultadoDiv.innerHTML = '⚠️ No hay tokens guardados en Firebase. Los usuarios deben activar notificaciones primero.';
            }
        } catch(error) {
            console.error('Error cargando tokens:', error);
            resultadoDiv.innerHTML = '❌ Error cargando tokens: ' + error.message;
        }
    }
    
    async function getAccessToken() {
        try {
            const auth = firebase.auth();
            const user = auth.currentUser;
            
            if (user) {
                return await user.getIdToken();
            } else {
                await auth.signInAnonymously();
                return await auth.currentUser.getIdToken();
            }
        } catch(e) {
            console.error('Error obteniendo token:', e);
            return null;
        }
    }
    
    async function enviarATodos() {
        if (tokensLista.length === 0) {
            document.getElementById('resultado').innerHTML = '⚠️ No hay usuarios para enviar. Carga los tokens primero.';
            return;
        }
        
        const titulo = document.getElementById('titulo').value;
        const mensaje = document.getElementById('mensaje').value;
        
        document.getElementById('resultado').innerHTML = '🔑 Obteniendo token de acceso...';
        
        const accessToken = await getAccessToken();
        if (!accessToken) {
            document.getElementById('resultado').innerHTML = '❌ Error obteniendo token de acceso';
            return;
        }
        
        document.getElementById('resultado').innerHTML = `📤 Enviando a ${tokensLista.length} dispositivos...<br>⏳ Progreso: 0/${tokensLista.length}`;
        
        let enviados = 0;
        let errores = 0;
        
        for (let i = 0; i < tokensLista.length; i++) {
            const usuario = tokensLista[i];
            
            try {
                const response = await fetch(`https://fcm.googleapis.com/v1/projects/galloslivebadge/messages:send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: {
                            token: usuario.token,
                            data: {
                                title: titulo,
                                body: mensaje,
                                image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg'
                            },
                            android: {
                                priority: "high",
                                notification: {
                                    title: titulo,
                                    body: mensaje,
                                    image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg',
                                    icon: 'https://sub-legadoavicola.pages.dev/miniatura.jpg'
                                }
                            },
                            webpush: {
                                headers: {
                                    Urgency: "high"
                                },
                                notification: {
                                    title: titulo,
                                    body: mensaje,
                                    icon: 'https://sub-legadoavicola.pages.dev/miniatura.jpg',
                                    image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg',
                                    actions: [
                                        { action: 'ver', title: '👁️ VER TORNEO' },
                                        { action: 'compartir', title: '📤 COMPARTIR' },
                                        { action: 'recordar', title: '⏰ RECORDAR' }
                                    ]
                                }
                            }
                        }
                    })
                });
                
                if (response.ok) {
                    enviados++;
                } else {
                    errores++;
                }
            } catch(e) {
                errores++;
            }
            
            document.getElementById('resultado').innerHTML = `📤 Enviando a ${tokensLista.length} dispositivos...<br>⏳ Progreso: ${i+1}/${tokensLista.length}<br>✅ Enviados: ${enviados} | ❌ Errores: ${errores}`;
        }
        
        document.getElementById('resultado').innerHTML = `
            ✅ ENVÍO COMPLETADO
            📱 Total usuarios: ${tokensLista.length}
            ✅ Enviados correctamente: ${enviados}
            ❌ Errores: ${errores}
        `;
    }
    
    // Esperar a que cargue todo y luego iniciar
    window.addEventListener('DOMContentLoaded', () => {
        // Esperar un poco a que Firebase cargue
        setTimeout(() => {
            cargarTokens();
        }, 500);
    });
    </script>
    
    <!-- Cargar Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</body>
</html>
