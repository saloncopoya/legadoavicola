        .badge { background: #8B4513; color: white; padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; display: inline-block; margin-left: 10px; }

    let tokensLista = [];
    let accessToken = null;
    
    // Cargar tokens desde Firebase Database
    async function cargarTokens() {
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '🔄 Cargando tokens desde Firebase...';
        
        try {
            const response = await fetch('https://galloslivebadge-default-rtdb.firebaseio.com/pushTokens.json');
            const data = await response.json();
            
            if (data) {
                tokensLista = [];
                for (const [uid, tokenData] of Object.entries(data)) {
                    if (tokenData.token && tokenData.token.trim() && tokenData.token.length > 30) {
                        tokensLista.push(tokenData.token);
                    }
                }
                
                document.getElementById('totalUsuarios').innerHTML = `${tokensLista.length} usuarios`;
                resultadoDiv.innerHTML = `✅ Cargados ${tokensLista.length} tokens correctamente.`;
                
                if (tokensLista.length === 0) {
                    resultadoDiv.innerHTML += '\n\n⚠️ No hay tokens. Los usuarios deben abrir la app y aceptar notificaciones.';
                }
            } else {
                document.getElementById('totalUsuarios').innerHTML = '0 usuarios';
                resultadoDiv.innerHTML = '⚠️ No se encontraron tokens en la base de datos.';
            }
        } catch (error) {
            console.error(error);
            resultadoDiv.innerHTML = '❌ Error al cargar tokens: ' + error.message;
        }
    }
    
    // Obtener Access Token usando la cuenta de servicio
    async function getAccessToken() {
        const jwt = await crearJWT();
        
        const response = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
        });
        
        const data = await response.json();
        if (!data.access_token) {
            throw new Error('No se pudo obtener access token: ' + JSON.stringify(data));
        }
        return data.access_token;
    }
    
    // Crear JWT para autenticación
    async function crearJWT() {
        const header = { alg: 'RS256', typ: 'JWT' };
        const now = Math.floor(Date.now() / 1000);
        const claim = {
            iss: serviceAccount.client_email,
            scope: 'https://www.googleapis.com/auth/firebase.messaging',
            aud: serviceAccount.token_uri,
            exp: now + 3600,
            iat: now
        };
        
        const encodedHeader = btoa(JSON.stringify(header));
        const encodedClaim = btoa(JSON.stringify(claim));
        const signatureInput = `${encodedHeader}.${encodedClaim}`;
        
        // Convertir PEM a ArrayBuffer para la firma
        const privateKey = await importPrivateKey(serviceAccount.private_key);
        
        const signature = await crypto.subtle.sign(
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            privateKey,
            new TextEncoder().encode(signatureInput)
        );
        
        const encodedSignature = btoa(String.fromCharCode(...new Uint8Array(signature)));
        return `${signatureInput}.${encodedSignature}`;
    }
    
    async function importPrivateKey(pem) {
        // Limpiar el formato PEM
        const pemClean = pem.replace(/-----BEGIN PRIVATE KEY-----/, '')
                            .replace(/-----END PRIVATE KEY-----/, '')
                            .replace(/\n/g, '');
        
        const binaryDer = Uint8Array.from(atob(pemClean), c => c.charCodeAt(0));
        
        return await crypto.subtle.importKey(
            'pkcs8',
            binaryDer,
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['sign']
        );
    }
    
    // Enviar notificación a todos usando API V1
    async function enviarATodos() {
        if (tokensLista.length === 0) {
            document.getElementById('resultado').innerHTML = '⚠️ No hay usuarios para enviar. Carga los tokens primero.';
            return;
        }
        
        const titulo = document.getElementById('titulo').value.trim() || "LEGADO AVICOLA";
        const mensaje = document.getElementById('mensaje').value.trim() || "Notificación importante";
        
        document.getElementById('resultado').innerHTML = '🔑 Obteniendo token de acceso...';
        
        try {
            accessToken = await getAccessToken();
            document.getElementById('resultado').innerHTML = `📤 Enviando a ${tokensLista.length} dispositivos...<br>⏳ Progreso: 0/${tokensLista.length}`;
        } catch (error) {
            document.getElementById('resultado').innerHTML = '❌ Error de autenticación: ' + error.message;
            return;
        }
        
        let enviados = 0;
        let errores = 0;
        const detalles = [];
        
        for (let i = 0; i < tokensLista.length; i++) {
            try {
                const response = await fetch(`https://fcm.googleapis.com/v1/projects/${serviceAccount.project_id}/messages:send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: {
                            token: tokensLista[i],
                            data: {
                                title: titulo,
                                body: mensaje,
                                image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg'
                            },
                            android: {
                                priority: "high",
                                notification: {
                                    title: titulo,
                                    body: mensaje,
                                    image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg'
                                }
                            },
                            webpush: {
                                headers: { Urgency: "high" },
                                notification: {
                                    title: titulo,
                                    body: mensaje,
                                    icon: 'https://sub-legadoavicola.pages.dev/miniatura.jpg',
                                    image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg',
                                    actions: [
                                        { action: 'ver', title: '👁️ VER TORNEO' },
                                        { action: 'compartir', title: '📤 COMPARTIR' },
                                        { action: 'recordar', title: '⏰ RECORDAR' }
                                    ]
                                }
                            }
                        }
                    })
                });
                
                if (response.ok) {
                    enviados++;
                    detalles.push(`✅ Usuario ${i+1}: OK`);
                } else {
                    errores++;
                    const errorText = await response.text();
                    detalles.push(`❌ Usuario ${i+1}: ${errorText.substring(0, 100)}`);
                }
            } catch (e) {
                errores++;
                detalles.push(`❌ Usuario ${i+1}: ${e.message}`);
            }
            
            document.getElementById('resultado').innerHTML = `📤 Progreso: ${i+1}/${tokensLista.length}<br>✅ Enviados: ${enviados} | ❌ Errores: ${errores}<br><br><div style="font-size:0.7rem;">${detalles.slice(-5).join('<br>')}</div>`;
        }
        
        document.getElementById('resultado').innerHTML = `
✅ ENVÍO COMPLETADO
📱 Total usuarios: ${tokensLista.length}
✅ Enviados correctamente: ${enviados}
❌ Errores: ${errores}

${detalles.join('\n')}
        `;
    }
