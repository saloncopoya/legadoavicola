    let tokensLista = [];
    
    async function cargarTokens() {
        document.getElementById('resultado').innerHTML = '🔄 Cargando tokens...';
        try {
            const response = await fetch('https://galloslivebadge-default-rtdb.firebaseio.com/pushTokens.json');
            const data = await response.json();
            if (data) {
                tokensLista = [];
                for (const [uid, tokenData] of Object.entries(data)) {
                    if (tokenData.token) tokensLista.push(tokenData.token);
                }
                document.getElementById('totalUsuarios').innerHTML = `${tokensLista.length} usuarios`;
                document.getElementById('resultado').innerHTML = `✅ Cargados ${tokensLista.length} tokens`;
            }
        } catch(error) {
            document.getElementById('resultado').innerHTML = '❌ Error: ' + error.message;
        }
    }
    
    async function getAccessToken() {
        // Usar fetch directo con JWT manual (CORREGIDO)
        const header = { alg: 'RS256', typ: 'JWT' };
        const now = Math.floor(Date.now() / 1000);
        const claim = {
            iss: serviceAccount.client_email,
            scope: 'https://www.googleapis.com/auth/firebase.messaging',
            aud: serviceAccount.token_uri,
            exp: now + 3600,
            iat: now
        };
        
        // Codificar header y claim
        const encodedHeader = btoa(JSON.stringify(header));
        const encodedClaim = btoa(JSON.stringify(claim));
        const toSign = `${encodedHeader}.${encodedClaim}`;
        
        // Importar clave privada correctamente
        const privateKey = await crypto.subtle.importKey(
            'pkcs8',
            str2ab(atob(serviceAccount.private_key.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g, ''))),
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false,
            ['sign']
        );
        
        const signature = await crypto.subtle.sign(
            'RSASSA-PKCS1-v1_5',
            privateKey,
            new TextEncoder().encode(toSign)
        );
        
        const encodedSignature = btoa(String.fromCharCode(...new Uint8Array(signature)));
        const jwt = `${toSign}.${encodedSignature}`;
        
        const response = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error_description || 'Error getting token');
        return data.access_token;
    }
    
    function str2ab(str) {
        const buf = new ArrayBuffer(str.length);
        const bufView = new Uint8Array(buf);
        for (let i = 0; i < str.length; i++) bufView[i] = str.charCodeAt(i);
        return buf;
    }
    
    async function enviarATodos() {
        if (tokensLista.length === 0) {
            document.getElementById('resultado').innerHTML = '⚠️ No hay usuarios';
            return;
        }
        
        document.getElementById('resultado').innerHTML = '🔑 Obteniendo token...';
        let accessToken;
        try {
            accessToken = await getAccessToken();
        } catch(e) {
            document.getElementById('resultado').innerHTML = '❌ Error auth: ' + e.message;
            return;
        }
        
        const titulo = document.getElementById('titulo').value;
        const mensaje = document.getElementById('mensaje').value;
        let enviados = 0, errores = 0;
        
        for (let i = 0; i < tokensLista.length; i++) {
            try {
                const response = await fetch(`https://fcm.googleapis.com/v1/projects/galloslivebadge/messages:send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: {
                            token: tokensLista[i],
                            data: { title: titulo, body: mensaje, image: 'https://sub-legadoavicola.pages.dev/miniatura.jpg' }
                        }
                    })
                });
                if (response.ok) enviados++;
                else errores++;
            } catch(e) { errores++; }
            document.getElementById('resultado').innerHTML = `📤 Progreso: ${i+1}/${tokensLista.length}<br>✅ ${enviados} | ❌ ${errores}`;
        }
        document.getElementById('resultado').innerHTML = `✅ COMPLETADO\nTotal: ${tokensLista.length}\n✅ ${enviados}\n❌ ${errores}`;
    }
    
    window.addEventListener('DOMContentLoaded', cargarTokens);
