        }

            100% { opacity: 0; transform: scale(0.8); margin-bottom: -35px; }

async function getDeviceFingerprint() {

async function verificarDispositivo(user) {
    if (!user) return false;
    if (!AppState.firebase.database) { AppState.firebase.database = firebase.database(); }
    try {
        const currentDevice = await getDeviceFingerprint();
        const userSnapshot = await AppState.firebase.database.ref('users/' + user.uid).once('value');
        if (!userSnapshot.exists()) return true;
        const userProfile = userSnapshot.val();
        const maxDevices = userProfile.maxDevices || 1;
        const devicesSnapshot = await AppState.firebase.database.ref(`dispositivos_autorizados/${user.uid}`).once('value');
        const authorizedDevices = devicesSnapshot.val() || {};
        const deviceExists = authorizedDevices[currentDevice.fingerprint];
        if (deviceExists) {
            await AppState.firebase.database.ref(`dispositivos_autorizados/${user.uid}/${currentDevice.fingerprint}/lastLogin`).set(firebase.database.ServerValue.TIMESTAMP);
            return true;
        } else {
            const devicesCount = Object.keys(authorizedDevices).length;
            if (devicesCount < maxDevices) {
                await AppState.firebase.database.ref(`dispositivos_autorizados/${user.uid}/${currentDevice.fingerprint}`).set({
                    fingerprint: currentDevice.fingerprint, firstSeen: firebase.database.ServerValue.TIMESTAMP, lastLogin: firebase.database.ServerValue.TIMESTAMP, verified: true,

                    userAgent: currentDevice.userAgent

const RateLimiter = {
    recordAttempt(action) {
        const key = `rate_${action}`;
        const now = Date.now();
        const attempts = JSON.parse(localStorage.getItem(key) || '[]');
        const recent = attempts.filter(time => now - time < 900000);
        recent.push(now);
        localStorage.setItem(key, JSON.stringify(recent));
        return recent.length;
    },
    canAttempt(action, maxAttempts = 5, timeWindow = 900000) {
        const key = `rate_${action}`;
        const now = Date.now();
        const attempts = JSON.parse(localStorage.getItem(key) || '[]');
        const recent = attempts.filter(time => now - time < timeWindow);
        localStorage.setItem(key, JSON.stringify(recent));
        return recent.length < maxAttempts;
    },
    getWaitTime(action, maxAttempts = 5) {
        const key = `rate_${action}`;
        const now = Date.now();
        const attempts = JSON.parse(localStorage.getItem(key) || '[]');
        if (attempts.length < maxAttempts) return 0;
        const oldest = Math.min(...attempts);
        const waitTime = 900000 - (now - oldest);
        return waitTime > 0 ? Math.ceil(waitTime / 1000) : 0;
    }
};

    return postDate.toLocaleDateString();
}

async function resetPassword() {
    if (!AppState.firebase.isEnabled) { AppState.addNotification('Firebase no está inicializado', 'error'); return; }
    const email = document.getElementById('loginPhone')?.value.trim();
    if (!email) { AppState.addNotification('Ingresa tu correo electrónico', 'error'); return; }
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) { AppState.addNotification('Ingresa un correo electrónico válido', 'error'); return; }
    try {
        await AppState.firebase.auth.sendPasswordResetEmail(email);
        AppState.addNotification(`✅ Se envió un enlace de recuperación a: ${email}`, 'success');
    } catch(error) {
        let errorMessage = 'Error al enviar correo de recuperación';
        if (error.code === 'auth/user-not-found') errorMessage = 'No existe una cuenta con ese email';
        else if (error.code === 'auth/invalid-email') errorMessage = 'Email inválido';
        AppState.addNotification(errorMessage, 'error');
    }
}

async function handleLogin() {
    if (!validarCSRF('login')) { AppState.addNotification('Error de seguridad. Recarga la página.', 'error'); return; }
    window.modalGoogleActivo = false;
    const email = document.getElementById('loginPhone')?.value.trim();
    const password = document.getElementById('loginPassword')?.value;
    const loginBtn = document.querySelector('#loginForm .btn-primary');
    if (!email || !password) { AppState.addNotification('Completa todos los campos', 'warning'); return; }
    const emailKey = `login_${email}`;
    if (!RateLimiter.canAttempt(emailKey, 3)) { const waitSeconds = RateLimiter.getWaitTime(emailKey, 3); const minutes = Math.ceil(waitSeconds / 60); AppState.addNotification(`Demasiados intentos. Espera ${minutes} minutos.`, 'error'); return; }
    if (!AppState.firebase.isEnabled || !AppState.firebase.auth) { AppState.addNotification('Error: Firebase no inicializado', 'error'); return; }
    showLoadingScreen('Iniciando sesión...', 30);
    if (loginBtn) { loginBtn.disabled = true; loginBtn.textContent = 'INICIANDO...'; }
    try {
        updateLoadingProgress(50, 'Verificando credenciales...');
        RateLimiter.recordAttempt(emailKey);
        await AppState.firebase.auth.signInWithEmailAndPassword(email, password);
        if (!AppState.firebase.database) AppState.firebase.database = firebase.database();
        updateLoadingProgress(80, 'Cargando perfil...');
        localStorage.removeItem(`rate_${emailKey}`);
    } catch(error) {
        console.error(error);
        hideLoadingScreen();
        if (error.code === 'auth/invalid-login-credentials') AppState.addNotification('❌ Email o contraseña incorrectos', 'error');
        else handleFirebaseError(error, 'iniciar sesión');
        if (loginBtn) { loginBtn.disabled = false; loginBtn.textContent = 'ACCEDER'; }
    }
}

function updatePhonePrefix() {
    const select = document.getElementById('registerMunicipio');
    const prefix = document.getElementById('registerPhonePrefix');
    if (!select || !prefix) return;
    const opt = select.options[select.selectedIndex];
    const custom = document.getElementById('customMunicipioContainer');
    if (opt.value === 'otro') { if (custom) custom.style.display = 'block'; prefix.value = '+52 961'; }
    else { if (custom) custom.style.display = 'none'; prefix.value = `+52 ${opt.getAttribute('data-prefijo') || '961'}`; }
    if (window.backupFormData) window.backupFormData.register.municipio = opt.value;
}

async function checkActivationStatus() {
    const currentUser = AppState.user.current;
    const database = AppState.firebase.database;
    if (!currentUser || !database) { AppState.addNotification('No hay usuario logueado', 'error'); return; }
    try {
        const snapshot = await database.ref('users/' + currentUser.uid + '/activated').once('value');
        if (snapshot.val() === true) {
            AppState.addNotification('✅ ¡Cuenta activada!', 'success');
            await loadUserProfile(currentUser.uid);
            setTimeout(() => {
                const intencionGuardada = sessionStorage.getItem('postActivationIntent');
                sessionStorage.removeItem('postActivationIntent');
                const pantallasPermitidas = ['public', 'rooster', 'publicaciones', 'pedigri', 'juez', 'ventas', 'perfil', 'configuraciones'];
                if (intencionGuardada && pantallasPermitidas.includes(intencionGuardada)) { AppState.setScreen(intencionGuardada); window.history.pushState({}, '', `/?section=${intencionGuardada}`); }
                else { AppState.setScreen('public'); window.history.pushState({}, '', '/?section=public'); }
            }, 1500);
        } else { AppState.addNotification('⏳ Tu cuenta aún no ha sido activada', 'warning'); }
    } catch(error) { AppState.addNotification('Error al verificar estado de activación', 'error'); }
}

let activationNotificationTimeout = null;
async function checkActivationStatusWithFeedback() {
    if (!AppState.user.current && !AppState.firebase.database) await new Promise(resolve => setTimeout(resolve, 3000));
    else if (!AppState.user.current && AppState.firebase.database) return;
    else if (AppState.user.current && !AppState.firebase.database) {
        AppState.addNotification('Reconectando con Firebase...', 'warning', 2000);
        try { AppState.firebase.database = firebase.database(); await new Promise(resolve => setTimeout(resolve, 2000)); } catch(e) { AppState.addNotification('Error de conexión con Firebase', 'error'); return; }
    }
    const currentUser = AppState.user.current;
    const database = AppState.firebase.database;
    if (!currentUser || !database) { AppState.addNotification('No hay usuario logueado', 'error'); return; }
    try {
        const snapshot = await database.ref('users/' + currentUser.uid + '/activated').once('value');
        if (snapshot.val() === true) {
            AppState.addNotification('✅ ¡Cuenta activada!', 'success');
            await loadUserProfile(currentUser.uid);
            setTimeout(() => {
                const intencionGuardada = sessionStorage.getItem('postActivationIntent');
                sessionStorage.removeItem('postActivationIntent');
                const pantallasPermitidas = ['public', 'rooster', 'publicaciones', 'pedigri', 'juez', 'ventas', 'perfil', 'configuraciones'];
                if (intencionGuardada && pantallasPermitidas.includes(intencionGuardada)) { AppState.setScreen(intencionGuardada); window.history.pushState({}, '', `/?section=${intencionGuardada}`); }
                else { AppState.setScreen('public'); window.history.pushState({}, '', '/?section=public'); }
            }, 1500);
        } else {
            AppState.addNotification('⏳ Tu cuenta aún no ha sido activada, reintente más tarde', 'warning');
            if (activationNotificationTimeout) clearTimeout(activationNotificationTimeout);
            activationNotificationTimeout = setTimeout(() => { showActivationModal(); }, 1000);
        }
    } catch(error) { AppState.addNotification('Error al verificar estado de activación', 'error'); }
}

            <div style="display: flex; gap: 10px; margin-top: 10px; justify-content: space-between;"><button id="modal-close-btn" style="background: none; border: none; color: #999; font-weight: 500; font-size: 14px; cursor: pointer; padding: 14px 0;">cerrar</button><button id="modal-save-btn" style="padding: 14px 30px; background: #8B4513; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">CONTINUAR</button></div>
            <div id="modal-message" style="margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; display: none;"></div>
        </div>
    `;
    modal.style.cssText = 'width: 100%; display: flex; justify-content: center;';
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    const municipioSelect = document.getElementById('registerMunicipio');
    if (municipioSelect) {
        municipioSelect.addEventListener('change', function() {
            const customContainer = document.getElementById('modal-custom-municipio-container');
            if (customContainer) customContainer.style.display = this.value === 'otro' ? 'block' : 'none';
            if (typeof window.updatePhonePrefix === 'function') window.updatePhonePrefix();
        });
    }
    const saveBtn = document.getElementById('modal-save-btn');
    if (saveBtn) {
        saveBtn.onclick = async () => {
            const telefono = document.getElementById('registerPhone')?.value.trim() || '';
            const messageDiv = document.getElementById('modal-message');
            if (!telefono || (telefono.length !== 7 && telefono.length !== 10)) {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                if (messageDiv) { messageDiv.style.display = 'block'; messageDiv.style.background = '#ffebee'; messageDiv.style.color = '#c62828'; messageDiv.textContent = '❌ Teléfono obligatorio (7 o 10 dígitos)'; }
                return;
            }
            saveBtn.disabled = true;
            saveBtn.textContent = 'GUARDANDO...';
            try {
                const database = AppState.firebase.database;
                const userId = user.uid;
                const prefijo = document.getElementById('registerPhonePrefix')?.value || '961';
                const partido = document.getElementById('modal-partido')?.value.trim() || '';
                const representante = document.getElementById('modal-representante')?.value.trim() || '';
                let municipioFinal = '';
                if (municipioSelect.value === 'otro') { const customInput = document.getElementById('modal-custom-municipio'); municipioFinal = customInput ? customInput.value.trim() : ''; }
                else if (municipioSelect.value) { municipioFinal = municipioSelect.options[municipioSelect.selectedIndex]?.text || ''; }
                const updates = { partyName: partido, representative: representante, municipio: municipioFinal, phone: `${prefijo}${telefono}`, formattedPhone: `${prefijo}${telefono}`, phonePrefix: `${prefijo}` };
                await database.ref(`users/${userId}`).update(updates);
                try {
                    const telefonoCompleto = `${prefijo}${telefono}`;
                    await database.ref(`TELPARTIDOS/${telefonoCompleto}`).set({ nombre: profile?.displayName || 'Usuario', userId: userId, partido: partido || '' });
                } catch(e) {}
                if (AppState.user.profile) AppState.user.profile = { ...profile, ...updates };
                if (messageDiv) { messageDiv.style.display = 'block'; messageDiv.style.background = '#e8f5e8'; messageDiv.style.color = '#2e7d32'; messageDiv.textContent = '✅ Guardado correctamente'; }
                setTimeout(() => { if (overlay.parentNode) document.body.removeChild(overlay); }, 1000);
            } catch(error) {
                if (messageDiv) { messageDiv.style.display = 'block'; messageDiv.style.background = '#ffebee'; messageDiv.style.color = '#c62828'; messageDiv.textContent = '❌ Error al guardar'; }
                saveBtn.disabled = false; saveBtn.textContent = 'GUARDAR';
            }
        };
    }
    const closeBtn = document.getElementById('modal-close-btn');
    if (closeBtn) closeBtn.onclick = () => { if (overlay.parentNode) document.body.removeChild(overlay); };
    overlay.addEventListener('click', (e) => { if (e.target === overlay && AppState.user.current) document.body.removeChild(overlay); });
    const telefonoInput = document.getElementById('registerPhone');
    if (telefonoInput) telefonoInput.oninput = function() { this.value = this.value.replace(/\\D/g, '').slice(0, 10); };
}

async function handleLogout() {
    const sideMenu = document.getElementById('side-menu');
    const overlay = document.getElementById('side-menu-overlay');
    if (sideMenu) { sideMenu.style.right = '-350px'; sideMenu.style.transition = 'right 0.3s ease'; }
    if (overlay) overlay.style.display = 'none';
    document.body.style.overflow = '';
    AppState.addNotification('Cerrando sesión...', 'warning');
    const currentUid = AppState.user.current?.uid;
    if (currentUid && AppState.persistentCache) AppState.persistentCache.clearUserCache(currentUid);
    RecurrentUserManager.clear();
    try {
        if (typeof google !== 'undefined' && google.accounts) {
            google.accounts.id.disableAutoSelect();
            google.accounts.id.cancel();
            const userEmail = AppState.user?.current?.email;
            if (userEmail) { try { google.accounts.id.revoke(userEmail, (resp) => {}); } catch(e) {} }
            localStorage.removeItem('gsi_session'); sessionStorage.removeItem('gsi_session');
        }
        AppState.firebase.app = null; AppState.firebase.auth = null; AppState.firebase.database = null; AppState.firebase.isEnabled = false; AppState.firebase.isInitialized = false;
        AppState.rooster.cotejoState = false; AppState.rooster.roosters = []; AppState.rooster.tournamentInfo = null;
        const currentScreen = AppState.ui.currentScreen;
        const estabaEnActivationPending = (currentScreen === 'activation_pending');
        if (window.firebase && window.firebase.auth) { try { await window.firebase.auth().signOut(); } catch(e) {} }
        AppState.clearUser();
        localStorage.removeItem('lastScreen'); localStorage.removeItem('lastUser');
        sessionStorage.removeItem('lastUser'); sessionStorage.removeItem('lastScreen'); sessionStorage.removeItem('pendingLogin'); sessionStorage.removeItem('postActivationIntent'); sessionStorage.removeItem('vinoDeActivationPending');
        sessionStorage.clear();
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key && (key.startsWith('firebase:') || key.startsWith('app_'))) keysToRemove.push(key); }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        localStorage.removeItem('firebase:previous_websocket_failure');
        if (window.ScreenLoader && window.ScreenLoader.loadedFunctions) { window.ScreenLoader.loadedFunctions = {}; if (window.ScreenLoader.loadedScreens) window.ScreenLoader.loadedScreens.clear(); }
        if (estabaEnActivationPending) { AppState.ui.pendingScreen = null; sessionStorage.removeItem('lastScreen'); sessionStorage.removeItem('pendingLogin'); sessionStorage.removeItem('postActivationIntent'); window.history.pushState({}, '', '/'); setTimeout(() => { window.modalGoogleActivo = false; }, 100); }
        else { window.history.pushState({}, '', '/'); }
        setTimeout(() => { if (!AppState.user.current && AppState.ui.currentScreen === 'public' && typeof window.mostrarModalGoogleInferior === 'function') window.mostrarModalGoogleInferior(); }, 1000);
    } catch(error) { handleFirebaseError(error, 'cerrar sesión'); }
}

                    <div style='background:rgba(212,175,55,0.08); border-radius:16px; padding:18px; margin-bottom:25px; border:1px solid rgba(212,175,55,0.2);'><p style='font-size:14px; line-height:1.6; color:rgba(255,255,255,0.9); margin:0 0 12px 0; text-align:center;'><strong style='color:#D4AF37;'>⚡ EL SOFTWARE PARA EVENTOS GALLÍSTICOS MÁS COMPLETO Y AVANZADO DE MÉXICO</strong></p><p style='font-size:13px; line-height:1.6; color:rgba(255,255,255,0.85); margin:0 0 10px 0;'>Si usted está leyendo esto, <strong style='color:#D4AF37;'>es porque es de los que saben</strong>. este sistema esta pensando en gente como usted: que quiere <strong>orden, imparcialidad, justicia y transparencia</strong> en sus torneos, pero sin complicaciones técnicas.</p><p style='font-size:13px; line-height:1.6; color:rgba(255,255,255,0.85); margin:0;'><strong style='color:#D4AF37;'>¿Qué le ofrece el sistema?</strong> Usted registra los gallos con su peso, el programa los empareja de forma <strong>JUSTA Y AUTOMÁTICA</strong>, y puede proyectar los resultados en <strong>pantalla grande</strong> para que todos los vean. Sus clientes también pueden seguir el torneo <strong>desde su celular</strong> con solo escanear un código.</p><p style='font-size:13px; line-height:1.6; color:rgba(255,255,255,0.85); margin:0;'>Y no es por presumir, pero créame que le quedamos grandes a cualquier torneo. Desde la rifa del pueblo hasta el Derby más mamalón que se pare en frente, <strong style='color:#D4AF37;'>es como tener a un súper-juez, un secretario bien verga y un presentador de lujo</strong></p></div>
                    <div class='accordion-item'><div class='accordion-header' id='header-ac1' onclick='toggleAccordion(&quot;ac1&quot;)'><span>🎯 1. COTEJO BÁSICO - El más fácil y rápido</span><span class='accordion-icon' id='ac1-icon'>▼</span></div><div class='accordion-content' id='ac1'><div class='accordion-content-inner'><span class='feature-highlight'>🎯 ¿En qué consiste?</span><p>Registro de gallos (anillo, peso y/o color). Se ordena por peso y se emparejo automáticamente en segundos. Así de sencillo.</p><ul class='feature-list'><li><strong>El registro lo puede hacer conforme lleguen los partidos</strong> — Todas las peleas aparecen en orden en automatico el sistema es inteligente</li><li><strong>¿Quien puede realizar?</strong> — Cualquier persona con acceso al sistema, su cotejador, jueces, organizadores de evento y/o <strong> nosotros realizamos cotejo online/remoto</strong> solo enviando fotografia de la hoja de registro por whatsapp y en minutos se le envia el archivo PDF para imprimir.</li></ul><div class='box-ayuda'><strong>⚡ ¿Para qué sirve?</strong> Torneos de un solo día</div><ul class='feature-list'><li><strong>📋 Una sola lista</strong> — Todas las peleas aparecen en orden.</li><li><strong>📊Columna de color del gallo</strong> — La hoja de cotejo cuenta con la columna de color caracteristica del gallo.</li><li><strong>☮️ Diferencia de peso mínima</strong> — Peleas más parejas.</li><li><strong>🏆 Ideal para eliminatorias</strong> — Rápido y directo.</li><li><strong>📊 Usted decide los puntos</strong> — Cuánto vale ganar, empatar o perder. </li></ul><div style='display: flex; gap: 15px; align-items: flex-start; margin: 1em 0;'><div class='separator' style='flex: 1; text-align: center;'><a href='javascript:void(0)' onclick='abrirOverlay(&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiv9-9voBh_kBjFCv5NaFUtucf0l5gVlBijmhdcx51Bi_SUsC4udy2M8ykKYMgAc0dHuc6sV3B8zZfnpURLr6jAGBb7DTO2tuk9OvGOLoL4leXo3uoJRF-rTjbjJMf0Sx-eE8ki2iR9F9SO6170X8jIU8z_wHEYbW                     <div class='accordion-item'><div class='accordion-header' id='header-ac2' onclick='toggleAccordion(&quot;ac2&quot;)'><span>🔄 2. COTEJO CONFIGURABLE - Para torneos profesionales</span><span class='accordion-icon' id='ac2-icon'>▼</span></div><div class='accordion-content' id='ac2'><div class='accordion-content-inner'><span class='feature-highlight'>🔄 ¿En qué consiste?</span><p>Organiza tu torneo distribuyendo las peleas entre varios vallines. Se busca siempre el mejor emparejamiento por peso iguales</p><div class='box-ayuda'><strong>🏆 ¿Para qué sirve?</strong> Brindar legalidad, Imparcialidad absoluta y seguridad del emparejamiento mas seguro.</div><ul class='feature-list'><li><strong>🎚️ Tolerancia ajustable</strong> — Usted puede ajustar de cuántos gramos de diferencia máximo pueden tener.</li><li><strong>⬆️⬇️ Prioridad ligera/pesada</strong> — Usted elige si el emparejamiento es primero los livianos o los pesados o aleatoriamente.</li><li><strong>🚫 Sin repeticiones</strong> — La misma pareja no se vuelve a enfrentar. La distribucion cambia aleatoriamente</li><li><strong>❌ Comentarios inteligentes</strong> — Partidos que no se puedan emparejar por representante o rango de peso lo supera, notifica al usuario.</li></ul><div style='margin: 1em 0;'><div style='display: flex; gap: 15px; margin-bottom: 15px;'><div class='separator' style='flex: 1; text-align: center;'><a href='javascript:void(0)' onclick='abrirOverlay(&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiA831C1Q1IA46kcDAgZXaaU6BwYgiKmrFjxfhx4rRRk7JUfIBsJlrrQ3Dj_vbEiWE4j_Mtr5PQfqDuz3NlHsXt5xjMuoNZQaBvFxYzPg21xGeW8hlQqepp1SrsqiIP2pV4AWLHc3qAJIKpmtP8_f936Tt2ZGP3r-frWX2_CTGMp51RvMCMq9tICi6jRg6k/s740/2%20Informacion%20detalla%20de%20problemas%20de%20cotejos.png&quot;)' style='display: block;'><img alt='Imagen 1' border='0' class='lazy-img' data-src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiA831C1Q1IA46kcDAgZXaaU6BwYgiKmrFjxfhx4rRRk7JUfIBsJlrrQ3Dj_vbEiWE4j_Mtr5P /a></div></div></div></div></div></div>
                    <div class='accordion-item'><div class='accordion-header' id='header-ac3' onclick='toggleAccordion(&quot;ac3&quot;)'><span>🏷️ 3. COTEJO POR VALLINES - Para eventos gigantes con varios vallines</span><span class='accordion-icon' id='ac3-icon'>▼</span></div><div class='accordion-content' id='ac3'><div class='accordion-content-inner'><div style='margin: 1em 0;'><div style='display: flex; gap: 15px; margin-bottom: 15px;'><div class='separator' style='flex: 1; text-align: center;'><a href='javascript:void(0)' onclick='abrirOverlay(&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjHIPTbvsx61f1yOOy8nTTBWx9WsVPh-GXZWuKlTGQ7jAYDcgFJegnYEfITaFqZw14kx-QuoTpQcvRBHnmAjeiuNtQ5myuSq2TEdnuAPWFmUZI3guQpGEJB7V9V-De9DPHSqDgEp-ELmBZtezWpyywqGrtPZvR0JM3yqoLZT5kAj31pS64RiGoBXCUfj8rq/s740/3%20cotejo%20por%20vallines%20estilo%202.png&quot;)' style='display: block;'><img alt='Imagen 1' border='0' class='lazy-img' data-src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjHIPTbvsx61f1yOOy8nTTBWx9WsVPh-GXZWuKlTGQ7jAYDcgFJegnYEfITaFqZw14kx-QuoTpQcvRBHnmAjeiuNtQ5myuSq2TEdnuAPWFmUZI3guQpGEJB7V9V-De9DPHSqDgEp-ELmBZtezWpyywqGrtPZvR0JM3yqoLZT5kAj31pS64RiGoBXCUfj8rq/s740/3%20cotejo%20por%20vallines%20estilo%202.png' style='border-radius: 10px; width: 100%;'/></a></div><div class='separator' style='flex: 1; text-align: center;'><a href='javascript:void(0)' onclick='abrirOverlay(&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEglOOjFLEmocWkO4SGruA_ImQEv5NPgbcOhQKP2bTrl-qe2YFerddMe4BdR3SsTWLvO4IB0dH-MuJvwLi30tB29cE2NT3WM8vQ_RprMvf4WadXnAuJ2jxrGN29uarj7lg9dKAzzCG2YWofNJ5bmvzBTBF3ej4oRENV0xvEcnUkycH6wu7zblNQ0zFDrbRQR/s740/3%20cotejo%20por%20vallines%20estilo%201.png&quot;)' style='display: block;'><img alt='Imagen 2' border='0' class='lazy-img' data-src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEglOOjFLEmocWkO4SGruA_ImQEv5NPgbcOhQKP2bTrl-qe2YFerddMe4BdR3SsTWLvO4IB0dH-MuJvwLi30tB29cE2NT3WM8vQ_RprMvf4WadXnAuJ2jxrGN29uarj7lg9dKA function updateConnectionBar() {
    const connectionBar = document.getElementById('connection-status-bar');
    const connectionMessage = document.getElementById('connection-status-message');
    if (!connectionBar || !connectionMessage) return;
    function isSlowConnection() {
        if ('connection' in navigator) {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn) return conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g' || conn.downlink < 0.5;
        }
        return false;
    }
    connectionBar.classList.remove('slow-connection', 'connection-restored');
    if (!navigator.onLine) {
        connectionBar.classList.add('visible');
        connectionBar.style.backgroundColor = '#626466';
        connectionMessage.textContent = '¡Sin acceso a internet!. Conectate a una red.... (Los cambios NO se guardarán)';
    } else if (isSlowConnection()) {
        connectionBar.classList.add('visible', 'slow-connection');
        connectionBar.style.backgroundColor = '#ae0404';
        connectionMessage.textContent = 'Conexión lenta inestable!. (Las funciones pueden verse afectadas y no guardar cambios) ';
    } else if (connectionBar.classList.contains('visible')) {
        connectionBar.classList.add('connection-restored');
        connectionBar.style.backgroundColor = '#4CAF50';
        connectionMessage.textContent = '¡Conexión restablecida! Es seguro usarlo.';
        setTimeout(() => {
            connectionBar.classList.remove('visible', 'connection-restored', 'slow-connection');
            connectionBar.style.transform = 'translateY(100%)';
        }, 9000);
        return;
    }
    connectionBar.style.transform = 'translateY(0)';
}
window.addEventListener('online', updateConnectionBar);
window.addEventListener('offline', updateConnectionBar);
if ('connection' in navigator) {
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) conn.addEventListener('change', updateConnectionBar);
}

async function handleGoogleCredentialResponse(response) {
    showLoadingScreen('Autenticando...', 50);
    try {
        if (!AppState.firebase.isEnabled || !AppState.firebase.app) {
            if (typeof firebase !== 'undefined' && firebaseConfig) {
                const firebaseApp = firebase.initializeApp(firebaseConfig);
                AppState.firebase.app = firebaseApp;
                AppState.firebase.auth = firebase.auth();
                AppState.firebase.isEnabled = true;
                await new Promise(resolve => setTimeout(resolve, 500));
            } else throw new Error("Firebase SDK no disponible");
        }
        const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
        const result = await AppState.firebase.auth.signInWithCredential(credential);
        if (!AppState.firebase.database) AppState.firebase.database = firebase.database();
        updateLoadingProgress(80, 'Verificando usuario...');
        const user = result.user;
        const currentUser = firebase.auth().currentUser;
        if (!currentUser) throw new Error('Usuario no autenticado');
        const snapshot = await AppState.firebase.database.ref('users/' + currentUser.uid).once('value');
        if (!snapshot.exists()) {
            let defaultPermissions = { activated: false, gallo: false, isJudge: false, publicaciones: false, pedigri: false, ventas: false };
            try {
                const configSnapshot = await AppState.firebase.database.ref('config/defaultPermissions').once('value');
                if (configSnapshot.exists()) defaultPermissions = configSnapshot.val();
            } catch(e) {}
            const fullName = user.displayName || 'Usuario Google';
            const nameParts = fullName.split(' ');
            const firstName = nameParts[0] || '';
            const lastName = nameParts.slice(1).join(' ') || '';
            const newUserProfile = { uid: user.uid, displayName: fullName, realEmail: user.email || '', photoURL: user.photoURL || '', registeredAt: Date.now(), registeredWith: 'google', maxDevices: 1, activated: defaultPermissions.activated, gallo: defaultPermissions.gallo, isJudge: defaultPermissions.isJudge, publicaciones: defaultPermissions.publicaciones, ventas: defaultPermissions.ventas, pedigri: defaultPermissions.pedigri };
            await AppState.firebase.database.ref('users/' + user.uid).set(newUserProfile);
            AppState.setUser(user, newUserProfile);
            setTimeout(() => { if (AppState.user.current && debeMostrarModalCompletarPerfil && debeMostrarModalCompletarPerfil()) mostrarModalCompletarPerfil(); }, 2000);
            AppState.addNotification('✅ Registro exitoso. Pendiente de activación.', 'success');
            AppState.setScreen('public');
            window.history.pushState({}, '', '/?section=public');
        } else {
            const profile = snapshot.val();
            const deviceInfo = await getDeviceFingerprint();
            const devicesSnapshot = await AppState.firebase.database.ref(`dispositivos_autorizados/${user.uid}`).once('value');
            const authorizedDevices = devicesSnapshot.val() || {};
            const deviceExists = authorizedDevices[deviceInfo.fingerprint];
            if (!deviceExists) {
                const devicesCount = Object.keys(authorizedDevices).length;
                const maxDevices = profile.maxDevices || 1;
                if (devicesCount < maxDevices) {
                    await AppState.firebase.database.ref(`dispositivos_autorizados/${user.uid}/${deviceInfo.fingerprint}`).set({ fingerprint: deviceInfo.fingerprint, firstSeen: firebase.database.ServerValue.TIMESTAMP, lastLogin: firebase.database.ServerValue.TIMESTAMP, verified: true, info: { gpu: deviceInfo.components.gpu, cores: deviceInfo.components.cores, resolution: deviceInfo.components.resolution, os: deviceInfo.components.os, architecture: deviceInfo.components.arch }, userAgent: deviceInfo.userAgent });
                } else {
                    AppState.addNotification('🚫 LÍMITE DE DISPOSITIVOS ALCANZADO. contacta al administrador.', 'error', 6000);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    await AppState.firebase.auth.signOut();
                    hideLoadingScreen();
                    return;
                }
            } else {
                await AppState.firebase.database.ref(`dispositivos_autorizados/${user.uid}/${deviceInfo.fingerprint}/lastLogin`).set(firebase.database.ServerValue.TIMESTAMP);
            }
            if (profile.activated === true) RecurrentUserManager.markAsRecurrent();
            AppState.setUser(user, { id: user.uid, ...profile });
            if (profile.activated === true) { AppState.setScreen('public'); window.history.pushState({}, '', '/?section=public'); }
            else { AppState.setScreen('public'); window.history.pushState({}, '', '/?section=public'); }
        }
        updateLoadingProgress(100, '¡Listo!');
        setTimeout(() => { hideLoadingScreen(); }, 500);
    } catch(error) { hideLoadingScreen(); AppState.addNotification(`❌ Error al iniciar sesión con Google`, 'error'); }
}

function copyRoosterUrl() {
    const url = window.location.origin + window.location.pathname + '?section=rooster';
    navigator.clipboard.writeText(url).then(() => AppState.addNotification('✅ Enlace copiado', 'success')).catch(() => AppState.addNotification('Error al copiar', 'error'));
}
function shareRoosterSection() {
    const url = window.location.origin + window.location.pathname + '?section=rooster';
    if (navigator.share) { navigator.share({ title: ' - Torneos', text: 'Mira la sección Gallo', url: url }); }
    else { navigator.clipboard.writeText(url).then(() => AppState.addNotification('✅ Enlace copiado', 'success')); }
}

window.toggleUserActivation = async function(uid, activate) {
    const currentUser = AppState.user.current;
    const database = AppState.firebase.database;
    const userProfile = AppState.user.profile;
    const currentScreen = AppState.ui.currentScreen;
    if (!uid || typeof uid !== 'string') { AppState.addNotification('❌ ID de usuario inválido', 'error'); return; }
    if (!currentUser || !database || !userProfile || userProfile.gallo !== true) { AppState.addNotification('No tienes permisos', 'error'); return; }
    if (uid === currentUser.uid && activate === false) { AppState.addNotification('❌ No puedes desactivar tu propia cuenta', 'error'); return; }
    AppState.addNotification('⏳ Procesando...', 'info');
    try {
        const adminSnapshot = await database.ref(`users/${currentUser.uid}/gallo`).once('value');
        if (adminSnapshot.val() !== true) { AppState.addNotification('❌ Tus permisos han sido revocados', 'error'); return; }
        const targetSnapshot = await database.ref(`users/${uid}`).once('value');
        if (!targetSnapshot.exists()) { AppState.addNotification('❌ El usuario no existe', 'error'); return; }
        await database.ref(`users/${uid}/activated`).set(activate);
        AppState.addNotification(`Usuario ${activate ? 'activado' : 'desactivado'} correctamente`, 'success');
        if (currentScreen === 'admin') renderApp();
        if (uid === currentUser.uid && activate === false) setTimeout(() => { handleLogout(); }, 1500);
    } catch(error) { AppState.addNotification('Error al cambiar estado', 'error'); }
};

window.handleCompleteRegister = async function() {
    console.log("🟩 BOTÓN CREAR CUENTA presionado");

    // Validar que Firebase esté activado
    if (!AppState.firebase.isEnabled) {
        AppState.addNotification('Firebase no está inicializado. Intenta de nuevo.', 'error');
        return;
    }
    
    const btn = document.getElementById('registerSubmitBtn');
    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');

    const fullName = document.getElementById('registerFullName')?.value || '';
    const partyName = document.getElementById('registerPartyName')?.value || '';
    const representative = document.getElementById('registerRepresentative')?.value || '';
    const municipioSelect = document.getElementById('registerMunicipio');
    const customMunicipio = document.getElementById('registerCustomMunicipio')?.value || '';
    const phonePrefix = document.getElementById('registerPhonePrefix')?.value || '+52 961';
    const phoneNumber = document.getElementById('registerPhone')?.value.trim() || '';
    const password = document.getElementById('registerPassword')?.value || '';
    const confirmPassword = document.getElementById('registerConfirmPassword')?.value || '';
    const termsAccepted = document.getElementById('registerTerms')?.checked || false;
    const realEmail = document.getElementById('registerRealEmail')?.value.trim() || '';
    
    if (errorDiv) errorDiv.textContent = '';
    if (successDiv) successDiv.textContent = '';

    // Validaciones
    if (!fullName) { AppState.addNotification('Nombre completo requerido', 'error'); return; }
    if (!realEmail) { AppState.addNotification('Email real requerido', 'error'); return; }
    
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(realEmail)) { AppState.addNotification('Email inválido', 'error'); return; }

    let municipioFinal = '';
    if (municipioSelect) {
        if (municipioSelect.value === 'otro') {
            if (!customMunicipio) { AppState.addNotification('Debes escribir tu ubicación', 'error'); return; }
            municipioFinal = customMunicipio;
        } else if (municipioSelect.value) { 
            municipioFinal = municipioSelect.options[municipioSelect.selectedIndex]?.text || ''; 
        }
    }

    if (phoneNumber && (phoneNumber.length !== 7 || !/^\d+$/.test(phoneNumber))) { 
        AppState.addNotification('El teléfono debe tener 7 dígitos', 'error');
        return; 
    }
    
    if (password.length < 6) { AppState.addNotification('Contraseña mínimo 6 caracteres', 'error'); return; }
    if (password !== confirmPassword) { AppState.addNotification('Las contraseñas no coinciden', 'error'); return; }
    if (!termsAccepted) { AppState.addNotification('Debes aceptar los términos', 'error'); return; }

    if (btn) { btn.disabled = true; btn.textContent = 'Registrando...'; }

    try {
        const auth = AppState.firebase.auth;
        showLoadingScreen('Registrando cuenta...', 20);
        
        const cleanPrefix = phonePrefix.replace(/\D/g, '');
        const fullPhone = `${cleanPrefix}${phoneNumber}`;
        
        const userCredential = await auth.createUserWithEmailAndPassword(realEmail, password);
        
        if (!AppState.firebase.database) {
            AppState.firebase.database = firebase.database();
        }
        
        const database = AppState.firebase.database;
        const user = userCredential.user;
        
        updateLoadingProgress(30, 'Creando cuenta...');
        
        let defaultPermissions = { activated: false, gallo: false, isJudge: false, publicaciones: false, pedigri: false, ventas: false };
        try {
            const configSnapshot = await database.ref('config/defaultPermissions').once('value');
            if (configSnapshot.exists()) defaultPermissions = configSnapshot.val();
        } catch(e) {}
        
        let defaultMaxDevices = 1;
        try {
            const maxDevicesSnapshot = await database.ref('config/defaultMaxDevices').once('value');
            if (maxDevicesSnapshot.exists()) defaultMaxDevices = maxDevicesSnapshot.val();
        } catch(e) {}
        
        await user.updateProfile({ displayName: fullName });
        
        await database.ref('users/' + user.uid).set({
            uid: user.uid,
            displayName: fullName,
            realEmail: realEmail,
            phone: fullPhone,
            formattedPhone: cleanPrefix.slice(-3) + phoneNumber,
            phonePrefix: phonePrefix,
            registeredAt: Date.now(),
            registeredWith: 'email',
            maxDevices: defaultMaxDevices,
            activated: defaultPermissions.activated,
            gallo: defaultPermissions.gallo,
            isJudge: defaultPermissions.isJudge,
            publicaciones: defaultPermissions.publicaciones,
            ventas: defaultPermissions.ventas,
            pedigri: defaultPermissions.pedigri,
            ...(partyName && { partyName }),
            ...(representative && { representative }),
            ...(municipioFinal && { municipio: municipioFinal })
        });
        
        await loadUserProfile(user.uid);
        updateLoadingProgress(100, '¡Registro completo!');
        
        if (successDiv) successDiv.textContent = '✅ Cuenta creada. Pendiente de activación.';
        
        AppState.ui.formData.register = {};
        AppState.setLoading(false);
        hideLoadingScreen();
        
        if (loadingTimeoutId) { clearTimeout(loadingTimeoutId); loadingTimeoutId = null; }
        
        const esperarPerfil = () => {
            return new Promise((resolve) => {
                if (AppState.user.profile) return resolve(true);
                const unsubscribe = AppState.subscribe((propiedadCambiada) => {
                    if (propiedadCambiada === 'user' && AppState.user.profile) {
                        unsubscribe();
                        resolve(true);
                    }
                });
                setTimeout(() => { unsubscribe(); resolve(false); }, 5000);
            });
        };
        
        await esperarPerfil();
        
        AppState.setUser(user, { id: user.uid, displayName: fullName });
        AppState.setScreen('public');
        window.history.pushState({}, '', '/?section=public');
        
    } catch(error) {
        console.error('❌ Error registro:', error);
        let errorMessage = 'Error al registrar';
        if (error.code === 'auth/email-already-in-use') errorMessage = 'Este email ya está registrado';
        else if (error.code === 'auth/weak-password') errorMessage = 'Contraseña muy débil';
        else if (error.code === 'auth/invalid-email') errorMessage = 'Email inválido';
        AppState.addNotification(errorMessage, 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Crear cuenta'; }
        hideLoadingScreen();
    }
};

let deferredPrompt;
let userCanceled = false;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    if (!userCanceled) deferredPrompt = e;
    if (!(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) && !userCanceled) {
        const installOverlay = document.getElementById('installOverlay');
        if (installOverlay) installOverlay.style.display = 'block';
    }
});

function handleInstallClick() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        if (window.AppState && AppState.addNotification) AppState.addNotification('📱 INSTRUCCIÓN: Presiona "INSTALAR" para continuar', 'warning', 5000);
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') { userCanceled = false; }
            else { userCanceled = true; }
            deferredPrompt = null;
            const installOverlay = document.getElementById('installOverlay');
            if (installOverlay) installOverlay.style.display = 'none';
        });
    }
}

window.addEventListener('appinstalled', () => {
    const installOverlay = document.getElementById('installOverlay');
    if (installOverlay) installOverlay.style.display = 'none';
    userCanceled = false;
    if (window.AppState && AppState.addNotification) AppState.addNotification('✅ ¡INSTALACIÓN EXITOSA! Disponible en tus aplicaciones.', 'success', 8000);
});

if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {

    userCanceled = false;
}

        }
        checkIfEverythingLoaded();

    const currentPath = window.location.pathname;

    if (isRootWithoutSection && RecurrentUserManager.isRecurrent()) {
        const lastScreen = localStorage.getItem('lastScreen');
        if (lastScreen && lastScreen !== 'public' && lastScreen !== 'login') { window.history.replaceState({}, '', `/?section=${lastScreen}`); pantallaInicial = lastScreen; }
        else { window.history.replaceState({}, '', '/?section=public'); pantallaInicial = 'public'; }

        const section = sectionParam && allowedSections.includes(sectionParam) ? sectionParam : null;
        pantallaInicial = section;

    }

    showLoadingScreen(mensajeCarga, 0);

    }

    checkIfEverythingLoaded();
});
