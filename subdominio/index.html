    </style>

    function renderPedigriScreen() { return `<div class="screen"><div class="card"><h2>🧬 PEDIGRÍ GENÉTICO</h2><p>Árbol genealógico de gallos de élite</p><div style="height:200px; background:#f3ede3; border-radius:20px; display:flex; align-items:center; justify-content:center;">Aquí irá el árbol genealógico</div></div></div>`; }
    function renderShareScreen() { return `<div class="screen"><div class="card"><h2>🔗 COMPARTIR PLATAFORMA</h2><p>Comparte Legado Avícola con tu comunidad</p><button class="btn-primary" id="copyShareUrlBtn">Copiar enlace</button><button class="btn-secondary" id="shareNativeBtn" style="margin-top:10px;">Compartir nativo</button></div></div>`; }
    function renderAdminScreen() { return `<div class="screen"><div class="card"><h2>👑 ADMINISTRACIÓN</h2><div id="adminUserList"><p>Cargando usuarios...</p></div><button id="refreshAdminBtn" class="btn-secondary">Actualizar</button><div style="margin-top:20px;"><h3>Permisos Globales</h3><button id="cargarPermisosBtn" class="btn-primary">Cargar configuración</button></div></div></div>`; }
    function renderVentasScreen() { return `<div class="screen"><div class="card"><h2>💰 SUBASTAS Y VENTAS</h2><p>Galería de ejemplares en subasta</p><div class="skeleton" style="height:150px;"></div><div class="skeleton" style="height:150px;"></div></div></div>`; }
    function renderPerfilScreen() { let p = AppState.profile || {}; return `<div class="screen"><div class="card"><h2>👤 MI PERFIL</h2><p><strong>Nombre:</strong> ${p.displayName || 'Sin nombre'}</p><p><strong>Email:</strong> ${p.email || ''}</p><p><strong>Teléfono:</strong> ${p.phone || 'No registrado'}</p><p><strong>Activado:</strong> ${p.activated ? '✅ Sí' : '⏳ Pendiente'}</p><p><strong>Permisos:</strong> Admin:${p.gallo ? '✓' : '✗'} Juez:${p.isJudge ? '✓' : '✗'}</p><button id="editProfileBtn" class="btn-primary">Editar perfil</button></div></div>`; }
    function renderRoosterScreen() { return `<div class="screen"><div class="card"><h2>🏆 TORNEOS Y ENFRENTAMIENTOS</h2><p>Calendario de torneos profesionales</p><div class="skeleton" style="height:80px;"></div><div class="skeleton" style="height:80px;"></div><button class="btn-primary" id="crearTorneoBtn">Crear Torneo</button></div></div>`; }
    function renderJuezScreen() { return `<div class="screen"><div class="card"><h2>⚖️ PANEL DEL JUEZ</h2><p>Puntuaciones y arbitraje en vivo</p><div style="background:#f3ede3; padding:20px; border-radius:20px;"><select><option>Enfrentamiento activo #1</option></select><button class="btn-primary" style="margin-top:10px;">Registrar puntuación</button></div></div></div>`; }
    function renderConfiguracionesScreen() { return `<div class="screen"><div class="card"><h2>⚙️ CONFIGURACIÓN</h2><label><input type="checkbox" id="notifSettings"> Notificaciones push</label><br><label><input type="checkbox" id="darkModeToggle"> Modo oscuro</label><br><button id="logoutSettingsBtn" class="btn-secondary" style="margin-top:20px;">Cerrar sesión</button><button id="deleteAccountBtn" style="margin-top:10px; background:#b71c1c; color:white; border:none; padding:10px; border-radius:40px;">Eliminar cuenta</button></div></div>`; }
    function renderActivationPendingScreen() { return `<div class="screen"><div class="card" style="text-align:center;"><h2>⏳ CUENTA EN REVISIÓN</h2><p>Tu cuenta está pendiente de activación por un administrador.</p><div style="background:#fff3cd; padding:15px; border-radius:20px;">📌 Una vez activada podrás acceder a todas las funciones.</div><button id="checkActivationBtn" class="btn-primary" style="margin-top:20px;">Verificar ahora</button><button id="pendingLogoutBtn" class="btn-secondary">Cerrar sesión</button></div></div>`; }
    function renderPublicScreen() { return `<div class="screen"><div class="card"><h1>🐔 LEGADO AVÍCOLA</h1><p>La plataforma #1 para criadores profesionales de gallos de pelea.</p><div style="display:flex; gap:12px; margin:20px 0;"><button id="publicLoginBtn" class="btn-primary">Iniciar sesión</button><button id="publicRegisterBtn" class="btn-secondary">Crear cuenta</button></div><div class="social-links"><a href="${SOCIALS.whatsapp}" target="_blank">WhatsApp</a> | <a href="${SOCIALS.facebook}" target="_blank">Facebook</a> | <a href="${SOCIALS.instagram}" target="_blank">Instagram</a></div></div><div class="card"><h3>Características</h3><ul><li>✅ Torneos en vivo</li><li>✅ Pedigrí digital</li><li>✅ Comunidad élite</li><li>✅ Subastas exclusivas</li></ul></div></div>`; }
    function renderLoginScreen() { return `<div class="screen"><div class="card"><h2>🔐 ACCESO</h2><input type="email" id="loginEmail" class="input-field" placeholder="Correo electrónico"><input type="password" id="loginPass" class="input-field" placeholder="Contraseña"><button id="doLoginBtn" class="btn-primary">ACCEDER</button><button id="forgotPassBtn" style="background:none; border:none; margin-top:10px; color:var(--primary);">¿Olvidaste tu contraseña?</button><hr style="margin:15px 0;"><button id="googleLoginBtn" class="btn-secondary">🔐 Continuar con Google</button><button id="switchToRegisterScreen" style="margin-top:10px; background:none; border:none; color:var(--primary);">¿Nuevo? Regístrate aquí</button><input type="hidden" id="csrf_login"></div></div>`; }
    function renderRegisterScreen() { return `<div class="screen"><div class="card"><h2>📝 REGISTRO COMPLETO</h2><input id="regFullname" class="input-field" placeholder="Nombre completo *"><input id="regEmail" class="input-field" placeholder="Correo electrónico *"><select id="regMunicipio" class="input-field"><option>Selecciona municipio</option><option>Tuxtla Gutiérrez</option><option>San Cristóbal</option><option>Comitán</option><option>Tapachula</option><option>Otro</option></select><input id="regPhone" class="input-field" placeholder="Teléfono (7 dígitos)"><input id="regPass" class="input-field" type="password" placeholder="Contraseña *"><input id="regConfirm" class="input-field" type="password" placeholder="Confirmar contraseña *"><label><input type="checkbox" id="termsCheckbox"> Acepto los <a href="#" id="termsLink">Términos y Condiciones</a></label><button id="completeRegisterAction" class="btn-primary" style="margin-top:15px;">CREAR CUENTA</button><button id="backToLoginFromReg" class="btn-secondary">Volver al login</button><input type="hidden" id="csrf_register"></div></div>`; }

    function renderTopBar() { if(AppState.user && AppState.profile) return `<div class="top-bar-logged"><div class="nav-scroll"><button class="nav-btn" data-nav="public">🏠 Inicio</button>${AppState.profile.publicaciones ? '<button class="nav-btn" data-nav="publicaciones">📢 Publicaciones</button>' : ''}<button class="nav-btn" data-nav="rooster">🏆 Torneos</button>${AppState.profile.ventas ? '<button class="nav-btn" data-nav="ventas">💰 Subastas</button>' : ''}${AppState.profile.isJudge ? '<button class="nav-btn" data-nav="juez">⚖️ Juez</button>' : ''}${AppState.profile.pedigri ? '<button class="nav-btn" data-nav="pedigri">🧬 Pedigrí</button>' : ''}${AppState.profile.gallo ? '<button class="nav-btn" data-nav="admin">👑 Admin</button>' : ''}</div><div class="avatar-trigger" id="openSidebarBtn">${(AppState.profile.displayName || 'U').charAt(0)}</div></div>`; else return `<div class="top-bar-public"><span>🐓 LEGADO AVÍCOLA ELITE</span><div><button id="topLoginBtn" style="background:var(--gold); color:#1e1b16; border:none; padding:8px 20px; border-radius:40px; font-weight:bold;">Acceder</button></div></div>`; }

    async function renderApp() { if(window._rendering) return; window._rendering = true; try { _0x5f3a(); if(_0x1f7a()) { document.getElementById('app-root').innerHTML = '<div style="padding:80px;text-align:center">Dominio no autorizado</div>'; return; } let screen = AppState.currentScreen; let content = ''; if(screen === 'public') content = renderPublicScreen(); else if(screen === 'login') content = renderLoginScreen(); else if(screen === 'register') content = renderRegisterScreen(); else if(screen === 'activation_pending') content = renderActivationPendingScreen(); else if(screen === 'publicaciones') content = renderPublicacionesScreen(); else if(screen === 'pedigri') content = renderPedigriScreen(); else if(screen === 'share') content = renderShareScreen(); else if(screen === 'admin') content = renderAdminScreen(); else if(screen === 'ventas') content = renderVentasScreen(); else if(screen === 'perfil') content = renderPerfilScreen(); else if(screen === 'rooster') content = renderRoosterScreen(); else if(screen === 'juez') content = renderJuezScreen(); else if(screen === 'configuraciones') content = renderConfiguracionesScreen(); else content = renderPublicScreen(); let finalHtml = renderTopBar() + content + footerAccordion(); document.getElementById('app-root').innerHTML = finalHtml; attachEvents(); updateSidebarContent(); } catch(e) { console.error(e); } finally { window._rendering = false; } }
    function footerAccordion() { return `<div class="footer-accordion"><div class="accordion-header" data-accordion="info">📌 Información Legal <span>▼</span></div><div id="accordion-info" class="accordion-content"><p>Legado Avícola - Todos los derechos reservados. Plataforma certificada.</p></div><div class="accordion-header" data-accordion="contact">📞 Contacto <span>▼</span></div><div id="accordion-contact" class="accordion-content"><a href="${SOCIALS.whatsapp}">WhatsApp</a> | <a href="${SOCIALS.facebook}">Facebook</a></div></div>`; }
    function attachEvents() { document.getElementById('doLoginBtn')?.addEventListener('click', handleLogin); document.getElementById('completeRegisterAction')?.addEventListener('click', handleCompleteRegister); document.getElementById('switchToRegisterScreen')?.addEventListener('click', () => navigateTo('register')); document.getElementById('backToLoginFromReg')?.addEventListener('click', () => navigateTo('login')); document.getElementById('topLoginBtn')?.addEventListener('click', () => navigateTo('login')); document.getElementById('publicLoginBtn')?.addEventListener('click', () => navigateTo('login')); document.getElementById('publicRegisterBtn')?.addEventListener('click', () => navigateTo('register')); document.getElementById('openSidebarBtn')?.addEventListener('click', openSidebar); document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar); document.getElementById('forgotPassBtn')?.addEventListener('click', resetPassword); document.getElementById('pendingLogoutBtn')?.addEventListener('click', handleLogout); document.getElementById('logoutSettingsBtn')?.addEventListener('click', handleLogout); document.querySelectorAll('.accordion-header').forEach(header => { header.addEventListener('click', () => { let id = header.getAttribute('data-accordion'); let content = document.getElementById(`accordion-${id}`); if(content) content.style.display = content.style.display === 'block' ? 'none' : 'block'; }); }); document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', (e) => navigateTo(el.getAttribute('data-nav')))); }
    function updateSidebarContent() { let perms = AppState.profile || {}; let items = `<div class="sidebar-item" data-nav="perfil">👤 Mi Perfil</div><div class="sidebar-item" data-nav="share">🔗 Compartir</div>${perms.ventas ? '<div class="sidebar-item" data-nav="ventas">💰 Subastas</div>' : ''}${perms.isJudge ? '<div class="sidebar-item" data-nav="juez">⚖️ Juez</div>' : ''}<div class="sidebar-item" data-nav="configuraciones">⚙️ Configuración</div>${perms.gallo ? '<div class="sidebar-item" data-nav="admin">🔧 Admin</div>' : ''}<div class="sidebar-item" id="logoutSidebarBtn">🚪 Cerrar Sesión</div>`; document.getElementById('sidebarMenuItems').innerHTML = items; document.querySelectorAll('.sidebar-item[data-nav]').forEach(el => el.addEventListener('click', () => { navigateTo(el.getAttribute('data-nav')); closeSidebar(); })); document.getElementById('logoutSidebarBtn')?.addEventListener('click', () => { handleLogout(); closeSidebar(); }); if(AppState.profile) { document.getElementById('sidebarName').innerText = AppState.profile.displayName || 'Usuario'; document.getElementById('sidebarAvatar').innerText = (AppState.profile.displayName || 'U').charAt(0); } }
    function openSidebar() { document.getElementById('mainSidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('active'); }
    function closeSidebar() { document.getElementById('mainSidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('active'); }
    async function navigateTo(section) { if(esGooglebot()) return; closeSidebar(); let profile = AppState.profile || {}; if(section === 'admin' && !profile.gallo) { AppState.addNotification('Sin permisos de administrador', 'error'); return; } if((section === 'juez' && !profile.isJudge) || (section === 'publicaciones' && !profile.publicaciones) || (section === 'ventas' && !profile.ventas) || (section === 'pedigri' && !profile.pedigri)) { AppState.addNotification('Permiso denegado para esta sección', 'warning'); return; } if(!AppState.user && !['public', 'login', 'register'].includes(section)) { sessionStorage.setItem('redirectAfterLogin', section); navigateTo('login'); return; } AppState.setScreen(section); renderApp(); }

    function setupAuthListener() { if(!AppState.firebase.auth) return; AppState.firebase.auth.onAuthStateChanged(async (user) => { if(user) { let profile = await loadUserProfile(user.uid); let deviceOk = await verificarDispositivo(user); if(!deviceOk) { await AppState.firebase.auth.signOut(); return; } if(profile.activated === true) AppState.setScreen(localStorage.getItem('lastScreen') || 'public'); else AppState.setScreen('activation_pending'); renderApp(); } else { AppState.clearUser(); if(!['public', 'login', 'register'].includes(AppState.currentScreen)) AppState.setScreen('public'); renderApp(); } }); }

    // LOADING
    let progress = 0;
    function startLoading() { let interval = setInterval(() => { if(progress < 90) { progress += Math.random() * 8; document.getElementById('loadFill') && (document.getElementById('loadFill').style.width = Math.min(progress, 90) + '%'); document.getElementById('loadStep') && (document.getElementById('loadStep').innerText = 'Cargando módulos... ' + Math.floor(progress) + '%'); } }, 200); setTimeout(() => { clearInterval(interval); document.getElementById('loading-screen').style.opacity = '0'; setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; document.getElementById('app-root').style.display = 'block'; renderApp(); }, 300); }, 2000); }

    window.onload = async () => { if(esGooglebot()) { document.getElementById('loading-screen').style.display = 'none'; document.getElementById('app-root').style.display = 'block'; document.getElementById('app-root').innerHTML = '<div>Contenido público indexado</div>'; return; } await initializeFirebase(); startLoading(); setInterval(() => { let csrf = document.getElementById('csrf_login'); if(csrf) csrf.value = generateCSRFToken('login'); let csrfReg = document.getElementById('csrf_register'); if(csrfReg) csrfReg.value = generateCSRFToken('register'); }, 500); };
    window.navigateTo = navigateTo;
    window.AppState = AppState;
</script>
