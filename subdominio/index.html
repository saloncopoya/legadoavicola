    async function navigateTo(section) { if(esGooglebot()) return; closeSideMenu(); if(section !== 'login') localStorage.setItem('lastScreen', section); if(section==='share') sessionStorage.setItem('shareIntent','true'); let profile = AppState.profile || {}; if(section==='admin' && !profile.gallo) { AppState.addNotification('Sin permisos','error'); return; } if(section==='juez' && !profile.isJudge && !profile.gallo) { AppState.addNotification('Sin permisos','error'); return; } if((section==='publicaciones'&&!profile.publicaciones)||(section==='pedigri'&&!profile.pedigri)||(section==='ventas'&&!profile.ventas)) { AppState.addNotification('Permiso denegado','warning'); return; } if(!AppState.user && !['public','login','share','rooster'].includes(section)) { sessionStorage.setItem('redirectAfterLogin', section); navigateTo('login'); return; } AppState.setScreen(section); renderApp(); }

    async function handleLogin() { if(!validarCSRF('login')) return; let email=document.getElementById('login-email')?.value; let pass=document.getElementById('login-pass')?.value; if(!email||!pass) return; if(!RateLimiter.canAttempt(`login_${email}`)) { AppState.addNotification(`Espera ${Math.ceil(RateLimiter.getWaitTime(`login_${email}`)/60000)} min`,'error'); return; } RateLimiter.recordAttempt(`login_${email}`); AppState.setLoading(true); try { await AppState.firebase.auth.signInWithEmailAndPassword(email,pass); } catch(e){ handleFirebaseError(e); AppState.setLoading(false); } }

    async function handleCompleteRegister() { /* validaciones completas omitidas por longitud pero placeholder */ AppState.addNotification('Registro completo simulado','success'); }

    async function handleLogout() { closeSideMenu(); AppState.persistentCache.clearUserCache(AppState.user?.uid); sessionStorage.clear(); localStorage.removeItem('legado_usuario_recurrente'); if(window.google?.accounts?.id) google.accounts.id.disableAutoSelect(); if(AppState.firebase.auth) await AppState.firebase.auth.signOut(); AppState.clearUser(); navigateTo('public'); renderApp(); }

    function setupAuthListener() { if(!AppState.firebase.auth) return; AppState.firebase.auth.onAuthStateChanged(async (user)=>{ if(user){ let profile = await loadUserProfile(user.uid); let canAccess = await verificarDispositivo(user); if(!canAccess) { await AppState.firebase.auth.signOut(); return; } if(profile.activated === false) AppState.setScreen('activation_pending'); else AppState.setScreen(localStorage.getItem('lastScreen') || 'public'); renderApp(); } else { AppState.clearUser(); if(AppState.currentScreen !== 'login') AppState.setScreen('public'); renderApp(); } }); }

    // fake loading progress
    let loadInterval;
    function startLoadingMonitor() { let percent=0; loadInterval = setInterval(()=>{ if(percent<90){ percent+=Math.random()*8; let fill=document.getElementById('load-progress-fill'); if(fill) fill.style.width=Math.min(percent,90)+'%'; } },300); setTimeout(()=>{ clearInterval(loadInterval); document.getElementById('loading-screen').style.display='none'; document.getElementById('social-app').style.display='block'; AppState.setLoading(false); renderApp(); }, 1500); }

    window.onload = async()=>{ if(esGooglebot()){ document.getElementById('loading-screen').style.display='none'; document.getElementById('social-app').style.display='block'; document.getElementById('social-app').innerHTML='<div>Contenido Público</div>'; return; } await initializeFirebase(); startLoadingMonitor(); document.getElementById('side-overlay')?.addEventListener('click',closeSideMenu); };
    window.navigateTo = navigateTo;
    window.handleLogin = handleLogin;
    window.handleLogout = handleLogout;
    // CSRFS
    if(typeof generateCSRFToken === 'function'){ setInterval(()=>{ let inp = document.getElementById('csrf_login'); if(inp) inp.value = generateCSRFToken('login'); },500); }
