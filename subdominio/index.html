<script>
    // ==============================================
// SISTEMA OFFLINE TOTAL - SINCRONIZACIÓN CON FIREBASE
// ==============================================

// Configurar IndexedDB para almacenar datos offline
const OfflineDB = {
    dbName: 'LegadoAvicolaDB',
    dbVersion: 2,
    db: null,
    
    async init() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.dbVersion);
            
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                this.db = request.result;
                resolve(this.db);
            };
            
            request.onupgradeneeded = (event) => {
    const db = event.target.result;
    
    // Crear almacenes para cada tipo de dato
    if (!db.objectStoreNames.contains('users')) {
        db.createObjectStore('users', { keyPath: 'uid' });
    }
    if (!db.objectStoreNames.contains('subastas')) {
        db.createObjectStore('subastas', { keyPath: 'id' });
    }
    if (!db.objectStoreNames.contains('torneos')) {
        db.createObjectStore('torneos', { keyPath: 'id' });
    }
    if (!db.objectStoreNames.contains('publicaciones')) {
        db.createObjectStore('publicaciones', { keyPath: 'id' });
    }

     if (!db.objectStoreNames.contains('pedigris')) {
        db.createObjectStore('pedigris', { keyPath: 'id' });
    }
    if (!db.objectStoreNames.contains('peleas')) {
        db.createObjectStore('peleas', { keyPath: 'id' });
    }
    if (!db.objectStoreNames.contains('configuraciones')) {
        db.createObjectStore('configuraciones', { keyPath: 'key' });
    }
    if (!db.objectStoreNames.contains('contenido_compartido')) {
        db.createObjectStore('contenido_compartido', { keyPath: 'id' });
    }
    // ================================================
    if (!db.objectStoreNames.contains('pendingSync')) {
        db.createObjectStore('pendingSync', { keyPath: 'id', autoIncrement: true });
    }
    if (!db.objectStoreNames.contains('appState')) {
        db.createObjectStore('appState', { keyPath: 'key' });
    }
};
        });
    },
    
    async set(store, key, data) {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([store], 'readwrite');
            const objectStore = transaction.objectStore(store);
            const request = objectStore.put({ ...data, [key]: data[key] || key });
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
        });
    },
    
    async get(store, key) {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([store], 'readonly');
            const objectStore = transaction.objectStore(store);
            const request = objectStore.get(key);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    },
    
    async getAll(store) {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([store], 'readonly');
            const objectStore = transaction.objectStore(store);
            const request = objectStore.getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });
    },
    
    async delete(store, key) {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([store], 'readwrite');
            const objectStore = transaction.objectStore(store);
            const request = objectStore.delete(key);
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
        });
    },
    
    async clear(store) {
        if (!this.db) await this.init();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([store], 'readwrite');
            const objectStore = transaction.objectStore(store);
            const request = objectStore.clear();
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
        });
    },
    
    // Guardar operación pendiente para sincronizar después
    async addPendingSync(operation, data) {
        const pending = {
            operation: operation,
            data: data,
            timestamp: Date.now(),
            retries: 0
        };
        return await this.set('pendingSync', Date.now().toString(), pending);
    },
    
    // Obtener todas las operaciones pendientes
    async getPendingSync() {
        return await this.getAll('pendingSync');
    },
    
    // Eliminar operación sincronizada
    async removePendingSync(id) {
        return await this.delete('pendingSync', id);
    }
};

// Inicializar OfflineDB al cargar
OfflineDB.init().then(() => {
    console.log('✅ IndexedDB inicializado para offline total');
}).catch(err => {
    console.error('❌ Error inicializando IndexedDB:', err);
});

// Sincronizador de datos cuando hay conexión
let syncInProgress = false;

async function syncOfflineData() {
    if (syncInProgress) return;
    if (!navigator.onLine) return;
    if (!AppState.firebase.database) return;
    
    syncInProgress = true;
    console.log('🔄 Iniciando sincronización de datos offline...');
    
    try {
        const pendingOps = await OfflineDB.getPendingSync();
        
        if (pendingOps.length === 0) {
            console.log('✅ No hay datos pendientes de sincronizar');
            syncInProgress = false;
            return;
        }
        
        console.log(`📦 Sincronizando ${pendingOps.length} operaciones pendientes...`);
        
        for (const op of pendingOps) {
            try {
                const { operation, data } = op;
                
                switch(operation) {
                    case 'CREATE_SUBASTA':
                        await AppState.firebase.database.ref('subastas/' + data.id).set(data);
                        break;
                    case 'UPDATE_SUBASTA':
                        await AppState.firebase.database.ref('subastas/' + data.id).update(data);
                        break;
                    case 'DELETE_SUBASTA':
                        await AppState.firebase.database.ref('subastas/' + data.id).remove();
                        break;
                    case 'CREATE_TORNEO':
                        await AppState.firebase.database.ref('torneos/' + data.id).set(data);
                        break;
                    case 'CREATE_PUBLICACION':
                        await AppState.firebase.database.ref('publicaciones/' + data.id).set(data);
                        break;
                    // Agrega más casos según necesites
                }
                
                await OfflineDB.removePendingSync(op.id);
                console.log(`✅ Sincronizado: ${operation}`);
                
            } catch (err) {
                console.error(`❌ Error sincronizando ${op.operation}:`, err);
                // Incrementar reintentos
                op.retries++;
                if (op.retries < 5) {
                    await OfflineDB.set('pendingSync', op.id, op);
                } else {
                    await OfflineDB.removePendingSync(op.id);
                    console.warn(`⚠️ Operación ${op.operation} descartada después de 5 reintentos`);
                }
            }
        }
        
        AppState.addNotification(`✅ Sincronizados ${pendingOps.length} datos offline`, 'success');
        
    } catch (error) {
        console.error('❌ Error en sincronización:', error);
    } finally {
        syncInProgress = false;
    }
}

// Escuchar cambios de conexión
window.addEventListener('online', async () => {
    console.log('🌐 Conexión restablecida - Sincronizando datos...');
    AppState.addNotification('✅ Conexión restablecida - Sincronizando datos offline', 'success');
    await syncOfflineData();
    
    // Recargar datos desde Firebase
    if (AppState.user.current && AppState.firebase.database) {
        await loadAllFirebaseDataOffline();
    }
});

window.addEventListener('offline', () => {
    console.log('📴 Sin conexión - Modo offline activado');
});

// Cargar TODOS los datos de Firebase al iniciar (para tenerlos offline)
async function loadAllFirebaseDataOffline() {
    if (!AppState.firebase.database) return;
    if (!navigator.onLine) return;
    
    console.log('📥 Cargando datos de Firebase para modo offline...');
    
    try {
    
        // Cargar subastas
        const subastasSnapshot = await AppState.firebase.database.ref('subastas').once('value');
        if (subastasSnapshot.exists()) {
            const subastas = subastasSnapshot.val();
            for (const [id, data] of Object.entries(subastas)) {
                await OfflineDB.set('subastas', id, { id, ...data });
            }
            console.log(`✅ Cargadas ${Object.keys(subastas).length} subastas`);
        }
        
        // Cargar torneos
        const torneosSnapshot = await AppState.firebase.database.ref('torneos').once('value');
        if (torneosSnapshot.exists()) {
            const torneos = torneosSnapshot.val();
            for (const [id, data] of Object.entries(torneos)) {
                await OfflineDB.set('torneos', id, { id, ...data });
            }
            console.log(`✅ Cargados ${Object.keys(torneos).length} torneos`);
        }
        
        // Cargar publicaciones
        const publicacionesSnapshot = await AppState.firebase.database.ref('publicaciones').once('value');
        if (publicacionesSnapshot.exists()) {
            const publicaciones = publicacionesSnapshot.val();
            for (const [id, data] of Object.entries(publicaciones)) {
                await OfflineDB.set('publicaciones', id, { id, ...data });
            }
            console.log(`✅ Cargadas ${Object.keys(publicaciones).length} publicaciones`);
        }
        
        AppState.addNotification('✅ Datos sincronizados para modo offline', 'success');
        
    } catch (error) {
        console.error('❌ Error cargando datos offline:', error);
    }
}

function formatTime(timestamp) {
    if (!timestamp) return 'Ahora';
    const now = new Date(), postDate = new Date(timestamp), diff = now - postDate;
    const minutes = Math.floor(diff / 60000), hours = Math.floor(diff / 3600000), days = Math.floor(diff / 86400000);
    if (minutes < 1) return 'Ahora';
    if (minutes < 60) return `${minutes} min`;
    if (hours < 24) return `${hours} h`;
    if (days < 7) return `${days} d`;
    return postDate.toLocaleDateString();
}

function sanitizarInput(texto) {
    if (!texto) return '';
    if (typeof texto !== 'string') texto = String(texto);
    
    const caracteresPeligrosos = {
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
        '`': '&#96;', '$': '&#36;', '\\': '&#92;', '/': '&#47;', '=': '&#61;', '(': '&#40;', ')': '&#41;'
    };
    
    let sanitizado = texto.replace(/[&<>"'`$\\\/=()]/g, char => caracteresPeligrosos[char]);
    
    const palabrasClave = ['script', 'javascript', 'onerror', 'onload', 'eval', 'document', 'window', 'location', 'cookie'];
    palabrasClave.forEach(palabra => {
        sanitizado = sanitizado.replace(new RegExp(`\\b${palabra}\\b`, 'gi'), `[${palabra.toUpperCase()}_BLOQUEADO]`);
    });
    
    if (sanitizado.length > 10000) sanitizado = sanitizado.substring(0, 10000) + '... [TEXTO TRUNCADO]';
    return sanitizado;
}

// ==============================================
// RATE LIMITER
// ==============================================
const RateLimiter = {
    recordAttempt(action) {
        const key = `rate_${action}`;
        const now = Date.now();
        const attempts = JSON.parse(localStorage.getItem(key) || '[]');
        const recent = attempts.filter(time => now - time < 900000);
        recent.push(now);
        localStorage.setItem(key, JSON.stringify(recent));
        return recent.length;
    },
    canAttempt(action, maxAttempts = 5, timeWindow = 900000) {
        const key = `rate_${action}`;
        const now = Date.now();
        const attempts = JSON.parse(localStorage.getItem(key) || '[]');
        const recent = attempts.filter(time => now - time < timeWindow);
        localStorage.setItem(key, JSON.stringify(recent));
        return recent.length < maxAttempts;
    },
    getWaitTime(action, maxAttempts = 5) {
        const key = `rate_${action}`;
        const now = Date.now();
        const attempts = JSON.parse(localStorage.getItem(key) || '[]');
        if (attempts.length < maxAttempts) return 0;
        const oldest = Math.min(...attempts);
        const waitTime = 900000 - (now - oldest);
        return waitTime > 0 ? Math.ceil(waitTime / 1000) : 0;
    }
};

// ==============================================
// FINGERPRINT DE DISPOSITIVO
// ==============================================
let cachedFingerprintPromise = null;

function generateHash(str) {
    if (cachedFingerprintPromise) return cachedFingerprintPromise;
    
    if (window.crypto && window.crypto.subtle) {
        cachedFingerprintPromise = crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
            .then(hash => Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join(''));
        return cachedFingerprintPromise;
    } else {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash = hash & hash;
        }
        cachedFingerprintPromise = Promise.resolve(hash.toString(36));
        return cachedFingerprintPromise;
    }
}

window.getDeviceFingerprint = function() {
    try {
        let gpuRenderer = 'unknown';
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            }
        } catch(e) {}
        
        const cpuCores = navigator.hardwareConcurrency || 'unknown';
        const pixelRatio = window.devicePixelRatio || 1;
        const physicalResolution = `${Math.round(screen.width * pixelRatio)}x${Math.round(screen.height * pixelRatio)}`;
        
        const ua = navigator.userAgent;
        let osFamily = 'unknown';
        if (ua.includes('Android')) osFamily = 'android';
        else if (ua.includes('iPhone') || ua.includes('iPad')) osFamily = 'ios';
        else if (ua.includes('Windows')) osFamily = 'windows';
        else if (ua.includes('Mac OS')) osFamily = 'macos';
        else if (ua.includes('Linux')) osFamily = 'linux';
        
        let architecture = 'unknown';
        if (ua.includes('arm64') || ua.includes('aarch64')) architecture = 'arm64';
        else if (ua.includes('arm')) architecture = 'arm';
        else if (ua.includes('x86_64') || ua.includes('WOW64')) architecture = 'x64';
        
        const components = { gpu: gpuRenderer, cores: cpuCores, resolution: physicalResolution, os: osFamily, arch: architecture };
        const uniqueString = `${gpuRenderer}|${cpuCores}|${physicalResolution}|${osFamily}|${architecture}`;
        
        return generateHash(uniqueString).then(hash => ({ fingerprint: hash, components: components, userAgent: ua }));
    } catch(error) { return Promise.reject(error); }
};

async function verificarDispositivo(user) {
    if (!user) return false;
    
    if (!AppState.firebase.database) {
        try { AppState.firebase.database = firebase.database(); } catch(e) { return false; }
    }
    
    try {
        const currentDevice = await getDeviceFingerprint();
        const database = AppState.firebase.database;
        const userSnapshot = await database.ref('users/' + user.uid).once('value');
        
        if (!userSnapshot.exists()) return true;
        
        const userProfile = userSnapshot.val();
        const maxDevices = userProfile.maxDevices || 1;
        const devicesSnapshot = await database.ref(`dispositivos_autorizados/${user.uid}`).once('value');
        const authorizedDevices = devicesSnapshot.val() || {};
        const deviceExists = authorizedDevices[currentDevice.fingerprint];
        
        if (deviceExists) {
            await database.ref(`dispositivos_autorizados/${user.uid}/${currentDevice.fingerprint}/lastLogin`).set(firebase.database.ServerValue.TIMESTAMP);
            return true;
        } else {
            const devicesCount = Object.keys(authorizedDevices).length;
            if (devicesCount < maxDevices) {
                await database.ref(`dispositivos_autorizados/${user.uid}/${currentDevice.fingerprint}`).set({
                    fingerprint: currentDevice.fingerprint,
                    firstSeen: firebase.database.ServerValue.TIMESTAMP,
                    lastLogin: firebase.database.ServerValue.TIMESTAMP,
                    verified: true,
                    info: currentDevice.components,
                    userAgent: currentDevice.userAgent
                });
                return true;
            } else {
                await database.ref(`intentos_bloqueados/${user.uid}`).push({ nombre: user.displayName || 'Usuario sin nombre' });
                await AppState.firebase.auth.signOut();
                AppState.addNotification(`🚫 LÍMITE DE DISPOSITIVOS ALCANZADO (${maxDevices}). Contacta al administrador.`, 'error', 8000);
                return false;
            }
        }
    } catch(error) { return false; }
}

        if (navigator.onLine && !AppState.ui.isLoading) {
            loginButton.style.display = 'flex';
        } else {
            loginButton.style.display = 'none';
        }

}

    
    


    function updateConnectionBar() {
    const connectionBar = document.getElementById('connection-status-bar');
    const connectionMessage = document.getElementById('connection-status-message');
    if (!connectionBar) return;

    connectionBar.removeEventListener('click', hideConnectionBar);
    connectionBar.addEventListener('click', hideConnectionBar);
    
    // Limpiar clases previas
    connectionBar.classList.remove('slow-connection', 'no-connection', 'connection-restored');
    
    if (!navigator.onLine) {
        // SIN ACCESO - GRIS TRANSPARENTE
        connectionBar.classList.add('visible', 'no-connection');
        connectionMessage.textContent = '🌐 Sin acceso a internet! Conéctate a una red...';
    } else if (isSlowConnection()) {
        // CONEXIÓN LENTA - ROJO TRANSPARENTE
        connectionBar.classList.add('visible', 'slow-connection');
        connectionMessage.textContent = '⚠️ Conexión lenta! Puede afectar el rendimiento.';
    } else if (connectionBar.classList.contains('visible')) {
        // CONEXIÓN RESTABLECIDA
        connectionBar.classList.add('connection-restored');
        connectionBar.style.background = 'rgba(76, 175, 80, 0.25)';
        connectionBar.style.backdropFilter = 'blur(12px)';
        connectionMessage.textContent = '✅ ¡Conexión restablecida! Todo funciona correctamente.';
        setTimeout(() => {
            connectionBar.classList.remove('visible', 'connection-restored', 'slow-connection', 'no-connection');
            connectionBar.style.transform = 'translateY(-100%)';
        }, 9000);
        return;
    }
}
    
window.addEventListener('online', () => {
    updateConnectionBar();
    toggleLoginButtonVisibility(); // ✅ Solo actualiza el botón Login
    // ✅ NO llamas a renderApp()
});
window.addEventListener('offline', () => {
    updateConnectionBar();
    toggleLoginButtonVisibility(); // ✅ Solo actualiza el botón Login
    // ✅ NO llamas a renderApp()
});

    
if ('connection' in navigator) {
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) conn.addEventListener('change', updateConnectionBar);
}

// CARGA INICIAL - SOLO SI HAY INTERNET
// ==============================================
if (navigator.onLine) {
    document.addEventListener('DOMContentLoaded', updateConnectionBar);
    window.addEventListener('load', updateConnectionBar);
}

async function handleLogin() {
    const email = document.getElementById('loginPhone')?.value.trim();
    const password = document.getElementById('loginPassword')?.value;
    
    if (!email || !password) {
        AppState.addNotification('Completa todos los campos', 'warning');
        return;
    }
    
    const emailKey = `login_${email}`;
    if (!RateLimiter.canAttempt(emailKey, 3)) {
        AppState.addNotification('Demasiados intentos. Espera unos minutos.', 'error');
        return;
    }
    
    if (!AppState.firebase.isEnabled || !AppState.firebase.auth) {
        AppState.addNotification('Error: Firebase no inicializado', 'error');
        return;
    }
    
    showLoadingScreen('Iniciando sesión...', 30);
    
    try {
        RateLimiter.recordAttempt(emailKey);
        await AppState.firebase.auth.signInWithEmailAndPassword(email, password);
        if (!AppState.firebase.database) AppState.firebase.database = firebase.database();
             
        localStorage.removeItem(`rate_${emailKey}`);
        hideLoadingScreen();
        
    } catch (error) {
        console.log("🔴 CÓDIGO DE ERROR:", error.code);
        console.log("🔴 MENSAJE:", error.message);
        
        hideLoadingScreen();
        
        if (error.code === 'auth/invalid-login-credentials') {
            AppState.addNotification('❌ Email o contraseña incorrectos', 'error');
        } else if (error.code === 'auth/user-not-found') {
            AppState.addNotification('❌ No existe una cuenta con este email', 'error');
        } else if (error.code === 'auth/wrong-password') {
            AppState.addNotification('❌ Contraseña incorrecta', 'error');
        } else if (error.code === 'auth/too-many-requests') {
            AppState.addNotification('⚠️ Demasiados intentos. Espera unos minutos', 'error');
        } else {
            AppState.addNotification('❌ Error: ' + error.message, 'error');
        }
    }
}

async function resetPassword() {
    if (!AppState.firebase.isEnabled) {

}

async function handleCompleteRegister() {
    const fullName = sanitizarInput(document.getElementById('registerFullName')?.value || '');
    const realEmail = document.getElementById('registerRealEmail')?.value.trim() || '';
    const password = document.getElementById('registerPassword')?.value || '';
    const confirmPassword = document.getElementById('registerConfirmPassword')?.value || '';
    const termsAccepted = document.getElementById('registerTerms')?.checked || false;
    
    if (!fullName || !realEmail || !password || !confirmPassword) {
        AppState.addNotification('Completa todos los campos obligatorios', 'error');
        return;
    }
    if (password !== confirmPassword) {
        AppState.addNotification('Las contraseñas no coinciden', 'error');
        return;
    }
    if (password.length < 6) {
        AppState.addNotification('La contraseña debe tener al menos 6 caracteres', 'error');
        return;
    }
    if (!termsAccepted) {
        AppState.addNotification('Debes aceptar los términos y condiciones', 'error');
        return;
    }
    
    if (!AppState.firebase.isEnabled) {
        AppState.addNotification('Firebase no está inicializado', 'error');
        return;
    }
    
    showLoadingScreen('Registrando cuenta...', 20);
    const btn = document.getElementById('registerSubmitBtn');
    if (btn) btn.disabled = true;
    
    try {
        const userCredential = await AppState.firebase.auth.createUserWithEmailAndPassword(realEmail, password);
        if (!AppState.firebase.database) AppState.firebase.database = firebase.database();
        
        await userCredential.user.updateProfile({ displayName: fullName });
        
        await AppState.firebase.database.ref('users/' + userCredential.user.uid).set({
            uid: userCredential.user.uid,
            displayName: fullName,
            realEmail: realEmail,
            registeredAt: Date.now(),
            registeredWith: 'email',
            maxDevices: 1,
            activated: false,
            gallo: false,
            isJudge: false,
            publicaciones: false,
            ventas: false,
            pedigri: false
        });
        
        await loadUserProfile(userCredential.user.uid);
        AppState.addNotification('✅ Cuenta creada. Pendiente de activación.', 'success');
AppState.setScreen(SCREENS.PUBLIC);
        hideLoadingScreen();
        
    } catch (error) {
        hideLoadingScreen();
        if (error.code === 'auth/email-already-in-use') {
            AppState.addNotification('Este email ya está registrado', 'error');
        } else {
            AppState.addNotification('Error al registrar', 'error');
        }
    } finally {
        if (btn) btn.disabled = false;
    }
}

async function loadUserProfile(uid) {
    if (!AppState.firebase.database) AppState.firebase.database = firebase.database();
    
    try {
        // 1. PRIMERO: Intentar obtener de IndexedDB (NO localStorage)
        const cachedProfile = await OfflineDB.get('users', uid);
        
        if (cachedProfile) {
            console.log('📀 Perfil desde INDEXEDDB (offline)');
            // Guardar SOLO lo mínimo en localStorage para startup rápido
            localStorage.setItem('offline_user', JSON.stringify({
                uid: uid,
                displayName: cachedProfile.displayName,
               
            }));
            
            AppState.setUser(AppState.firebase.auth.currentUser, cachedProfile);
            return true;
        }
        
        // 2. SEGUNDO: Si no hay offline, traer de Firebase
        console.log('🌐 Perfil desde ONLINE (Firebase)');
        const snapshot = await AppState.firebase.database.ref('users/' + uid).once('value');
        
        if (snapshot.exists()) {
            const profile = { uid: uid, ...snapshot.val() };
             if (profile.id && !profile.uid) {
                profile.uid = profile.id;
                delete profile.id;
            }
            
            // Valores por defecto
            if (profile.activated === undefined) profile.activated = false;
            if (profile.gallo === undefined) profile.gallo = false;
            if (profile.isJudge === undefined) profile.isJudge = false;
            if (profile.publicaciones === undefined) profile.publicaciones = false;
            if (profile.pedigri === undefined) profile.pedigri = false;
            if (profile.ventas === undefined) profile.ventas = false;
            
            // Guardar en IndexedDB (el lugar CORRECTO para datos grandes)
            await OfflineDB.set('users', uid, profile);
            
            // Guardar SOLO lo mínimo en localStorage para startup rápido
            localStorage.setItem('offline_user', JSON.stringify({
                uid: uid,
                displayName: profile.displayName,
                email: profile.realEmail
            }));
            
            AppState.setUser(AppState.firebase.auth.currentUser, profile);
            return true;
        }
        return false;
        
    } catch (error) {
        console.error('Error cargando perfil:', error);
        AppState.addNotification('Error cargando perfil', 'error');
        return false;
    }
}

async function handleLogout() {
    const sideMenu = document.getElementById('side-menu');
    const overlay = document.getElementById('side-menu-overlay');
    if (sideMenu) sideMenu.style.right = '-350px';
    if (overlay) overlay.style.display = 'none';
    document.body.style.overflow = '';
    
    AppState.addNotification('Cerrando sesión...', 'warning');
    
    const currentUid = AppState.user.current?.uid;
    
    // ✅ CORREGIDO: Limpiar IndexedDB en lugar de persistentCache
    if (currentUid) {
        try {
            await OfflineDB.delete('users', currentUid);
            console.log('🗑️ Perfil eliminado de IndexedDB');
        } catch(e) {
            console.warn('Error limpiando IndexedDB:', e);
        }
    }
    
    // Limpiar localStorage
    localStorage.removeItem('offline_user');
    localStorage.removeItem('offline_profile');
    localStorage.removeItem('lastScreen');
    
    RecurrentUserManager.clear();
    
    try {
        if (window.firebase && window.firebase.auth) await window.firebase.auth().signOut();
    } catch(e) {}
    
    AppState.clearUser();
    sessionStorage.clear();
    
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.startsWith('firebase:') || key.startsWith('app_'))) {
            localStorage.removeItem(key);
        }
    }
    
    window.history.pushState({}, '', '/');
    setTimeout(() => { 
        if (!AppState.user.current) mostrarModalGoogleInferior(); 
    }, 1000);
}

window.navigateTo = function(section) {
   

    const pantallasValidas = Object.values(SCREENS);
    if (section && !pantallasValidas.includes(section)) {
        console.warn(`⚠️ Navegación a pantalla inválida: "${section}"`);
        section = SCREENS.PUBLIC;
    }
    
    const sideMenu = document.getElementById('side-menu');
    const overlay = document.getElementById('side-menu-overlay');
    if (sideMenu) sideMenu.style.right = '-350px';
    if (overlay) overlay.style.display = 'none';
    document.body.style.overflow = '';
    
if (section && section !== SCREENS.LOGIN && section !== SCREENS.ACTIVATION_PENDING) {
    localStorage.setItem('lastScreen', section);
    }
    
  if (section === SCREENS.LOGIN && AppState.user.current) {
    section = AppState.user.profile?.activated === false ? SCREENS.ACTIVATION_PENDING : SCREENS.PUBLIC;
}
    
    // ✅ SOLO CAMBIAR LA URL SI HAY INTERNET
    if (navigator.onLine) {
        const shareId = new URLSearchParams(window.location.search).get('share');
if (section === SCREENS.SHARE && shareId) {
            window.history.pushState({}, '', `/?share=${shareId}`);
        } else {
            window.history.pushState({}, '', `/?section=${section}`);
        }
    }
    
const pantallasPublicasNavigate = [SCREENS.PUBLIC, SCREENS.LOGIN, SCREENS.SHARE, SCREENS.VENTAS, SCREENS.ROOSTER];
if (!AppState.user.current && !pantallasPublicasNavigate.includes(section)) {
    AppState.ui.pendingScreen = section;
        if (!AppState.firebase.isEnabled) initializeFirebase();
        section = SCREENS.LOGIN;
    }
    
if (section === SCREENS.LOGIN && !AppState.firebase.isEnabled) {
    AppState.ui.pendingScreen = SCREENS.LOGIN;
        initializeFirebase();
        return;
    }
    
    AppState.setScreen(section);
};

async function handleGoogleCredentialResponse(response) {
    showLoadingScreen('Autenticando...', 50);
    
    try {
        if (!AppState.firebase.isEnabled) {
            const firebaseApp = firebase.initializeApp(window.FIREBASE_CONFIG);
            AppState.firebase.app = firebaseApp;
            AppState.firebase.auth = firebase.auth();
            AppState.firebase.isEnabled = true;
        }
        
        const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
        const result = await AppState.firebase.auth.signInWithCredential(credential);
        
        if (!AppState.firebase.database) AppState.firebase.database = firebase.database();
        
        const snapshot = await AppState.firebase.database.ref('users/' + result.user.uid).once('value');
        
        if (!snapshot.exists()) {
            const newUserProfile = {
                uid: result.user.uid,
                displayName: result.user.displayName || 'Usuario Google',
                realEmail: result.user.email || '',
                photoURL: result.user.photoURL || '',
                registeredAt: Date.now(),
                registeredWith: 'google',
                maxDevices: 1,
                activated: false,
                gallo: false,
                isJudge: false,
                publicaciones: false,
                ventas: false,
                pedigri: false
            };
            await AppState.firebase.database.ref('users/' + result.user.uid).set(newUserProfile);
            AppState.setUser(result.user, newUserProfile);
            AppState.addNotification('✅ Registro exitoso. Pendiente de activación.', 'success');
        } else {
            const profile = snapshot.val();
            const deviceInfo = await getDeviceFingerprint();
            const devicesSnapshot = await AppState.firebase.database.ref(`dispositivos_autorizados/${result.user.uid}`).once('value');
            const authorizedDevices = devicesSnapshot.val() || {};
            
            if (!authorizedDevices[deviceInfo.fingerprint]) {
                const maxDevices = profile.maxDevices || 1;
                if (Object.keys(authorizedDevices).length >= maxDevices) {
                    AppState.addNotification('LÍMITE DE DISPOSITIVOS ALCANZADO', 'error');
                    await AppState.firebase.auth.signOut();
                    hideLoadingScreen();
                    return;
                }
                await AppState.firebase.database.ref(`dispositivos_autorizados/${result.user.uid}/${deviceInfo.fingerprint}`).set({
                    fingerprint: deviceInfo.fingerprint,
                    firstSeen: firebase.database.ServerValue.TIMESTAMP,
                    lastLogin: firebase.database.ServerValue.TIMESTAMP,
                    verified: true
                });
            }
            
            if (profile.activated === true) RecurrentUserManager.markAsRecurrent();
            AppState.setUser(result.user, { id: result.user.uid, ...profile });
            
        }
        
AppState.setScreen(SCREENS.PUBLIC);
        hideLoadingScreen();
        
    } catch (error) {
        console.error('Error en Google login:', error);
        hideLoadingScreen();
        AppState.addNotification('Error al iniciar sesión con Google', 'error');
    }
}

let loadingInterval = null;

function checkIfEverythingLoaded() {
    if (loadingInterval) clearInterval(loadingInterval);
    
    let progress = 10;
    let intentos = 0;
    let timeoutMs = 20500;
    if (navigator.connection?.effectiveType === '4g') timeoutMs = 10000;
    else if (navigator.connection?.effectiveType === '3g') timeoutMs = 15000;
    else if (navigator.connection?.effectiveType === '2g' || navigator.connection?.effectiveType === 'slow-2g') timeoutMs = 25000;
    
    const MAX_INTENTOS = Math.ceil(timeoutMs / 200);
    
    loadingInterval = setInterval(() => {
        intentos++;
        if (progress < 90 && AppState.ui.isLoading) {
            progress += 5;
            updateLoadingProgress(progress, 'Cargando componentes...');
        }
        
        if (!AppState.ui.isLoading) {
            clearInterval(loadingInterval);
            updateLoadingProgress(100, '¡Listo!');
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                const socialApp = document.getElementById('social-app');
                if (loadingScreen) loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    if (loadingScreen) loadingScreen.style.display = 'none';
                    if (socialApp) socialApp.style.display = 'block';
                }, 500);
            }, 300);
        }
        
        if (intentos >= MAX_INTENTOS && AppState.ui.isLoading) {
            clearInterval(loadingInterval);
            AppState.setLoading(false);
            const loadingScreen = document.getElementById('loading-screen');
            const socialApp = document.getElementById('social-app');
            if (loadingScreen) loadingScreen.style.display = 'none';
            if (socialApp) socialApp.style.display = 'block';
        }
    }, 200);
}

// VALIDACIÓN DE PARÁMETROS URL (SEGURIDAD)
// ==============================================
function validarParametroURL(param) {
    const permitidos = ['share', 'section'];
    
    // Verificar que el parámetro está permitido
    if (!permitidos.includes(param)) return false;
    
    const valor = new URLSearchParams(window.location.search).get(param);
    
    // Si hay valor, verificar que no contenga caracteres peligrosos
    if (valor && /[<>'"]/g.test(valor)) {
        console.warn(`⚠️ Parámetro URL malicioso detectado: ${param}=${valor}`);
        // Limpiar la URL maliciosa
        window.history.replaceState({}, '', window.location.pathname);
        return false;
    }
    
    return true;
}

// Validar parámetros al cargar la página
function validarTodosLosParametros() {
    const urlParams = new URLSearchParams(window.location.search);
    let esSeguro = true;
    
    for (let [key, value] of urlParams.entries()) {
        if (!validarParametroURL(key)) {
            esSeguro = false;
            console.warn(`❌ Parámetro no permitido o malicioso: ${key}=${value}`);
        }
    }
    
    return esSeguro;
}

                <div style="background: white; border-radius: 12px; padding: 20px;">
                    <div style="margin-bottom: 15px;">

                        </label>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="display:flex; justify-content:space-between; align-items:center;">
                            <span>🌙 Modo oscuro</span>
                            <button onclick="guardarConfiguracion('modo_oscuro', event)" style="padding:8px 16px; background:#8B4513; color:white; border:none; border-radius:8px; cursor:pointer;">${preferencias.modo_oscuro === 'activado' ? '✅ Activado' : 'Activar'}</button>
                        </label>
                    </div>
                    <div>
                        <label style="display:flex; justify-content:space-between; align-items:center;">
                            <span>💾 Sincronización automática</span>
                            <button onclick="guardarConfiguracion('sincronizacion', event)" style="padding:8px 16px; background:#8B4513; color:white; border:none; border-radius:8px; cursor:pointer;">${preferencias.sincronizacion === 'activado' ? '✅ Activado' : 'Activar'}</button>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    `;
};

// Función auxiliar para guardar configuraciones offline
async function guardarConfiguracion(key, event) {
    const boton = event.target;
    const preferencias = await getDataOfflineFirst('configuraciones', 'user_prefs') || {};
    const nuevoEstado = preferencias[key] === 'activado' ? 'desactivado' : 'activado';
    preferencias[key] = nuevoEstado;
    await OfflineDB.set('configuraciones', 'user_prefs', preferencias);
    boton.textContent = nuevoEstado === 'activado' ? '✅ Activado' : 'Activar';
    AppState.addNotification(`Configuración guardada offline: ${key}`, 'success');
}

console.log('✅ Pantalla CONFIGURACIONES cargada desde script separado');
</script>
