    function renderTopBar() { if(AppState.user && AppState.profile) return `<div class="nav-top-logged"><div class="nav-buttons-scroll"><button data-nav="public">🏠 Inicio</button>${AppState.profile.publicaciones ? '<button data-nav="publicaciones">📢 Publicaciones</button>' : ''}<button data-nav="rooster">🏆 Torneos</button>${AppState.profile.ventas ? '<button data-nav="ventas">💰 Subastas</button>' : ''}${AppState.profile.isJudge ? '<button data-nav="juez">⚖️ Juez</button>' : ''}${AppState.profile.pedigri ? '<button data-nav="pedigri">🧬 Pedigrí</button>' : ''}</div><div class="avatar-circle" id="openSideBtn">${(AppState.profile.displayName||'U').charAt(0)}</div></div>`; 
    else return `<div class="public-top-senior"><span>🐓 LEGADO AVÍCOLA</span><div><button id="publicLoginBtn" style="background:var(--gold); color:#1e1b16; border:none; padding:6px 16px; border-radius:40px;">Acceder</button></div></div>`; }

    async function renderApp() { if(AppState._rendering) return; AppState._rendering=true; try { _0x5f3a(); if(_0x1f7a()) { document.getElementById('app-root').innerHTML='<div style="padding:80px;text-align:center">Dominio no autorizado</div>'; return; } let html = renderTopBar() + renderScreenByRoute(); document.getElementById('app-root').innerHTML = html; attachGlobalEvents(); updateSidebarContent(); } catch(e){ console.error(e); } finally { AppState._rendering=false; } }

    function updateSidebarContent() { let perms = AppState.profile || {}; let items = `<div class="side-item" data-nav="perfil">👤 Mi Perfil</div><div class="side-item" data-nav="share">🔗 Compartir</div>${perms.ventas ? '<div class="side-item" data-nav="ventas">💰 Subastas</div>' : ''}${perms.isJudge ? '<div class="side-item" data-nav="juez">⚖️ Juez</div>' : ''}<div class="side-item" data-nav="configuraciones">⚙️ Configuración</div>${perms.gallo ? '<div class="side-item" data-nav="admin">🔧 Crear Cotejo</div>' : ''}<div class="side-item" id="logoutSideBtn">🚪 Cerrar Sesión</div>`; document.getElementById('sideMenuDynamic').innerHTML = items; document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{ navigateTo(el.getAttribute('data-nav')); closeSidebar(); })); document.getElementById('logoutSideBtn')?.addEventListener('click',()=>handleLogout()); }
    function openSidebar() { document.getElementById('senior-sidebar').classList.add('open'); document.getElementById('global-overlay').classList.add('active'); }
    function closeSidebar() { document.getElementById('senior-sidebar').classList.remove('open'); document.getElementById('global-overlay').classList.remove('active'); }

    async function navigateTo(section) { if(esGooglebot()) return; closeSidebar(); let profile=AppState.profile||{}; if(section==='admin' && !profile.gallo) { AppState.addNotification('Sin privilegios','error'); return; } if((section==='juez'&&!profile.isJudge)||(section==='publicaciones'&&!profile.publicaciones)||(section==='ventas'&&!profile.ventas)||(section==='pedigri'&&!profile.pedigri)) { AppState.addNotification('Permiso denegado','warning'); return; } if(!AppState.user && !['public','login','register'].includes(section)) { sessionStorage.setItem('postLoginDest', section); navigateTo('login'); return; } AppState.setScreen(section); renderApp(); }

    async function handleLogin() { if(!validarCSRF('login')) return; let email=document.getElementById('loginEmail')?.value, pass=document.getElementById('loginPass')?.value; if(!email||!pass) return; if(!RateLimiter.canAttempt(`login_${email}`)) { AppState.addNotification(`Demasiados intentos, espera ${Math.ceil(RateLimiter.getWaitTime(`login_${email}`)/60000)} min`,'error'); return; } RateLimiter.recordAttempt(`login_${email}`); AppState.setLoading(true); try { await AppState.firebase.auth.signInWithEmailAndPassword(email,pass); } catch(e){ handleFirebaseError(e); AppState.setLoading(false); } }

    async function handleCompleteRegister() { if(!validarCSRF('register')) return; // validación completa skete, demo funcional
    let email=document.getElementById('regEmail')?.value; if(!email) { AppState.addNotification('Completa todos los campos','error'); return; } AppState.setLoading(true); try { let cred = await AppState.firebase.auth.createUserWithEmailAndPassword(email, document.getElementById('regPass').value); let uid = cred.user.uid; let defaultPerms = { activated: false, gallo: false, isJudge: false, publicaciones: false, ventas: false, pedigri: false, maxDevices: 1 }; await AppState.firebase.db.ref(`users/${uid}`).set({ displayName: document.getElementById('regFullname')?.value || 'Usuario', email, ...defaultPerms, registeredAt: Date.now() }); AppState.addNotification('Registro exitoso, espera activación', 'success'); navigateTo('public'); } catch(e){ handleFirebaseError(e); } finally { AppState.setLoading(false); } }

    function handleFirebaseError(e) { let msg='Error de autenticación'; if(e.code==='auth/email-already-in-use') msg='Email ya registrado'; else if(e.code==='auth/weak-password') msg='Contraseña débil'; AppState.addNotification(msg,'error'); }

    async function handleLogout() { closeSidebar(); AppState.persistentCache.clearUserCache(AppState.user?.uid); sessionStorage.clear(); if(window.google?.accounts?.id) google.accounts.id.disableAutoSelect(); if(AppState.firebase.auth) await AppState.firebase.auth.signOut(); AppState.clearUser(); navigateTo('public'); renderApp(); }

    function attachGlobalEvents() { document.getElementById('execLoginBtn')?.addEventListener('click', handleLogin); document.getElementById('completeRegisterBtn')?.addEventListener('click', handleCompleteRegister); document.getElementById('switchToRegister')?.addEventListener('click',()=>navigateTo('register')); document.getElementById('publicLoginBtn')?.addEventListener('click',()=>navigateTo('login')); document.getElementById('openSideBtn')?.addEventListener('click',openSidebar); document.getElementById('global-overlay')?.addEventListener('click',closeSidebar); document.getElementById('logoutSettings')?.addEventListener('click',handleLogout); document.getElementById('pendingLogoutBtn')?.addEventListener('click',handleLogout); document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',(e)=>navigateTo(el.getAttribute('data-nav')))); }

    function setupAuthListener() { if(!AppState.firebase.auth) return; AppState.firebase.auth.onAuthStateChanged(async (user)=>{ if(user){ let profile = await loadUserProfile(user.uid); let deviceOk = await verificarDispositivo(user); if(!deviceOk) { await AppState.firebase.auth.signOut(); return; } if(profile.activated === true) AppState.setScreen(localStorage.getItem('lastScreen') || 'public'); else AppState.setScreen('activation_pending'); renderApp(); } else { AppState.clearUser(); if(!['public','login','register'].includes(AppState.currentScreen)) AppState.setScreen('public'); renderApp(); } }); }

    // LOADING PROGRESS
    let prog=0, intervalProg;
    function fakeProgress() { intervalProg = setInterval(()=>{ if(prog<85) { prog+=Math.random()*7; document.getElementById('senior-progress-fill')&&(document.getElementById('senior-progress-fill').style.width=Math.min(prog,85)+'%'); } },200); setTimeout(()=>{ clearInterval(intervalProg); document.getElementById('loading-screen').style.opacity='0'; setTimeout(()=>{ document.getElementById('loading-screen').style.display='none'; document.getElementById('app-root').style.display='block'; renderApp(); },300); }, 2000); }

    window.onload = async()=>{ if(esGooglebot()) { document.getElementById('loading-screen').style.display='none'; document.getElementById('app-root').style.display='block'; document.getElementById('app-root').innerHTML='<div>Contenido Público Indexado</div>'; return; } await initializeFirebase(); fakeProgress(); };
    window.navigateTo = navigateTo; window.handleLogout = handleLogout;
    setInterval(()=>{ let csrf=document.getElementById('csrf_login'); if(csrf) csrf.value=generateCSRFToken('login'); let csrfReg=document.getElementById('csrf_register'); if(csrfReg) csrfReg.value=generateCSRFToken('register'); }, 500);
</script>
