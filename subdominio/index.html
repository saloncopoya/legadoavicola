            return Math.max(0, 15 * 60 * 1000 - (Date.now() - arr[arr.length - max]));

        clearAttempts(action) { delete this.attempts[action]; }
    };

    async function initializeFirebase() { 
        if(window.firebaseMainApp) return; 
        await new Promise(r => setTimeout(r, 150)); 
        try { 
            const app = firebase.initializeApp(window.FIREBASE_CONFIG, 'primary'); 
            window.firebaseMainApp = app; 
            AppState.firebase.auth = firebase.auth(app); 
            AppState.firebase.db = firebase.database(app); 
            setupAuthListener(); 
            console.log('Firebase Principal Conectado');
        } catch(e) { console.error('Firebase init error:', e); } 
    }
    function getAdminDatabase() { 
        if(window.__adminDatabaseInstance) return window.__adminDatabaseInstance; 
        try { 
            const adminApp = firebase.initializeApp(FIREBASE_ADMIN_CONFIG, 'adminSecondary'); 
            window.__adminDatabaseInstance = firebase.database(adminApp); 
            return window.__adminDatabaseInstance; 
        } catch(e) { return null; } 
    }
    async function loadUserProfile(uid) { 
        if(!AppState.firebase.db) await initializeFirebase(); 
        let cache = AppState.persistentCache.get(`profile_full_${uid}`, uid, 1800000); 
        if(cache) { 
            AppState.profile = cache; 
            AppState.user = { ...AppState.user, ...cache }; 
            AppState.notify('user'); 
        } 
        let snap = await AppState.firebase.db.ref(`users/${uid}`).once('value'); 
        let data = snap.val() || {}; 
        AppState.profile = data; 
        AppState.user = { uid, ...data }; 
        AppState.persistentCache.set(`profile_full_${uid}`, data, uid); 
        AppState.notify('user'); 
        return data; 
    }
    async function cargarDatosGlobales(forceRefresh = false) { 
        if(window._globalCacheLoaded && !forceRefresh) return window._globalCache; 
        let adminDb = getAdminDatabase(); 
        if(!adminDb) return { palenques: [], partidos: [], colores: [] }; 
        let [palenquesSn, partidosSn, coloresSn] = await Promise.all([
            adminDb.ref('PALENQUES').once('value'), 
            adminDb.ref('NOMPARTIDOS').once('value'), 
            adminDb.ref('COLORGALLOS').once('value')
        ]); 
        window._globalCache = { 
            palenques: palenquesSn.val() || [], 
            partidos: partidosSn.val() || [], 
            colores: coloresSn.val() || [] 
        }; 
        window._globalCacheLoaded = true; 
        return window._globalCache; 
    }
    async function verificarDispositivo(user) { 
        if(!user) return false; 
        let fingerprint = await getDeviceFingerprint(); 
        let maxDevices = AppState.profile?.maxDevices || 1; 
        let devicesSnap = await AppState.firebase.db.ref(`dispositivos_autorizados/${user.uid}`).once('value'); 
        let devices = devicesSnap.val() || {}; 
        if(devices[fingerprint]) { 
            await AppState.firebase.db.ref(`dispositivos_autorizados/${user.uid}/${fingerprint}/lastLogin`).set(Date.now()); 
            return true; 
        } else { 
            if(Object.keys(devices).length >= maxDevices) { 
                AppState.addNotification('Límite de dispositivos alcanzado. Contacte soporte.', 'error'); 
                await AppState.firebase.auth.signOut(); 
                return false; 
            } else { 
                await AppState.firebase.db.ref(`dispositivos_autorizados/${user.uid}/${fingerprint}`).set({ 
                    fingerprint, 
                    fechaRegistro: Date.now(), 
                    userAgent: navigator.userAgent,
                    lastLogin: Date.now()
                }); 
                return true; 
            } 
        } 
    }
    async function getDeviceFingerprint() { 
        let canvas = document.createElement('canvas'); 
        let gl = canvas.getContext('webgl'); 
        let gpu = gl ? gl.getParameter(gl.RENDERER) : 'unknown'; 
        let cores = navigator.hardwareConcurrency || 'unknown'; 
        let resolution = `${screen.width}x${screen.height}x${devicePixelRatio}`; 
        let os = /Android|iOS|Windows|Mac|Linux/i.test(navigator.userAgent) ? navigator.platform : 'unknown'; 
        let dataString = gpu + cores + resolution + os + navigator.language + screen.colorDepth; 
        let hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(dataString)); 
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join(''); 
    }
    function handleFirebaseError(error, action) { 
        let mensaje = 'Error en la operación'; 
        if(error.code === 'auth/wrong-password') mensaje = 'Contraseña incorrecta'; 
        else if(error.code === 'auth/user-not-found') mensaje = 'No existe cuenta con este correo'; 
        else if(error.code === 'auth/email-already-in-use') mensaje = 'El email ya está registrado'; 
        else if(error.code === 'auth/weak-password') mensaje = 'La contraseña es muy débil (mínimo 6 caracteres)'; 
        else if(error.code === 'auth/too-many-requests') mensaje = 'Demasiados intentos fallidos. Espere unos minutos'; 
        else if(error.code === 'auth/network-request-failed') mensaje = 'Error de red. Verifica tu conexión'; 
        else if(error.code === 'auth/invalid-email') mensaje = 'Formato de email inválido'; 
        AppState.addNotification(mensaje, 'error'); 
        console.error(`Firebase error on ${action}:`, error); 
    }

    async function handleLogin() { 
        if(!validarCSRF('login')) { AppState.addNotification('Error de seguridad CSRF', 'error'); return; }
        let email = document.getElementById('loginEmailEpic')?.value; 
        let pass = document.getElementById('loginPassEpic')?.value; 
        if(!email || !pass) { AppState.addNotification('Complete todos los campos', 'warning'); return; }
        if(!RateLimiter.canAttempt(`login_${email}`)) { 
            let wait = Math.ceil(RateLimiter.getWaitTime(`login_${email}`) / 60000);
            AppState.addNotification(`Demasiados intentos. Espere ${wait} minutos`, 'error'); 
            return; 
        }
        RateLimiter.recordAttempt(`login_${email}`);
        AppState.setLoading(true);
        try { 
            await AppState.firebase.auth.signInWithEmailAndPassword(email, pass); 
            RateLimiter.clearAttempts(`login_${email}`);
        } catch(e) { handleFirebaseError(e, 'login'); AppState.setLoading(false); } 
    }
    async function handleCompleteRegister() { 
        if(!validarCSRF('register')) { AppState.addNotification('Error CSRF', 'error'); return; }
        let fullname = document.getElementById('regFullnameEpic')?.value;
        let email = document.getElementById('regEmailEpic')?.value;
        let pass = document.getElementById('regPassEpic')?.value;
        let confirm = document.getElementById('regConfirmEpic')?.value;
        let terms = document.getElementById('termsEpic')?.checked;
        let phone = document.getElementById('regPhoneEpic')?.value;
        
        if(!fullname || !email || !pass || !confirm || !terms) { 
            AppState.addNotification('Complete todos los campos obligatorios y acepte términos', 'warning'); 
            return; 
        }
        if(pass !== confirm) { AppState.addNotification('Las contraseñas no coinciden', 'error'); return; }
        if(pass.length < 6) { AppState.addNotification('La contraseña debe tener al menos 6 caracteres', 'error'); return; }
        if(!email.includes('@') || !email.includes('.')) { AppState.addNotification('Email inválido', 'error'); return; }
        
        AppState.setLoading(true);
        try { 
            let cred = await AppState.firebase.auth.createUserWithEmailAndPassword(email, pass); 
            let uid = cred.user.uid;
            await cred.user.updateProfile({ displayName: fullname });
            let defaultPermissions = {
                displayName: fullname,
                email: email,
                phone: phone || '',
                activated: false,
                gallo: false,
                isJudge: false,
                publicaciones: false,
                ventas: false,
                pedigri: false,
                maxDevices: 1,
                registeredAt: Date.now(),
                registeredWith: 'email'
            };
            await AppState.firebase.db.ref(`users/${uid}`).set(defaultPermissions);
            AppState.addNotification('Registro exitoso. Espera activación del administrador.', 'success');
            navigateTo('public');
        } catch(e) { handleFirebaseError(e, 'register'); } 
        finally { AppState.setLoading(false); }
    }
    async function handleLogout() { 
        closeSidebar(); 
        AppState.persistentCache.clearUserCache(AppState.user?.uid); 
        sessionStorage.clear(); 
        localStorage.removeItem('legado_usuario_recurrente');
        if(window.google?.accounts?.id) google.accounts.id.disableAutoSelect();
        if(AppState.firebase.auth) await AppState.firebase.auth.signOut(); 
        AppState.clearUser(); 
        navigateTo('public'); 
        renderApp(); 
    }

        let email = prompt('Ingrese su correo electrónico para restablecer la contraseña:');

        try { 
            _0x5f3a(); 
            if(_0x1f7a()) { 
                document.getElementById('app-root').innerHTML = '<div style="padding:100px;text-align:center;color:red;">ACCESO RESTRINGIDO - DOMINIO NO AUTORIZADO</div>'; 
                return; 
            }
            let screen = AppState.currentScreen;
            let content = '';
            if(screen === 'public') content = renderPublicScreen();
            else if(screen === 'login') content = renderLoginScreen();
            else if(screen === 'register') content = renderRegisterScreen();
            else if(screen === 'activation_pending') content = renderActivationPendingScreen();
            else if(screen === 'publicaciones') content = renderPublicacionesScreen();
            else if(screen === 'pedigri') content = renderPedigriScreen();
            else if(screen === 'share') content = renderShareScreen();
            else if(screen === 'admin') content = renderAdminScreen();
            else if(screen === 'ventas') content = renderVentasScreen();
            else if(screen === 'perfil') content = renderPerfilScreen();
            else if(screen === 'rooster') content = renderRoosterScreen();
            else if(screen === 'juez') content = renderJuezScreen();
            else if(screen === 'configuraciones') content = renderConfiguracionesScreen();
            else content = renderPublicScreen();
            let finalHtml = renderTopBarComplete() + content + footerComplete();
            document.getElementById('app-root').innerHTML = finalHtml;
            attachGlobalEventsEpic();
            updateSidebarContentComplete();
        } catch(e) { console.error(e); } 
        finally { window._isRenderingNow = false; }
    }

    function updateSidebarContentComplete() { 
        let perms = AppState.profile || {};
        let items = `
            <div class="sidebar-item-senior" data-nav="perfil">👤 MI PERFIL</div>
            <div class="sidebar-item-senior" data-nav="share">🔗 COMPARTIR</div>
            ${perms.ventas ? '<div class="sidebar-item-senior" data-nav="ventas">💰 SUBASTAS</div>' : ''}
            ${perms.isJudge ? '<div class="sidebar-item-senior" data-nav="juez">⚖️ PANEL JUEZ</div>' : ''}
            <div class="sidebar-item-senior" data-nav="configuraciones">⚙️ CONFIGURACIÓN</div>
            ${perms.gallo ? '<div class="sidebar-item-senior" data-nav="admin">🔧 ADMINISTRACIÓN</div>' : ''}
            <div class="sidebar-item-senior" id="logoutSidebarFinalBtn">🚪 CERRAR SESIÓN</div>
        `;
        document.getElementById('sidebarMenuSenior').innerHTML = items;
        document.querySelectorAll('.sidebar-item-senior[data-nav]').forEach(el => {
            el.addEventListener('click', () => { navigateTo(el.getAttribute('data-nav')); closeSidebar(); });
        });
        document.getElementById('logoutSidebarFinalBtn')?.addEventListener('click', () => { handleLogout(); closeSidebar(); });
        if(AppState.profile) {
            document.getElementById('sidebarNameSenior').innerText = AppState.profile.displayName || 'Usuario Legado';
            document.getElementById('sidebarEmailSenior').innerText = AppState.profile.email || '';
            document.getElementById('sidebarAvatarSenior').innerText = (AppState.profile.displayName || 'U').charAt(0);
        }
    }
    function attachGlobalEventsEpic() { 
        document.getElementById('doLoginEpicBtn')?.addEventListener('click', handleLogin);
        document.getElementById('doRegisterEpicBtn')?.addEventListener('click', handleCompleteRegister);
        document.getElementById('switchToRegisterEpicBtn')?.addEventListener('click', () => navigateTo('register'));
        document.getElementById('backToLoginEpicBtn')?.addEventListener('click', () => navigateTo('login'));
        document.getElementById('publicTopLoginBtn')?.addEventListener('click', () => navigateTo('login'));
        document.getElementById('publicLoginMainBtn')?.addEventListener('click', () => navigateTo('login'));
        document.getElementById('publicRegisterMainBtn')?.addEventListener('click', () => navigateTo('register'));
        document.getElementById('openSidebarSeniorBtn')?.addEventListener('click', openSidebar);
        document.getElementById('sidebarOverlaySenior')?.addEventListener('click', closeSidebar);
        document.getElementById('forgotPasswordEpicBtn')?.addEventListener('click', resetPassword);
        document.getElementById('logoutPendingBtn')?.addEventListener('click', handleLogout);
        document.getElementById('logoutConfigBtn')?.addEventListener('click', handleLogout);
        document.getElementById('checkActivationStatusBtn')?.addEventListener('click', checkActivationStatus);
        document.querySelectorAll('.accordion-header-senior').forEach(header => {
            header.addEventListener('click', () => { let id = header.getAttribute('data-accordion'); let content = document.getElementById(`accordion-${id}`); if(content) content.style.display = content.style.display === 'block' ? 'none' : 'block'; });
        });
        document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', (e) => navigateTo(el.getAttribute('data-nav'))));
        document.getElementById('copyShareLinkBtn')?.addEventListener('click', () => { navigator.clipboard.writeText(window.location.href); AppState.addNotification('Enlace copiado!', 'success'); });
        document.getElementById('nativeShareBtn')?.addEventListener('click', () => { if(navigator.share) navigator.share({title:'Legado Avícola', url:window.location.href}); else AppState.addNotification('Usa copiar enlace','info'); });
        document.getElementById('googleLoginEpicBtn')?.addEventListener('click', () => { AppState.addNotification('Google OAuth listo para integrar', 'info'); });
    }
    function openSidebar() { document.getElementById('sidebarSenior').classList.add('open'); document.getElementById('sidebarOverlaySenior').classList.add('active'); }
    function closeSidebar() { document.getElementById('sidebarSenior').classList.remove('open'); document.getElementById('sidebarOverlaySenior').classList.remove('active'); }
    async function navigateTo(section) { 
        if(esGooglebot()) return; 
        closeSidebar(); 
        let profile = AppState.profile || {};
        if(section === 'admin' && !profile.gallo) { AppState.addNotification('Sin permisos de administrador', 'error'); return; }
        if((section === 'juez' && !profile.isJudge) || (section === 'publicaciones' && !profile.publicaciones) || (section === 'ventas' && !profile.ventas) || (section === 'pedigri' && !profile.pedigri)) { AppState.addNotification('Permiso denegado para esta sección', 'warning'); return; }
        if(!AppState.user && !['public', 'login', 'register'].includes(section)) { sessionStorage.setItem('postLoginRedirect', section); navigateTo('login'); return; }
        AppState.setScreen(section); 
        renderApp(); 
    }
    function setupAuthListener() { 
        if(!AppState.firebase.auth) return; 
        AppState.firebase.auth.onAuthStateChanged(async (user) => { 
            if(user) { 
                let profile = await loadUserProfile(user.uid); 
                let deviceOk = await verificarDispositivo(user); 
                if(!deviceOk) { await AppState.firebase.auth.signOut(); return; } 
                if(profile.activated === true) AppState.setScreen(localStorage.getItem('lastScreen') || 'public'); 
                else AppState.setScreen('activation_pending'); 
                renderApp(); 
            } else { 
                AppState.clearUser(); 
                if(!['public', 'login', 'register'].includes(AppState.currentScreen)) AppState.setScreen('public'); 
                renderApp(); 
            } 
        }); 
    }

    // LOADING SECUENCE
    let loadPercent = 0;
    function startEpicLoading() { 
        let interval = setInterval(() => { 
            if(loadPercent < 92) { 
                loadPercent += Math.random() * 7; 
                document.getElementById('epicProgressFill') && (document.getElementById('epicProgressFill').style.width = Math.min(loadPercent, 92) + '%'); 
                let steps = ['Conectando Firebase...', 'Cargando perfiles...', 'Sincronizando datos...', 'Verificando seguridad...', 'Iniciando interfaz...'];
                document.getElementById('loadingStatusText') && (document.getElementById('loadingStatusText').innerText = steps[Math.floor(Math.random() * steps.length)] + ' ' + Math.floor(loadPercent) + '%');
            } 
        }, 180); 
        setTimeout(() => { 
            clearInterval(interval); 
            document.getElementById('loading-screen').style.opacity = '0'; 
            setTimeout(() => { 
                document.getElementById('loading-screen').style.display = 'none'; 
                document.getElementById('app-root').style.display = 'block'; 
                renderApp(); 
            }, 400); 
        }, 2800); 
    }
    window.onload = async () => { 
        if(esGooglebot()) { 
            document.getElementById('loading-screen').style.display = 'none'; 
            document.getElementById('app-root').style.display = 'block'; 
            document.getElementById('app-root').innerHTML = '<div>Contenido público indexado para buscadores</div>'; 
            return; 
        } 
        await initializeFirebase(); 
        startEpicLoading(); 
        setInterval(() => { 
            let csrf = document.getElementById('csrf_login'); 
            if(csrf) csrf.value = generateCSRFToken('login'); 
            let csrfReg = document.getElementById('csrf_register'); 
            if(csrfReg) csrfReg.value = generateCSRFToken('register'); 
        }, 800); 
    };
    window.navigateTo = navigateTo;
    window.AppState = AppState;
</script>
