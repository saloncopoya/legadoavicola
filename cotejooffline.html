let cotejoUltimoModo = 'ASCENDENTE';

        // Guardar todos los torneos
        function guardarTorneosEnStorage() {
            const torneosParaGuardar = {};
            torneosAnteriores.forEach(t => {
                torneosParaGuardar[t.id] = { ...t };
                // Asegurar que REGISTRO no se duplique
                if (t.registro) {
                    torneosParaGuardar[t.id].REGISTRO = t.registro;
                }
            });
            localStorage.setItem(STORAGE_KEYS.TORNEOS, JSON.stringify(torneosParaGuardar));
            localStorage.setItem(STORAGE_KEYS.TORNEOS_LIST, JSON.stringify(torneosAnteriores.map(t => ({ id: t.id, nombre: t.nombre, fecha: t.fecha }))));
        }
        
        // Cargar todos los torneos
        function cargarTorneosDesdeStorage() {
            const stored = localStorage.getItem(STORAGE_KEYS.TORNEOS);
            if (stored) {
                const torneosObj = JSON.parse(stored);
                torneosAnteriores = Object.entries(torneosObj).map(([id, t]) => ({ id, ...t }));
                torneosAnteriores.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }
            
            // Cargar nombres de partidos globales
            const storedNombres = localStorage.getItem(STORAGE_KEYS.NOMBRES_PARTIDOS);
            if (storedNombres) {
                nombresPartidosList = JSON.parse(storedNombres);
            }
            
            // Cargar colores de gallos
            const storedColores = localStorage.getItem(STORAGE_KEYS.COLORES_GALLOS);
            if (storedColores) {
                coloresGallosList = JSON.parse(storedColores);
            }
            
            // Cargar palenques
            const storedPalenques = localStorage.getItem(STORAGE_KEYS.PALENQUES);
            if (storedPalenques) {
                palenquesList = JSON.parse(storedPalenques);
            }
        }
        
        // Guardar un torneo específico
        function guardarTorneoEnStorage(torneo) {
            const stored = localStorage.getItem(STORAGE_KEYS.TORNEOS);
            const torneosObj = stored ? JSON.parse(stored) : {};
            torneosObj[torneo.id] = { ...torneo };
            localStorage.setItem(STORAGE_KEYS.TORNEOS, JSON.stringify(torneosObj));
            
            // Actualizar lista
            const index = torneosAnteriores.findIndex(t => t.id === torneo.id);
            if (index !== -1) {
                torneosAnteriores[index] = torneo;
            } else {
                torneosAnteriores.unshift(torneo);
            }
            localStorage.setItem(STORAGE_KEYS.TORNEOS_LIST, JSON.stringify(torneosAnteriores.map(t => ({ id: t.id, nombre: t.nombre, fecha: t.fecha }))));
        }
        
        // Eliminar un torneo
        function eliminarTorneoDeStorage(torneoIdEliminar) {
            const stored = localStorage.getItem(STORAGE_KEYS.TORNEOS);
            if (stored) {
                const torneosObj = JSON.parse(stored);
                delete torneosObj[torneoIdEliminar];
                localStorage.setItem(STORAGE_KEYS.TORNEOS, JSON.stringify(torneosObj));
            }
            torneosAnteriores = torneosAnteriores.filter(t => t.id !== torneoIdEliminar);
            localStorage.setItem(STORAGE_KEYS.TORNEOS_LIST, JSON.stringify(torneosAnteriores.map(t => ({ id: t.id, nombre: t.nombre, fecha: t.fecha }))));
        }
        
        // Guardar datos globales
        function guardarDatosGlobales() {
            localStorage.setItem(STORAGE_KEYS.NOMBRES_PARTIDOS, JSON.stringify(nombresPartidosList));
            localStorage.setItem(STORAGE_KEYS.COLORES_GALLOS, JSON.stringify(coloresGallosList));
            localStorage.setItem(STORAGE_KEYS.PALENQUES, JSON.stringify(palenquesList));
        }
        
        // ============================================================

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        function obtenerFechaHoy() {
            const hoy = new Date();
            const dia = hoy.getDate().toString().padStart(2, '0');
            const mes = (hoy.getMonth() + 1).toString().padStart(2, '0');
            const anio = hoy.getFullYear();
            return `${dia}/${mes}/${anio}`;
        }
        
        function obtenerSiguienteAnillo() {

        function contarPartidosUnicos() {

            partidosList.forEach(g => {
                if (g.partido && g.partido.trim() !== '') {

                }
            });
            return partidosSet.size;
        }

        // ============================================================

          AppState.addNotification(`✅ Torneo "${nombre}" creado`, 'success');

        function actualizarTorneo(formData) {
            if (!torneoId) return false;
            
            const { nombre, fecha, organizador, lugar, palenque, pesoMin, pesoMax, anillosEditables } = formData;
            
            if (!palenquesList.includes(palenque)) {
                palenquesList.push(palenque);
                guardarDatosGlobales();
            }
            
            torneoActual.nombre = nombre;
            torneoActual.fecha = fecha;
            torneoActual.organizador = organizador;
            torneoActual.lugar = lugar;
            torneoActual.palenque = palenque;
            torneoActual.pesoMin = pesoMin;
            torneoActual.pesoMax = pesoMax;

            const puntosGanador = parseInt(document.getElementById('tournament-puntos-ganador')?.value || '2', 10);
            const puntosEmpate = parseInt(document.getElementById('tournament-puntos-empate')?.value || '1', 10);

            torneoActual.puntosConfig = {

            };
            
            puntosConfiguracion = { ganador: puntosGanador, empate: puntosEmpate, perdedor: puntosPerdedor };
            configuracion.pesoMin = pesoMin;
            configuracion.pesoMax = pesoMax;
            configuracion.anillosEditables = anillosEditables;
            
            guardarTorneoEnStorage(torneoActual);
            
            AppState.addNotification(`✅ Torneo "${nombre}" actualizado`, 'success');
            return true;
        }
        
        // ============================================================
        // FUNCIONES DE PARTIDOS
        // ============================================================
        
        function guardarPartido(nombrePartido, representante, gallos) {
            if (!torneoId) return null;
            
            const matchId = `match_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
            const gallosObj = {};
            
            gallos.forEach(g => {
                if (g.anillo && g.anillo.trim() !== '') {
                    const anilloFormateado = g.anillo.padStart(3, '0');
                    gallosObj[anilloFormateado] = {
                        peso: g.peso !== undefined && g.peso !== null ? g.peso : 0,
                        color: g.color || ''
                    };
                }
            });
            
            if (!torneoActual.REGISTRO) torneoActual.REGISTRO = {};
            torneoActual.REGISTRO[matchId] = {
                nombre: nombrePartido,
                representante: representante || '',
                gallos: gallosObj,
                timestamp: Date.now()
            };
            
            // Actualizar lista local
            gallos.forEach(g => {
                partidosList.push({
                    anillo: g.anillo.padStart(3, '0'),
                    peso: g.peso,
                    color: g.color || '',
                    partido: nombrePartido,
                    representante: representante || '',
                    matchId: matchId
                });
            });
            
            // Actualizar último anillo
            const numeros = gallos.map(g => parseInt(g.anillo, 10)).filter(n => !isNaN(n));
            const maxNuevo = Math.max(...numeros, 0);
            if (maxNuevo > ultimoAnillo) ultimoAnillo = maxNuevo;
            
            // Guardar en storage
            guardarTorneoEnStorage(torneoActual);
            
            // Actualizar listas globales
            if (!nombresPartidosList.includes(nombrePartido)) {
                nombresPartidosList.push(nombrePartido);
                guardarDatosGlobales();
            }
            
            if (representante && !representantesList.includes(representante)) {
                representantesList.push(representante);
            }
            
            gallos.forEach(g => {
                if (g.color && !coloresGallosList.includes(g.color)) {
                    coloresGallosList.push(g.color);
                    guardarDatosGlobales();
                }
            });
            
            // Limpiar cotejo temporal
            if (resultadosCotejo.peleas.length > 0 && !torneoActual.cotejoId) {
                resultadosCotejo = {
                    peleas: [],
                    noEmparejados: [],
                    metricas: { totalGallos: 0, peleasGeneradas: 0, noEmparejados: 0, diferenciaPromedio: 0, conflictosConsecutivos: 0 }
                };
            }
            
            AppState.addNotification(`✅ Partido "${nombrePartido}" registrado`, 'success');
            return matchId;
        }

        function validarPreCotejo() {
            if (!partidosList || partidosList.length === 0) {
                AppState.addNotification('❌ No hay gallos registrados', 'error');
                return false;
            }
            
            // Verificar anillos duplicados
            const anillos = new Set();
            const duplicados = [];
            partidosList.forEach(g => {
                if (anillos.has(g.anillo)) {
                    duplicados.push(g.anillo);
                } else {
                    anillos.add(g.anillo);
                }
            });
            
            if (duplicados.length > 0) {
                AppState.addNotification(`❌ Anillos duplicados: ${duplicados.join(', ')}`, 'error');
                return false;
            }
            
            // Verificar pesos completos
            const sinPeso = partidosList.filter(g => !g.peso || g.peso === 0);
            if (sinPeso.length > 0) {
                AppState.addNotification(`⚠️ ${sinPeso.length} gallos sin peso registrado`, 'warning');
                return false;
            }
            
            // Verificar nombres de partidos
            const partidosSinNombre = [...new Set(partidosList.map(g => g.partido))].filter(n => !n || n.trim() === '');
            if (partidosSinNombre.length > 0) {
                AppState.addNotification('❌ Hay partidos sin nombre', 'error');
                return false;
            }
            
            return true;
        }
        
        function encontrarMejorPareja(gallo, listaGallos, usados) {
            let mejorPareja = null;
            let menorDiferencia = Infinity;
            const rangoPermitido = configuracion.rangoPeso || 50;
                console.log(`🎯 Buscando pareja con rango de peso: ${rangoPermitido}g`);

            for (const posible of listaGallos) {
                if (usados.has(posible.anillo) || posible.anillo === gallo.anillo) continue;
                if (posible.partido === gallo.partido) continue;
                if (posible.representante && gallo.representante && posible.representante === gallo.representante) continue;
                
                const diferencia = Math.abs(posible.peso - gallo.peso);
                if (diferencia > rangoPermitido) continue;
                
                if (diferencia < menorDiferencia) {
                    menorDiferencia = diferencia;
                    mejorPareja = posible;
                }
            }
            
            return mejorPareja;
        }

            const pelea = resultadosCotejo.peleas[indexOrigen];
            resultadosCotejo.peleas.splice(indexOrigen, 1);
            resultadosCotejo.peleas.splice(indexDestino, 0, pelea);

            const pelea = resultadosCotejo.peleas[index];

            [pelea.gallo1, pelea.gallo2] = [pelea.gallo2, pelea.gallo1];

            if (calificacionExistente) {

                if (calificacionExistente.ganador === 'rojo') calificacionExistente.ganador = 'verde';

            if (!PERMISOS_USUARIO.posicion) return;
            const index = resultadosCotejo.peleas.findIndex(p => p.numero === numero);
            if (index === -1) return;
            
            if (accion === 'intercambiar') {
                intercambiarGallosEnPelea(index, numero);
                return;
            }
            
            if (accion === 'up' && index > 0) {
                moverPeleaAPosicion(index, index - 1);
            } else if (accion === 'down' && index < resultadosCotejo.peleas.length - 1) {

        function cargarNombresPartidosUnificados() {
            if (!torneosEnSerialActual || torneosEnSerialActual.length === 0) {
                nombresPartidosUnificados = [];
                return;
            }
            
            const nombresSet = new Set();
            for (const tId of torneosEnSerialActual) {
                const torneo = torneosAnteriores.find(t => t.id === tId);
                if (torneo && torneo.REGISTRO) {
                    Object.values(torneo.REGISTRO).forEach(match => {
                        if (match.nombre && match.nombre.trim()) nombresSet.add(match.nombre);
                    });
                }
            }
            nombresPartidosUnificados = Array.from(nombresSet).sort();
        }
        
        window.vincularSerial = () => {
            const checkboxes = document.querySelectorAll('.serial-checkbox:checked');
            if (checkboxes.length < 2) {
                AppState.addNotification('❌ Selecciona al menos 2 torneos para vincular', 'warning');
                return;
            }
            
            const selectedIds = Array.from(checkboxes).map(cb => cb.dataset.torneoId);
            const nuevoSerialId = `serial_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
            
            for (const tId of selectedIds) {
                const torneo = torneosAnteriores.find(t => t.id === tId);
                if (torneo) {
                    torneo.serialInfo = { serialId: nuevoSerialId, torneosEnSerial: selectedIds };
                    guardarTorneoEnStorage(torneo);
                }
            }
            
            serialIdActual = nuevoSerialId;
            torneosEnSerialActual = selectedIds;
            if (torneoActual && selectedIds.includes(torneoId)) {
                torneoActual.serialInfo = { serialId: nuevoSerialId, torneosEnSerial: selectedIds };
            }
            cargarNombresPartidosUnificados();
            actualizarPantalla();
            AppState.addNotification(`✅ Serial creado con ${selectedIds.length} torneos`, 'success');
        };
        
        window.desvincularSerial = () => {
            if (!serialIdActual) {
                AppState.addNotification('❌ No hay serial activo', 'warning');
                return;
            }
            if (!confirm('¿Desvincular el serial actual?')) return;
            
            for (const tId of torneosEnSerialActual) {
                const torneo = torneosAnteriores.find(t => t.id === tId);
                if (torneo) delete torneo.serialInfo;
                guardarTorneoEnStorage(torneo);

        function validarEstructuraJSON(datos) {
            if (!datos || typeof datos !== 'object') throw new Error('El archivo no contiene un objeto JSON válido');
            if (!datos.infoTorneo) throw new Error('Falta "infoTorneo"');
            if (!datos.infoTorneo.nombre) throw new Error('"infoTorneo.nombre" es requerido');
            if (!datos.registroPartidos || !Array.isArray(datos.registroPartidos)) throw new Error('Falta "registroPartidos"');
            return true;
        }

            return torneosAnteriores.some(t => t.nombre === nombre);
        }
        
        function mostrarPreviewJSON(archivo) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const datos = JSON.parse(e.target.result);
                        validarEstructuraJSON(datos);
                        resolve({
                            nombre: datos.infoTorneo.nombre,
                            fecha: datos.infoTorneo.fecha || 'Sin fecha',
                            cantidadPartidos: datos.registroPartidos?.length || 0,
                            cantidadPeleas: datos.resultadosCotejo?.peleas?.length || 0,
                            datosCompletos: datos
                        });
                    } catch (error) { reject(error); }
                };
                reader.onerror = () => reject(new Error('Error al leer el archivo'));
                reader.readAsText(archivo);
            });
        }

function procesarTablaPosiciones() {
    if (!resultadosCotejo || !resultadosCotejo.peleas || resultadosCotejo.peleas.length === 0) {
        return [];
    }
    
    const peleas = resultadosCotejo.peleas;
    const partidoMap = new Map();
    
    // Obtener configuración de puntos del torneo
    const puntosConfig = torneoActual?.puntosConfig || { ganador: 2, empate: 1, perdedor: 0 };
    const gallosPorPartido = configuracion.gallosPorPartido || 3;
    
    peleas.forEach((pelea, index) => {
        // Buscar calificación (desde calificacionesCargadas)
        const calificacion = calificacionesCargadas.get(index);
        if (!calificacion) return;
        
        const gallo1 = pelea.gallo1;
        const gallo2 = pelea.gallo2;
        
        // Función para inicializar partido en el mapa
        const initPartido = (nombre) => {
            if (!nombre) return null;
            if (!partidoMap.has(nombre)) {
                partidoMap.set(nombre, {
                    puntos: 0,
                    tiempo: 0,
                    gallos: [],
                    gallosPuntos: [],
                    gallosTiempos: []
                });
            }
            return partidoMap.get(nombre);
        };
        
        // Convertir tiempo a segundos
        const tiempoSegundos = convertirTiempoASegundos(calificacion.tiempo);
        
        // Procesar gallo1 (rojo)
        if (gallo1 && gallo1.partido) {
            const data = initPartido(gallo1.partido);
            if (data) {
                let puntosGallo = 0;
                if (calificacion.ganador === 'rojo') {
                    puntosGallo = puntosConfig.ganador;
                    data.tiempo += tiempoSegundos;
                } else if (calificacion.ganador === 'empate') {
                    puntosGallo = puntosConfig.empate;
                    data.tiempo += tiempoSegundos;
                } else {
                    puntosGallo = puntosConfig.perdedor;
                }
                
                data.puntos += puntosGallo;
                data.gallos.push(gallo1);
                data.gallosPuntos.push(puntosGallo);
                data.gallosTiempos.push(calificacion.ganador === 'rojo' || calificacion.ganador === 'empate' ? tiempoSegundos : 0);
            }
        }
        
        // Procesar gallo2 (verde)
        if (gallo2 && gallo2.partido) {
            const data = initPartido(gallo2.partido);
            if (data) {
                let puntosGallo = 0;
                if (calificacion.ganador === 'verde') {
                    puntosGallo = puntosConfig.ganador;
                    data.tiempo += tiempoSegundos;
                } else if (calificacion.ganador === 'empate') {
                    puntosGallo = puntosConfig.empate;
                    data.tiempo += tiempoSegundos;
                } else {
                    puntosGallo = puntosConfig.perdedor;
                }
                
                data.puntos += puntosGallo;
                data.gallos.push(gallo2);
                data.gallosPuntos.push(puntosGallo);
                data.gallosTiempos.push(calificacion.ganador === 'verde' || calificacion.ganador === 'empate' ? tiempoSegundos : 0);
            }
        }
    });
    
    // Convertir mapa a array y ordenar
    let resultados = Array.from(partidoMap.entries()).map(([nombre, data]) => {
        const resultado = {
            nombre: nombre,
            puntos: data.puntos,
            tiempo: data.tiempo,
            gallosPuntos: data.gallosPuntos,
            gallosTiempos: data.gallosTiempos
        };
        
        // Agregar datos de cada gallo (máximo 6)
        for (let i = 0; i < gallosPorPartido; i++) {
            resultado[`gallo${i+1}_puntos`] = data.gallosPuntos[i] || 0;
            resultado[`gallo${i+1}_tiempo`] = data.gallosTiempos[i] || 0;
        }
        
        return resultado;
    });
    
    // Ordenar: por puntos (mayor primero) y luego por tiempo (menor primero)
    resultados.sort((a, b) => {
        if (a.puntos !== b.puntos) return b.puntos - a.puntos;
        return a.tiempo - b.tiempo;
    });
    
    return resultados;
}

function convertirTiempoASegundos(tiempo) {
    if (!tiempo) return 0;
    const partes = tiempo.split(':');
    if (partes.length === 2) {
        return parseInt(partes[0]) * 60 + parseInt(partes[1]);
    }
    return 0;
}

function formatTiempo(segundos) {
    if (!segundos && segundos !== 0) return '00:00';
    const minutos = Math.floor(segundos / 60);
    const segs = segundos % 60;
    return `${minutos.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
}

    // Construir tabla HTML

        for (let i = 1; i <= gallosPorPartido; i++) {

            let puntosClass = '';

            html += `<td style="padding: 8px 4px; text-align: center;" class="${puntosClass}">${puntos}</td>`;
            html += `<td style="padding: 8px 4px; text-align: center;" class="${tiempoClass}">${formatTiempo(tiempo)}</td>`;
        }
        
        html += `<td style="padding: 10px 8px; text-align: center; font-weight: bold; background: #e8f5e8;">${item.puntos}</td>`;
        html += `<td style="padding: 10px 8px; text-align: center; font-weight: bold;">${formatTiempo(item.tiempo)}</td>`;
        html += `</tr>`;
    });
    
    html += `</tbody></table>`;
    contentDiv.innerHTML = html;
    
    // Aplicar estilos guardados
    const savedFontSize = localStorage.getItem('tablaPosicionFontSize');

}

        window.registrarPartido = async () => {
            const boton = document.getElementById('registrar-partido-btn');
            if (boton.disabled) return;
            boton.disabled = true;
            const textoOriginal = boton.textContent;
            boton.textContent = '⏳ REGISTRANDO...';
            
            const nombre = document.getElementById('match-name')?.value.trim();
            const representante = document.getElementById('match-representante')?.value.trim();
            
            if (!nombre) {
                AppState.addNotification('❌ Nombre del partido obligatorio', 'error');
                boton.disabled = false; boton.textContent = textoOriginal; return;
            }
            if (partidosList.some(p => p.partido.toLowerCase() === nombre.toLowerCase())) {
                AppState.addNotification(`❌ El partido "${nombre}" ya existe`, 'error');
                boton.disabled = false; boton.textContent = textoOriginal; return;
            }
            
            const gallos = [];
            const anillosExistentes = new Set(partidosList.map(p => p.anillo));
            let error = false;
            
            for (let i = 1; i <= configuracion.gallosPorPartido; i++) {
                const anilloInput = document.getElementById(`ring-${i}`);
                const pesoInput = document.getElementById(`weight-${i}`);
                const colorInput = document.getElementById(`color-${i}`);
                const estadoBtn = document.getElementById(`estado-${i}`);
                const esPendiente = estadoBtn && estadoBtn.textContent.includes('PENDIENTE');
                
                const anillo = anilloInput?.value.trim();
                const peso = pesoInput?.value.trim();
                const color = colorInput?.value.trim() || '';
                
                if (!anillo) { AppState.addNotification(`❌ Anillo obligatorio para gallo ${i}`, 'error'); error = true; continue; }
                if (!/^\d{3,4}$/.test(anillo)) { AppState.addNotification(`❌ Anillo "${anillo}" debe tener 3-4 dígitos`, 'error'); error = true; continue; }
                
                let pesoNum = 0;
                if (!esPendiente) {
                    if (!peso) { AppState.addNotification(`❌ Gallo ${i} PRESENTE: Peso obligatorio`, 'error'); error = true; continue; }
                    pesoNum = parseInt(peso, 10);
                    if (isNaN(pesoNum) || pesoNum <= 0) { AppState.addNotification(`❌ Peso inválido para gallo ${i}`, 'error'); error = true; continue; }
                    if (pesoNum < configuracion.pesoMin || pesoNum > configuracion.pesoMax) {
                        AppState.addNotification(`❌ Peso debe estar entre ${configuracion.pesoMin}-${configuracion.pesoMax}g`, 'error'); error = true; continue;
                    }
                }
                
                const anilloFormateado = anillo.padStart(3, '0');
                if (anillosExistentes.has(anilloFormateado)) {
                    AppState.addNotification(`❌ Anillo ${anillo} ya registrado`, 'error'); error = true; continue;
                }
                gallos.push({ anillo, peso: pesoNum, color });
                anillosExistentes.add(anilloFormateado);
            }
            
            if (error) { boton.disabled = false; boton.textContent = textoOriginal; return; }
            
            const matchId = guardarPartido(nombre, representante, gallos);
            if (matchId) {
                document.getElementById('match-name').value = '';
                document.getElementById('match-representante').value = '';
                document.getElementById('representante-info').innerHTML = '';

   setTimeout(() => {

    if (nombreInput) nombreInput.focus();
}, 100);
}
            
            boton.disabled = false;
            boton.textContent = textoOriginal;
        };

                actualizarPantalla();
                AppState.addNotification('✅ Torneo eliminado', 'success');
            }
        };
        
        // Inicializar funciones toggle globales
        window.toggleConfigSection = window.toggleConfigSection || function() {};
        window.toggleSerialSection = window.toggleSerialSection || function() {};
        window.togglePuntosSection = window.togglePuntosSection || function() {};
        
        console.log("✅ Panel OFFLINE completamente cargado");
    </script>
</body>
