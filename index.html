<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Legado Avícola | Menú Profesional</title>
    <meta name="theme-color" content="#8B4513">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Legado Avícola">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/8B4513/white?text=🐓">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #0a0c10, #0b0f15);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* DASHBOARD PRINCIPAL – TARJETA DE LUJO */
        .glass-dashboard {
            max-width: 1300px;
            width: 100%;
            background: rgba(18, 22, 30, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 3.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.25);
            transition: all 0.3s ease;
        }

        /* HEADER CON ESTADO Y USUARIO */
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            border-bottom: 2px solid rgba(255,215,0,0.4);
            padding-bottom: 1rem;
        }
        .logo-area h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, #FFE6B0, #FFD966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            font-weight: 800;
        }
        .logo-area p {
            color: #a0a8b9;
            font-size: 0.8rem;
        }
        .user-status {
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .user-name {
            color: #FFDF85;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .online-badge, .offline-badge {
            font-size: 0.7rem;
            background: #2ecc71;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            color: #000;
            font-weight: bold;
        }
        .offline-badge {
            background: #e67e22;
            color: white;
        }

        /* GRID DE BOTONES – ESTILO MENÚ AVANZADO */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.8rem;
            margin: 2rem 0 1rem;
        }
        .menu-card {
            background: radial-gradient(ellipse at top left, rgba(30,35,48,0.9), rgba(15,18,25,0.95));
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.6rem 1rem;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255,215,0,0.25);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #FFD966;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,217,102,0.3);
        }
        .menu-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 4px 6px #00000055);
        }
        .menu-card h3 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #F9E79F, #F7DC6F);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .menu-card p {
            color: #bfc9dd;
            font-size: 0.75rem;
            margin-top: 0.4rem;
            font-weight: 500;
        }
        .logout-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px dashed rgba(255,215,0,0.3);
        }
        .btn-outline-gold {
            background: transparent;
            border: 1.5px solid #F7DC6F;
            color: #F7DC6F;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline-gold:hover {
            background: #F7DC6F;
            color: #0a0c10;
        }
        .btn-gold {
            background: linear-gradient(95deg, #F9E79F, #F7DC6F);
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 800;
            color: #1e1f2c;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .install-btn {
            background: #2c3e50;
            color: #FFD966;
            border: none;
        }
        /* modal elegante */
        .modal-luxury {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .modal-luxury.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: #12161f;
            border-radius: 2rem;
            max-width: 420px;
            width: 90%;
            padding: 2rem;
            border: 1px solid #FFD966;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.2s;
        }
        .modal-luxury.active .modal-card {
            transform: scale(1);
        }
        .modal-card input {
            width: 100%;
            padding: 0.9rem;
            margin: 0.8rem 0;
            background: #1e2432;
            border: 1px solid #3a4050;
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
        }
        .modal-card button {
            width: 100%;
            margin-top: 0.8rem;
        }
        .flex-btns {
            display: flex;
            gap: 12px;
            margin-top: 1rem;
        }
        .text-gold {
            color: #FFD966;
            text-align: center;
            margin-bottom: 1rem;
        }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .glass-dashboard { padding: 1.5rem; }
            .menu-card h3 { font-size: 1.3rem; }
            .menu-icon { font-size: 2.5rem; }
        }
        .footer-manifest {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #5e677b;
        }
        .status-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="glass-dashboard">
    <div class="menu-header">
        <div class="logo-area">
            <h1>⚡ LEGADO AVÍCOLA</h1>
            <p>menú profesional · torneo inteligente</p>
        </div>
        <div class="user-status" id="userStatusWidget">
            <div class="status-row">
                <span id="connectionLed" class="online-badge">🌐 ONLINE</span>
                <span id="userNameDisplay" class="user-name" style="display: none;">Invitado</span>
                <button id="quickLoginBtn" class="btn-outline-gold" style="padding: 0.3rem 1rem;">🔐 Ingresar</button>
                <button id="quickLogoutBtn" class="btn-outline-gold" style="display: none; padding: 0.3rem 1rem;">🚪 Salir</button>
            </div>
        </div>
    </div>

    <!-- RED DE BOTONES PRINCIPAL (solo botones: importar, crear cotejo online, offline, ver tablas, login/logout) -->
    <div class="menu-grid" id="menuDynamicButtons">
        <!-- Botones se generarán dinámicamente según condiciones -->
    </div>

    <div class="logout-section" id="extraSessionPanel" style="justify-content: space-between;">
        <button id="installPwaBtn" class="btn-outline-gold install-btn" style="display: none;">📲 INSTALAR APP</button>
        <div></div>
        <span id="versionInfo" style="color:#6f7a8c; font-size:12px;">⚙️ manifest | sw activo</span>
    </div>
    <div class="footer-manifest">
        🐓 PWA lista para usar offline · Datos sincronizados
    </div>
</div>

<!-- MODAL DE INICIO DE SESIÓN (lujoso) -->
<div id="loginModalGlobal" class="modal-luxury">
    <div class="modal-card">
        <h3 class="text-gold">🔐 ACCESO AUTORIZADO</h3>
        <input type="email" id="modalEmail" placeholder="correo@ejemplo.com" autocomplete="email">
        <input type="password" id="modalPassword" placeholder="contraseña" autocomplete="current-password">
        <button id="modalLoginBtn" class="btn-gold" style="width:100%">INICIAR SESIÓN</button>
        <div class="flex-btns">
            <button id="modalCancelBtn" class="btn-outline-gold" style="flex:1">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------- CONFIGURACIÓN FIREBASE (misma proporcionada)
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyASox7mRak5V0py29htEVWCVeipGpA0yfs",
        authDomain: "galloslivebadge.firebaseapp.com",
        databaseURL: "https://galloslivebadge-default-rtdb.firebaseio.com",
        projectId: "galloslivebadge",
        messagingSenderId: "979482928760",
        appId: "1:979482928760:web:3ea879dc4ee1e020df6f8d"
    };
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();

    // Variables globales de estado
    let currentUser = null;         // null = sin sesión
    let isOnline = navigator.onLine;
    let deferredPrompt = null;      // PWA install

    // Elementos DOM
    const menuContainer = document.getElementById('menuDynamicButtons');
    const quickLoginBtn = document.getElementById('quickLoginBtn');
    const quickLogoutBtn = document.getElementById('quickLogoutBtn');
    const userNameSpan = document.getElementById('userNameDisplay');
    const connectionLed = document.getElementById('connectionLed');
    const loginModal = document.getElementById('loginModalGlobal');
    const modalLoginBtn = document.getElementById('modalLoginBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalEmail = document.getElementById('modalEmail');
    const modalPassword = document.getElementById('modalPassword');
    const installBtn = document.getElementById('installPwaBtn');

    // -------------------- Helper UI --------------------
    function updateConnectionUI() {
        isOnline = navigator.onLine;
        if (isOnline) {
            connectionLed.innerHTML = '✅ ONLINE';
            connectionLed.className = 'online-badge';
        } else {
            connectionLed.innerHTML = '📴 OFFLINE';
            connectionLed.className = 'offline-badge';
        }
        renderMenuButtons();    // afecta visibilidad de botones
    }

    function getDisplayName() {
        if (!currentUser) return null;
        let name = currentUser.displayName;
        if (!name || name === 'null') name = currentUser.email?.split('@')[0] || 'Usuario';
        return name;
    }

    function updateSessionUI() {
        if (currentUser && isOnline) {
            quickLoginBtn.style.display = 'none';
            quickLogoutBtn.style.display = 'inline-flex';
            const nombre = getDisplayName();
            userNameSpan.style.display = 'inline-block';
            userNameSpan.textContent = `👤 ${nombre}`;
        } else {
            quickLoginBtn.style.display = 'inline-flex';
            quickLogoutBtn.style.display = 'none';
            userNameSpan.style.display = 'none';
        }
        renderMenuButtons(); // refrescar botones según sesión + conectividad
    }

    // -------------------- Lógica principal de botones condicionales --------------------
    // Necesitamos 5 tipos:
    // 1. IR A IMPORTAR (/importar) → SIEMPRE (tenga o no internet, sin importar sesión). Pero si hay sesión iniciada NO debe aparecer.
    // 2. CREAR COTEJO ONLINE (/admin) → solo cuando hay internet Y sesión iniciada.
    // 3. COTEJO OFFLINE (/adminoffline) → solo cuando NO hay internet Y NO tiene sesión iniciada.
    // 4. VER TABLAS ONLINE (/online) → solo cuando hay internet (sin importar sesión)
    // 5. INICIAR SESION (modal) → aparece cuando hay internet Y sin sesion. Si hay sesion iniciada: mostrar botón CERRAR SESION + nombre usuario (ya está en zona superior, pero además quitamos el de iniciar y exponemos el cierre)

    // Estructura de botones: se renderiza cada vez que cambia sesión o conectividad.
    function renderMenuButtons() {
        const hasInternet = isOnline;
        const loggedIn = (currentUser !== null && hasInternet); // sesion iniciada solo relevante si hay internet (por coherencia, si offline no hay inicio real)
        // Nota: "sesion iniciada" solo aplica cuando hay conexión a internet (firebase auth requiere internet). Dado que offline no hay sesión posible.

        let buttons = [];

        // 1. Botón IMPORTAR (/importar) → siempre visible pero condición extra: cuando no haya sesion iniciada (loggedIn === false)
        if (!loggedIn) {
            buttons.push({
                id: 'btnImport',
                label: '📂 IMPORTAR TORNEOS',
                desc: 'Cargar JSON / torneos externos',
                icon: '📂',
                link: '/importar',
                target: '_self'
            });
        }

        // 2. CREAR COTEJO ONLINE (/admin) → internet Y sesion iniciada
        if (hasInternet && loggedIn) {
            buttons.push({
                id: 'btnAdminOnline',
                label: '🏆 CREAR COTEJO ONLINE',
                desc: 'Organiza torneos en la nube',
                icon: '🌐',
                link: '/admin',
                target: '_self'
            });
        }

        // 3. COTEJO OFFLINE (/adminoffline) → sin internet Y sin sesion iniciada (loggedIn false y offline)
        if (!hasInternet && !loggedIn) {
            buttons.push({
                id: 'btnAdminOffline',
                label: '📴 COTEJO OFFLINE',
                desc: 'Modo local sin conexión',
                icon: '⚡',
                link: '/adminoffline',
                target: '_self'
            });
        }

        // 4. VER TABLAS ONLINE (/online) → solo cuando hay internet, independientemente sesión
        if (hasInternet) {
            buttons.push({
                id: 'btnOnlineTables',
                label: '📊 VER TABLAS ONLINE',
                desc: 'Rankings y resultados en vivo',
                icon: '🏅',
                link: '/online',
                target: '_self'
            });
        }

        // 5. INICIAR SESIÓN (modal) si hay internet Y no sesion. Adicionalmente, el botón de cerrar sesión ya está fuera pero lo integramos en zona de menú si se desea? pero el menu ya tiene botones condicionales.
        // Según requerimiento: INICIAR SESIÓN muestre modal cuando internet y sin sesion. Y cuando sesion iniciada aparezca boton cerrar sesión y nombre. Ya tenemos en header logout, pero además para completar añadimos un botón de "Cerrar sesión" dentro del grid si está logueado.
        if (hasInternet && !loggedIn) {
            buttons.push({
                id: 'btnLoginAction',
                label: '🔑 INICIAR SESIÓN',
                desc: 'Accede a tu cuenta',
                icon: '👤',
                action: 'login'
            });
        } else if (loggedIn) {
            // Cuando hay sesión iniciamos mostramos además botón de cerrar sesión en el grid (además del de header)
            buttons.push({
                id: 'btnLogoutAction',
                label: '🚪 CERRAR SESIÓN',
                desc: `Hasta luego, ${getDisplayName() || ''}`,
                icon: '🔒',
                action: 'logout'
            });
        }

        // Renderizado dinámico con efectos profesionales
        if (!menuContainer) return;
        if (buttons.length === 0) {
            menuContainer.innerHTML = `<div class="menu-card" style="grid-column:1/-1; text-align:center; background:#1e1b26;"><div class="menu-icon">⚙️</div><h3>Sin acciones disponibles</h3><p>Verifica tu conexión o estado de sesión</p></div>`;
            return;
        }

        let html = '';
        for (let btn of buttons) {
            if (btn.link) {
                html += `
                    <div class="menu-card" data-href="${btn.link}" data-target="${btn.target || '_self'}">
                        <div class="menu-icon">${btn.icon}</div>
                        <h3>${btn.label}</h3>
                        <p>${btn.desc}</p>
                    </div>
                `;
            } else if (btn.action === 'login') {
                html += `
                    <div class="menu-card" id="dynamicLoginCard">
                        <div class="menu-icon">${btn.icon}</div>
                        <h3>${btn.label}</h3>
                        <p>${btn.desc}</p>
                    </div>
                `;
            } else if (btn.action === 'logout') {
                html += `
                    <div class="menu-card" id="dynamicLogoutCard">
                        <div class="menu-icon">${btn.icon}</div>
                        <h3>${btn.label}</h3>
                        <p>${btn.desc}</p>
                    </div>
                `;
            }
        }
        menuContainer.innerHTML = html;

        // Asignar eventos para redirección y modal
        document.querySelectorAll('.menu-card[data-href]').forEach(card => {
            card.addEventListener('click', (e) => {
                const url = card.getAttribute('data-href');
                if (url) window.location.href = url;
            });
        });
        const loginCard = document.getElementById('dynamicLoginCard');
        if (loginCard) loginCard.addEventListener('click', () => showLoginModal());
        const logoutCard = document.getElementById('dynamicLogoutCard');
        if (logoutCard) logoutCard.addEventListener('click', () => cerrarSesion());
    }

    // ---------------- Firebase Auth + Modal ----------------
    function showLoginModal() {
        if (!isOnline) {
            alert('⚠️ No hay conexión a internet. No es posible iniciar sesión.');
            return;
        }
        loginModal.classList.add('active');
        modalEmail.value = '';
        modalPassword.value = '';
    }

    function closeModal() {
        loginModal.classList.remove('active');
    }

    async function iniciarSesionDesdeModal() {
        const email = modalEmail.value.trim();
        const pwd = modalPassword.value;
        if (!email || !pwd) {
            alert('Ingresa correo y contraseña');
            return;
        }
        try {
            const cred = await auth.signInWithEmailAndPassword(email, pwd);
            currentUser = cred.user;
            closeModal();
            // refrescar UI y menu
            updateSessionUI();
            renderMenuButtons();
        } catch (err) {
            alert('Error de autenticación: ' + err.message);
        }
    }

    async function cerrarSesion() {
        if (currentUser) {
            await auth.signOut();
            currentUser = null;
            updateSessionUI();
            renderMenuButtons();
            alert('Sesión finalizada.');
        } else {
            // si por alguna razón hay inconsistencia
            currentUser = null;
            updateSessionUI();
            renderMenuButtons();
        }
    }

    // Eventos modales
    modalLoginBtn.addEventListener('click', iniciarSesionDesdeModal);
    modalCancelBtn.addEventListener('click', closeModal);
    loginModal.addEventListener('click', (e) => { if (e.target === loginModal) closeModal(); });

    quickLoginBtn.addEventListener('click', showLoginModal);
    quickLogoutBtn.addEventListener('click', cerrarSesion);

    // Monitoreo de autenticación + conectividad
    auth.onAuthStateChanged((user) => {
        if (user && navigator.onLine) {
            currentUser = user;
        } else if (user && !navigator.onLine) {
            // Si está offline pero firebase dice usuario, se fuerza cierre porque no hay conectividad real.
            auth.signOut();
            currentUser = null;
        } else {
            currentUser = null;
        }
        updateSessionUI();
        renderMenuButtons();
    });

    window.addEventListener('online', () => {
        isOnline = true;
        updateConnectionUI();
        // Re-sincronizar estado de auth si es posible (ya que puede haber estado pendiente)
        if (auth.currentUser && !currentUser) {
            currentUser = auth.currentUser;
            updateSessionUI();
            renderMenuButtons();
        } else if (!auth.currentUser && currentUser) {
            currentUser = null;
            updateSessionUI();
            renderMenuButtons();
        } else {
            renderMenuButtons();
        }
    });
    window.addEventListener('offline', () => {
        isOnline = false;
        updateConnectionUI();
        // offline no se puede tener sesión activa por coerción, forzar cerrar estado visual
        if (currentUser) {
            currentUser = null;
            updateSessionUI();
            renderMenuButtons();
        } else {
            renderMenuButtons();
        }
    });

    // --- soporte para PWA (manifest, sw, instalación)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => console.log('✅ SW registrado')).catch(e => console.warn('SW fallo', e));
    }
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'inline-flex';
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        } else {
            alert('El navegador no soporta instalación manual o ya está instalada');
        }
    });
    if (window.matchMedia('(display-mode: standalone)').matches) installBtn.style.display = 'none';

    // Inicialización general
    function init() {
        updateConnectionUI();
        updateSessionUI();
        renderMenuButtons();
    }
    init();
</script>
</body>
</html>
