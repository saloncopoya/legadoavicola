// Validar estructura del JSON
function validarEstructuraJSON(datos) {
    if (!datos || typeof datos !== 'object') {
        throw new Error('El archivo no contiene un objeto JSON válido');
    }
    
    if (!datos.infoTorneo) {
        throw new Error('Estructura inválida: falta "infoTorneo"');
    }
    
    if (!datos.infoTorneo.nombre || typeof datos.infoTorneo.nombre !== 'string') {
        throw new Error('Estructura inválida: "infoTorneo.nombre" es requerido');
    }
    
    if (!datos.registroPartidos || !Array.isArray(datos.registroPartidos)) {
        throw new Error('Estructura inválida: falta "registroPartidos" (debe ser un array)');
    }
    
    if (!datos.resultadosCotejo || typeof datos.resultadosCotejo !== 'object') {
        throw new Error('Estructura inválida: falta "resultadosCotejo"');
    }
    
    if (!datos.resultadosCotejo.peleas || !Array.isArray(datos.resultadosCotejo.peleas)) {
        throw new Error('Estructura inválida: "resultadosCotejo.peleas" debe ser un array');
    }
    
    return true;
}

// Verificar duplicado de nombre de torneo
async function verificarNombreTorneoDuplicado(nombre) {
    if (!adminDb) return false;
    
    try {
        // SOLO verificar en el nodo del usuario actual (uid)
        const snapshot = await adminDb.ref('TORNEOS').child(uid).once('value');
        if (!snapshot.exists()) return false;
        
        const torneosUsuario = snapshot.val();
        for (const torneoId in torneosUsuario) {
            if (torneosUsuario[torneoId].nombre === nombre) {
                return true; // Ya existe un torneo con ese nombre para ESTE usuario
            }
        }
        return false;
    } catch (error) {
        console.error("Error verificando duplicado:", error);
        return false;
    }
}

// Extraer y mostrar preview del JSON
function mostrarPreviewJSON(archivo) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            try {
                const datos = JSON.parse(e.target.result);
                validarEstructuraJSON(datos);
                
                previewDatos = {
                    nombre: datos.infoTorneo.nombre,
                    fecha: datos.infoTorneo.fecha || 'Sin fecha',
                    cantidadPartidos: datos.registroPartidos?.length || 0,
                    cantidadPeleas: datos.resultadosCotejo?.peleas?.length || 0,
                    datosCompletos: datos
                };
                
                resolve(previewDatos);
            } catch (error) {
                reject(error);
            }
        };
        
        reader.onerror = () => reject(new Error('Error al leer el archivo'));
        reader.readAsText(archivo);
    });
}

// Función principal de importación
async function importarTorneoDesdeJSON(archivo) {
    // 1. VERIFICACIONES PREVIAS
    if (importandoEnProceso) {
        throw new Error('Ya hay una importación en progreso');
    }
    
    if (!navigator.onLine) {
        throw new Error('Sin conexión a internet');
    }
    
    if (!archivo) {
        throw new Error('No hay archivo seleccionado');
    }
    
    if (!archivo.name.toLowerCase().endsWith('.json')) {
        throw new Error('El archivo debe ser de tipo .json');
    }
    
    // 2. BLOQUEAR UI
    importandoEnProceso = true;
    
    try {
        // 3. LEER Y VALIDAR ARCHIVO
        const datos = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    validarEstructuraJSON(jsonData);
                    resolve(jsonData);
                } catch (err) {
                    reject(err);
                }
            };
            reader.onerror = () => reject(new Error('Error al leer el archivo'));
            reader.readAsText(archivo);
        });
        
        // 4. VERIFICAR DUPLICADO DE NOMBRE
        const nombreDuplicado = await verificarNombreTorneoDuplicado(datos.infoTorneo.nombre);
        if (nombreDuplicado) {
            throw new Error(`Ya existe un torneo con el nombre "${datos.infoTorneo.nombre}"`);
        }
        
        // 5. CREAR TORNEO EN FIREBASE
        const nuevoTorneoId = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
        
        // Construir objeto torneoData
        const torneoData = {
            nombre: datos.infoTorneo.nombre,
            fecha: datos.infoTorneo.fecha || new Date().toLocaleDateString('es-MX'),
            organizador: datos.infoTorneo.organizador || 'Importado',
            lugar: datos.infoTorneo.lugar || 'No especificado',
            palenque: datos.infoTorneo.palenque || 'No especificado',
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            createdBy: uid,
            pesoMin: datos.infoTorneo.pesoMin || 1200,
            pesoMax: datos.infoTorneo.pesoMax || 2700,
            rangoPeso: 50,
            config: {
                gallosPorPartido: datos.infoTorneo.config?.gallosPorPartido || 3,
                anillosEditables: datos.infoTorneo.config?.anillosEditables || false,
                registroDetallado: datos.infoTorneo.config?.registroDetallado || false
            },
            puntosConfig: datos.infoTorneo.puntosConfig || { ganador: 2, empate: 1, perdedor: 0 },
            representantesUsados: []
        };
        
        // Guardar torneo
        const torneoRef = adminDb.ref('TORNEOS').child(uid).child(nuevoTorneoId);
        await torneoRef.set(torneoData);
        
        // 6. REGISTRAR PARTIDOS
        const partidosMap = new Map(); // Para agrupar por partido
        
        datos.registroPartidos.forEach(gallo => {
            if (!partidosMap.has(gallo.partido)) {
                partidosMap.set(gallo.partido, {
                    nombre: gallo.partido,
                    representante: gallo.representante || '',
                    gallos: []
                });
            }
            partidosMap.get(gallo.partido).gallos.push({
                anillo: gallo.anillo.padStart(3, '0'),
                peso: gallo.peso || 0,
                color: gallo.color || ''
            });
        });
        
        const operacionesPartidos = [];
        for (const [nombrePartido, dataPartido] of partidosMap) {
            const matchId = `match_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
            const gallosObj = {};
            dataPartido.gallos.forEach(g => {
                gallosObj[g.anillo] = { peso: g.peso, color: g.color };
            });
            
            const matchData = {
                nombre: nombrePartido,
                representante: dataPartido.representante,
                gallos: gallosObj,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            
            operacionesPartidos.push(
                adminDb.ref('TORNEOS').child(uid).child(nuevoTorneoId).child('REGISTRO').child(matchId).set(matchData)
            );
        }
        await Promise.all(operacionesPartidos);
        
        // 7. GUARDAR COTEJO (si existe)
        let cotejoId = null;
        if (datos.resultadosCotejo && datos.resultadosCotejo.peleas.length > 0) {
            cotejoId = `cotejo_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
            
            // Buscar matchIds para cada gallo
            const buscarMatchId = (partidoNombre, anillo) => {
                for (const [matchId, matchData] of Object.entries(torneoData.REGISTRO || {})) {
                    if (matchData.nombre === partidoNombre && matchData.gallos && matchData.gallos[anillo]) {
                        return matchId;
                    }
                }
                return '';
            };
            
            const peleasConIds = datos.resultadosCotejo.peleas.map(pelea => ({
                numero: pelea.numero,
                gallo1: {
                    ...pelea.gallo1,
                    anillo: pelea.gallo1.anillo?.padStart(3, '0') || '',
                    partidoId: buscarMatchId(pelea.gallo1.partido, pelea.gallo1.anillo?.padStart(3, '0'))
                },
                gallo2: {
                    ...pelea.gallo2,
                    anillo: pelea.gallo2.anillo?.padStart(3, '0') || '',
                    partidoId: buscarMatchId(pelea.gallo2.partido, pelea.gallo2.anillo?.padStart(3, '0'))
                },
                diferencia: pelea.diferencia
            }));
            
            const cotejoData = {
                uid: uid,
                torneoId: nuevoTorneoId,
                fecha: firebase.database.ServerValue.TIMESTAMP,
                modo: datos.resultadosCotejo.modo || 'INTELIGENTE',
                metricas: datos.resultadosCotejo.metricas || {
                    totalGallos: datos.registroPartidos.length,
                    peleasGeneradas: datos.resultadosCotejo.peleas.length,
                    noEmparejados: datos.resultadosCotejo.noEmparejados?.length || 0,
                    diferenciaPromedio: 0,
                    conflictosConsecutivos: 0
                },
                peleas: peleasConIds,
                noEmparejados: (datos.resultadosCotejo.noEmparejados || []).map(item => ({
                    anillo: item.anillo?.padStart(3, '0') || '',
                    peso: item.peso,
                    partido: item.partido,
                    partidoId: buscarMatchId(item.partido, item.anillo?.padStart(3, '0')),
                    representante: item.representante || '',
                    motivo: item.motivo?.codigo || 'NO_PAREJA',
                    mensaje: item.motivo?.mensaje || 'No se pudo emparejar'
                })),
                configuracion: {
                    pesoMin: torneoData.pesoMin,
                    pesoMax: torneoData.pesoMax,
                    rangoPeso: torneoData.rangoPeso,
                    gallosPorPartido: torneoData.config.gallosPorPartido
                }
            };
            
            await adminDb.ref('COTEJOS').child(uid).child(cotejoId).set(cotejoData);
            await torneoRef.child('cotejoId').set(cotejoId);
        }
        
        // 8. GUARDAR CALIFICACIONES (si existen)
        if (datos.calificaciones && datos.calificaciones.length > 0 && cotejoId) {
            const operacionesCalificaciones = [];
            datos.calificaciones.forEach(cal => {
                if (cal.indicePelea !== undefined && cal.indicePelea >= 0) {
                    operacionesCalificaciones.push(
                        adminDb.ref('COTEJOS').child(uid).child(cotejoId).child('peleas').child(cal.indicePelea).update({
                            calificada: true,
                            ganador: cal.ganador,
                            tiempo: cal.tiempo,
                            usuarioCalifico: cal.usuarioCalifico || uid,
                            usuarioId: cal.usuarioId || uid,
                            fechaCalificacion: cal.fechaCalificacion || new Date().toLocaleString(),
                            timestamp: firebase.database.ServerValue.TIMESTAMP

            });
            if (operacionesCalificaciones.length > 0) {
                await Promise.all(operacionesCalificaciones);
            }

        // 9. ACTUALIZAR LISTAS LOCALES
        const nuevoTorneo = { id: nuevoTorneoId, ...torneoData, cotejoId: cotejoId };
        torneosAnteriores.unshift(nuevoTorneo);

        for (const [nombrePartido, dataPartido] of partidosMap) {
            dataPartido.gallos.forEach(g => {

                if (!isNaN(anilloNum) && anilloNum > maxRing) maxRing = anilloNum;
                nuevosPartidos.push({
                    anillo: g.anillo,

        partidosList = nuevosPartidos;

        // Cargar configuración de puntos
        if (torneoData.puntosConfig) {

            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;

    // ========================================================================
    // FUNCIÓN: VALIDACIONES PRE-COTEJO
    // ========================================================================
    const validarPreCotejo = () => {
        const usuario = AppState?.user?.profile;
        
        // 1. Verificar permiso cotejo
        if (!usuario?.cotejo) {
            AppState.addNotification('⛔ No tienes permiso para cotejar', 'error');
            return false;
        }
        
        // 2. Verificar internet
        if (!navigator.onLine) {
            AppState.addNotification('📴 Sin conexión a internet', 'error');
            return false;
        }
        
        // 3. Verificar que hay gallos
        if (!partidosList || partidosList.length === 0) {
            AppState.addNotification('❌ No hay gallos registrados', 'error');
            return false;
        }
        
        // 4. Verificar anillos duplicados
        const anillos = new Set();
        const duplicados = [];
        partidosList.forEach(g => {
            if (anillos.has(g.anillo)) {
                duplicados.push(g.anillo);
            } else {
                anillos.add(g.anillo);
            }
        });
        
        if (duplicados.length > 0) {
            AppState.addNotification(`❌ Anillos duplicados: ${duplicados.join(', ')}`, 'error');
            return false;
        }
        
        // 5. Verificar pesos completos
        const sinPeso = partidosList.filter(g => !g.peso || g.peso === 0);
        if (sinPeso.length > 0) {
            AppState.addNotification(`⚠️ ${sinPeso.length} gallos sin peso registrado`, 'warning');
            return false;
        }
        
        // 6. Verificar nombres de partidos
        const partidosSinNombre = [...new Set(partidosList.map(g => g.partido))].filter(n => !n || n.trim() === '');
        if (partidosSinNombre.length > 0) {
            AppState.addNotification('❌ Hay partidos sin nombre', 'error');
            return false;
        }
        
        return true;
    };
    
    // ========================================================================
    // FUNCIÓN: ENCONTRAR MEJOR PAREJA PARA UN GALLO
    // ========================================================================
    const encontrarMejorPareja = (gallo, listaGallos, usados) => {
        let mejorPareja = null;
        let menorDiferencia = Infinity;
        
        for (const posible of listaGallos) {
            // Saltar si ya está usado o es el mismo gallo
            if (usados.has(posible.anillo) || posible.anillo === gallo.anillo) continue;
            
            // RESTRICCIÓN 1: Mismo partido?
            if (posible.partido === gallo.partido) continue;
            
            // RESTRICCIÓN 2: Mismo representante?
            if (posible.representante && gallo.representante && 
                posible.representante === gallo.representante) continue;
            
            // RESTRICCIÓN 3: Rango de peso
            const diferencia = Math.abs(posible.peso - gallo.peso);
            if (diferencia > (configuracion.rangoPeso || 50)) continue;
            
            // Es candidato, ver si es mejor que el actual
            if (diferencia < menorDiferencia) {
                menorDiferencia = diferencia;
                mejorPareja = posible;
            }
        }
        
        return mejorPareja;
    };
    
    // ========================================================================
    // FUNCIÓN: OBTENER MOTIVO DE NO EMPAREJAMIENTO
    // ========================================================================
    const obtenerMotivoNoPareja = (gallo, listaGallos, usados) => {
        if (!gallo.peso || gallo.peso === 0) {
            return { codigo: 'PESO_CERO', mensaje: 'Peso no registrado (PENDIENTE)' };
        }
        
        // Verificar si hay algún gallo disponible que cumpla las condiciones
        for (const posible of listaGallos) {
            if (usados.has(posible.anillo) || posible.anillo === gallo.anillo) continue;
            
            // Verificar cada condición por separado para dar el motivo específico
            if (posible.partido === gallo.partido) {
                return { codigo: 'MISMO_PARTIDO', mensaje: 'Mismo nombre de partido' };
            }
            
            if (posible.representante && gallo.representante && 
                posible.representante === gallo.representante) {
                return { codigo: 'MISMO_REPRESENTANTE', mensaje: 'Mismo representante' };
            }
            
            const diferencia = Math.abs(posible.peso - gallo.peso);
            if (diferencia > (configuracion.rangoPeso || 50)) {
                return { 
                    codigo: 'RANGO_EXCEDIDO', 
                    mensaje: `Supera rango de peso (dif máxima ${configuracion.rangoPeso || 50}g)` 
                };
            }
            
            // Si llegamos aquí, significa que hay un candidato pero no se tomó por otra razón
            return { codigo: 'NO_PAREJA', mensaje: 'No hay pareja disponible' };
        }
        
        return { codigo: 'NO_PAREJA', mensaje: 'No hay pareja disponible' };
    };
    
    // ========================================================================
    // FUNCIÓN: EJECUTAR UN MODO ESPECÍFICO DE COTEJO
    // ========================================================================
    const ejecutarModoCotejo = (modo) => {
        // Obtener todos los gallos con peso > 0
        let gallos = partidosList.filter(g => g.peso && g.peso > 0);
        
        if (gallos.length < 2) {
            return { peleas: [], noEmparejados: gallos.map(g => ({ gallo: g, motivo: { codigo: 'MINIMO', mensaje: 'Se necesitan al menos 2 gallos' } })) };
        }
        
        // ORDENAR SEGÚN MODO
        switch(modo) {
            case 'ASCENDENTE':
                gallos.sort((a, b) => a.peso - b.peso);
                break;
            case 'DESCENDENTE':
                gallos.sort((a, b) => b.peso - a.peso);
                break;
            case 'ALEATORIO':
                gallos = gallos.sort(() => Math.random() - 0.5);
                break;
            case 'INTELIGENTE':
            default:
                gallos.sort((a, b) => a.peso - b.peso);
                break;
        }
        
        const peleas = [];
        const noEmparejados = [];
        const usados = new Set();
        
        for (const gallo of gallos) {
            if (usados.has(gallo.anillo)) continue;
            
            const pareja = encontrarMejorPareja(gallo, gallos, usados);
            
            if (pareja) {
                peleas.push({
                    numero: peleas.length + 1,
                    gallo1: gallo,
                    gallo2: pareja,
                    diferencia: Math.abs(gallo.peso - pareja.peso)
                });
                usados.add(gallo.anillo);
                usados.add(pareja.anillo);
            } else {
                noEmparejados.push({
                    gallo: gallo,
                    motivo: obtenerMotivoNoPareja(gallo, gallos, usados)
                });
            }
        }
        
        return { peleas, noEmparejados };
    };
    
    // ========================================================================
    // FUNCIÓN: DISTRIBUIR PELEAS PARA EVITAR CONFLICTOS CONSECUTIVOS
    // ========================================================================
    const distribuirPeleasInteligente = (peleas) => {
    if (peleas.length <= 2) return peleas;
    
    // ===== GENERAR MÚLTIPLES ÓRDENES Y ELEGIR EL MEJOR =====
    const NUM_INTENTOS = 50; // Intentos con diferentes enfoques
    const MEJORES_A_GUARDAR = 5; // Guardamos los 5 mejores
    
    const resultados = [];
    
    for (let intento = 0; intento < NUM_INTENTOS; intento++) {
        // Clonar las peleas para no modificar el original
        const peleasClon = peleas.map(p => ({...p}));
        
        // MEZCLA INICIAL según el tipo de intento
        if (intento < 10) {
            // Intentos 0-9: Orden original (sin mezclar)
            // No hacemos nada
        } 
        else if (intento < 20) {
            // Intentos 10-19: Mezcla suave
            peleasClon.sort(() => Math.random() - 0.3);
        }
        else if (intento < 30) {
            // Intentos 20-29: Mezcla fuerte
            peleasClon.sort(() => Math.random() - 0.5);
        }
        else if (intento < 40) {
            // Intentos 30-39: Ordenar por peso (alternativa)
            peleasClon.sort((a, b) => (a.gallo1.peso + a.gallo2.peso) - (b.gallo1.peso + b.gallo2.peso));
        }
        else {
            // Intentos 40-49: Orden inverso por peso
            peleasClon.sort((a, b) => (b.gallo1.peso + b.gallo2.peso) - (a.gallo1.peso + a.gallo2.peso));
        }
        
        // Agrupar por partido
        const partidosMap = new Map();
        peleasClon.forEach(pelea => {
            [pelea.gallo1.partido, pelea.gallo2.partido].forEach(partido => {
                if (!partidosMap.has(partido)) {
                    partidosMap.set(partido, []);
                }
                partidosMap.get(partido).push(pelea);
            });
        });
        
        // ALGORITMO GREEDY MEJORADO
        const peleasOrdenadas = [];
        const peleasArray = [...peleasClon];
        const maxIntentos = 1000;
        let intentosLocales = 0;
        
        while (peleasArray.length > 0 && intentosLocales < maxIntentos) {
            let mejorIndice = -1;
            let mejorPuntaje = -Infinity;
            
            for (let i = 0; i < peleasArray.length; i++) {
                const pelea = peleasArray[i];
                const partidosPelea = [pelea.gallo1.partido, pelea.gallo2.partido];
                
                // ===== SISTEMA COMPLETO DE PUNTUACIÓN =====
                let puntaje = 0;
                
                // 1. REVISAR ADYACENCIA INMEDIATA (últimas 3 peleas)
                for (let j = peleasOrdenadas.length - 1; j >= Math.max(0, peleasOrdenadas.length - 3); j--) {
                    const peleaAnterior = peleasOrdenadas[j];
                    
                    // A) ROJO-ROJO consecutivo
                    if (partidosPelea[0] === peleaAnterior.gallo1.partido) {
                        puntaje -= 50;
                    }
                    // B) VERDE-VERDE consecutivo
                    if (partidosPelea[1] === peleaAnterior.gallo2.partido) {
                        puntaje -= 50;
                    }
                    // C) ROJO arriba con VERDE abajo
                    if (partidosPelea[1] === peleaAnterior.gallo1.partido) {
                        puntaje -= 50;
                    }
                    // D) VERDE arriba con ROJO abajo
                    if (partidosPelea[0] === peleaAnterior.gallo2.partido) {
                        puntaje -= 50;
                    }
                    
                    // Penalización por proximidad (no inmediata)
                    const distancia = peleasOrdenadas.length - j;
                    if (distancia === 2) puntaje -= 20; // Separado por 1 pelea
                    if (distancia === 3) puntaje -= 10; // Separado por 2 peleas
                }
                
                // 2. BONIFICAR BUENA SEPARACIÓN
                for (let pos = 0; pos < 2; pos++) {
                    const partido = partidosPelea[pos];
                    // Buscar la última aparición de este partido
                    for (let j = peleasOrdenadas.length - 1; j >= 0; j--) {
                        const peleaAnterior = peleasOrdenadas[j];
                        if (peleaAnterior.gallo1.partido === partido || peleaAnterior.gallo2.partido === partido) {
                            const distancia = peleasOrdenadas.length - j;
                            if (distancia >= 5) puntaje += 40; // Excelente separación
                            else if (distancia === 4) puntaje += 30; // Muy bien separado
                            else if (distancia === 3) puntaje += 20; // Bien separado
                            break;
                        }
                    }
                }
                
                // 3. BONIFICAR PARTIDOS DIFERENTES EN LA MISMA PELEA
                if (partidosPelea[0] !== partidosPelea[1]) {
                    puntaje += 5;
                }
                
                // 4. PEQUEÑO FACTOR ALEATORIO PARA VARIEDAD
                puntaje += Math.random() * 2;
                
                if (puntaje > mejorPuntaje) {
                    mejorPuntaje = puntaje;
                    mejorIndice = i;
                }
            }
            
            if (mejorIndice >= 0) {
                const seleccionada = peleasArray.splice(mejorIndice, 1)[0];
                peleasOrdenadas.push(seleccionada);
                
                // Actualizar contadores
                [seleccionada.gallo1.partido, seleccionada.gallo2.partido].forEach(partido => {
                    const lista = partidosMap.get(partido);
                    if (lista) {
                        const index = lista.indexOf(seleccionada);
                        if (index >= 0) lista.splice(index, 1);
                    }
                });
            }
            
            intentosLocales++;
        }
        
        // Agregar peleas restantes
        if (peleasArray.length > 0) {
            peleasOrdenadas.push(...peleasArray);
        }
        
        // Calcular puntaje TOTAL de este orden
        let puntajeTotal = 0;
        
        // Calcular conflictos
        for (let i = 0; i < peleasOrdenadas.length - 1; i++) {
            const actual = peleasOrdenadas[i];
            const siguiente = peleasOrdenadas[i + 1];
            const partidosActual = [actual.gallo1.partido, actual.gallo2.partido];
            const partidosSiguiente = [siguiente.gallo1.partido, siguiente.gallo2.partido];
            
            // Detectar cualquier cruce
            if (partidosActual.some(p => partidosSiguiente.includes(p))) {
                puntajeTotal -= 100; // Penalización por conflicto
            }
            
            // Verificar cercanía (separados por 1 pelea)
            if (i < peleasOrdenadas.length - 2) {
                const posterior = peleasOrdenadas[i + 2];
                const partidosPosterior = [posterior.gallo1.partido, posterior.gallo2.partido];
                if (partidosActual.some(p => partidosPosterior.includes(p))) {
                    puntajeTotal -= 30; // Penalización por cercanía (separado por 1)
                }
            }
        }
        
        // Bonificar variedad
        const partidosUsados = new Set();
        peleasOrdenadas.forEach(p => {
            partidosUsados.add(p.gallo1.partido);
            partidosUsados.add(p.gallo2.partido);
        });
        puntajeTotal += partidosUsados.size * 10; // Más variedad = mejor
        
        // Guardar este intento
        resultados.push({
            peleas: peleasOrdenadas,
            puntaje: puntajeTotal,
            conflictos: calcularNumeroConflictos(peleasOrdenadas)
        });
    }
    
    // ===== ORDENAR RESULTADOS POR PUNTAJE (MEJOR PRIMERO) =====
    resultados.sort((a, b) => {
        // Primero por puntaje
        if (b.puntaje !== a.puntaje) return b.puntaje - a.puntaje;
        // Si hay empate, por menos conflictos
        return a.conflictos - b.conflictos;
    });
    
    // Tomar los MEJORES_A_GUARDAR mejores
    const mejoresResultados = resultados.slice(0, MEJORES_A_GUARDAR);
    
    // Elegir aleatoriamente entre los mejores (para variedad)
    const indiceElegido = Math.floor(Math.random() * mejoresResultados.length);
    const mejorOrden = mejoresResultados[indiceElegido];
    
    // Renumerar
    mejorOrden.peleas.forEach((p, idx) => { p.numero = idx + 1; });
    
    // LOG PARA VER ESTADÍSTICAS
    console.log("🎯 DISTRIBUCIÓN DE PELEAS - MEJORADOR:");
    console.log(`   Intentos evaluados: ${NUM_INTENTOS}`);
    console.log(`   Mejores guardados: ${MEJORES_A_GUARDAR}`);
    console.log(`   Elegido puesto #${indiceElegido + 1} con puntaje: ${mejorOrden.puntaje}`);
    console.log(`   Conflictos restantes: ${mejorOrden.conflictos}`);
    
    return mejorOrden.peleas;
};

// Función auxiliar para calcular número de conflictos
function calcularNumeroConflictos(peleas) {
    let conflictos = 0;
    for (let i = 0; i < peleas.length - 1; i++) {
        const actual = peleas[i];
        const siguiente = peleas[i + 1];
        const partidosActual = [actual.gallo1.partido, actual.gallo2.partido];
        const partidosSiguiente = [siguiente.gallo1.partido, siguiente.gallo2.partido];
        
        if (partidosActual.some(p => partidosSiguiente.includes(p))) {
            conflictos++;
        }
    }
    return conflictos;
}

// NUEVA FUNCIÓN: Mover Pelea con Modal y Selección de Posición

window.moverPelea = (numero, accion) => {
    // 1. Verificar permisos (tal como estaba)
    if (!AppState?.user?.profile?.posicion) return;

    const index = resultadosCotejo.peleas.findIndex(p => p.numero === numero);
    if (index === -1) return;

    // 2. Si la acción es 'intercambiar', llamar a la nueva función para invertir gallos
    if (accion === 'intercambiar') {
        intercambiarGallosEnPelea(index, numero);
        return;
    }

    // 3. Si la acción es 'up' o 'down', usar la lógica original (para mantener la función antigua si es necesario)
    if (accion === 'up' || accion === 'down') {
        let nuevoIndex;
        if (accion === 'up' && index > 0) {
            nuevoIndex = index - 1;
        } else if (accion === 'down' && index < resultadosCotejo.peleas.length - 1) {
            nuevoIndex = index + 1;
        } else {
            return; // No se puede mover más arriba o abajo
        }
        
        // Intercambiar
        [resultadosCotejo.peleas[index], resultadosCotejo.peleas[nuevoIndex]] = 
        [resultadosCotejo.peleas[nuevoIndex], resultadosCotejo.peleas[index]];
        
        // Renumerar
        resultadosCotejo.peleas.forEach((p, idx) => { p.numero = idx + 1; });
        
        // Re-renderizar
        renderizarResultadosCotejoConCalificaciones();
        
        AppState.addNotification(`🔄 Pelea movida a posición ${nuevoIndex + 1}`, 'success');
        return;
    }
    
    // 4. Si es cualquier otra cosa (se llamó sin 'up' o 'down'), mostramos el modal para intercambiar posición.
    mostrarModalMoverPelea(index, numero);
};

// ========================================================================
// FUNCIÓN NUEVA: Intercambiar los gallos (rojo ↔ verde) en una pelea
// ========================================================================
const intercambiarGallosEnPelea = (index, numeroPelea) => {
    const pelea = resultadosCotejo.peleas[index];
    if (!pelea) return;

    // 1. Intercambiar los datos de gallo1 y gallo2
    [pelea.gallo1, pelea.gallo2] = [pelea.gallo2, pelea.gallo1];
    
    // 2. Mantener la diferencia igual (el peso es el mismo, solo se invierten los gallos)
    // La diferencia no cambia porque es el valor absoluto de la resta de los pesos.
    
    // 3. Si la pelea ya estaba calificada, también debemos intercambiar los datos en el objeto de calificación
    const calificacionExistente = calificacionesCargadas.get(index);
    if (calificacionExistente) {
        // Intercambiar los datos de gallo1 y gallo2 en la calificación
        [calificacionExistente.gallo1, calificacionExistente.gallo2] = 
        [calificacionExistente.gallo2, calificacionExistente.gallo1];
        
        // Si el ganador era 'rojo', ahora es 'verde' y viceversa.
        if (calificacionExistente.ganador === 'rojo') {
            calificacionExistente.ganador = 'verde';
        } else if (calificacionExistente.ganador === 'verde') {
            calificacionExistente.ganador = 'rojo';
        }
        // Si era 'empate', se mantiene 'empate'.
        
        // Actualizar en Firebase en segundo plano
        actualizarCalificacionEnFirebase(index, calificacionExistente);
    }

    // 4. Re-renderizar la tabla
    renderizarResultadosCotejoConCalificaciones();
    
    // 5. Notificar éxito
    AppState.addNotification(`🔄 Gallos intercambiados en pelea #${numeroPelea}`, 'success');
    
    // Vibrar en dispositivos móviles
    if (navigator.vibrate) navigator.vibrate(100);
};

const moverPeleaAPosicion = (indexOrigen, indexDestino) => {
    if (indexOrigen === indexDestino) return;
    
    const pelea = resultadosCotejo.peleas[indexOrigen];
    
    // Remover la pelea de su posición original
    resultadosCotejo.peleas.splice(indexOrigen, 1);
    
    // Insertarla en la nueva posición
    resultadosCotejo.peleas.splice(indexDestino, 0, pelea);
    
    // Renumerar todas las peleas
    resultadosCotejo.peleas.forEach((p, idx) => { p.numero = idx + 1; });
    
    // Re-renderizar la tabla
    renderizarResultadosCotejoConCalificaciones();

    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
};

// FUNCIONES PARA EL MÓDULO "AGREGAR VIDEOS" - VERSIÓN CORREGIDA

// Variable para el estado de la sección
window.toggleVideosSection = () => {
    const content = document.getElementById('videos-content');
    const icon = document.getElementById('videos-toggle-icon');
    if (content && icon) {
        if (content.style.display === 'none') {
            content.style.display = 'block';
            icon.innerHTML = '▲';
            // Al abrir, cargar los videos de la pelea seleccionada si hay una
            setTimeout(() => {
                cargarVideosPeleaSeleccionada();
            }, 100);
        } else {
            content.style.display = 'none';
            icon.innerHTML = '▼';
        }
    }
};

// Función para cargar videos de la pelea seleccionada
const cargarVideosPeleaSeleccionada = () => {
    const select = document.getElementById('video-pelea-select');
    const listaDiv = document.getElementById('videos-guardados-lista');
    
    if (!select || !listaDiv) return;
    
    const peleaIndex = select.value;
    
    if (peleaIndex === '') {
        listaDiv.innerHTML = '<div style="text-align:center; color:#999; padding:10px;">Selecciona una pelea para ver sus videos</div>';
        return;
    }

    // Mostrar loading
    listaDiv.innerHTML = '<div style="text-align:center; color:#666; padding:10px;">⏳ Cargando videos...</div>';

    if (!adminDb || !torneoActual || !torneoActual.cotejoId) {
        listaDiv.innerHTML = '<div style="text-align:center; color:#d32f2f; padding:10px;">❌ Error: No hay cotejo activo</div>';
        return;
    }

    // Obtener datos de Firebase
    adminDb.ref('COTEJOS')
        .child(uid)
        .child(torneoActual.cotejoId)
        .child('peleas')
        .child(peleaIndex)
        .once('value')
        .then((snapshot) => {
            const peleaData = snapshot.val();
            const videos = peleaData?.videos || [];
            
            if (videos.length > 0) {
                let videosHtml = '';
                videos.forEach((url, i) => {
                    const displayUrl = url.length > 50 ? url.substring(0, 47) + '...' : url;
                    videosHtml += `
                        <div style="display:flex; align-items:center; justify-content:space-between; background:white; padding:8px 12px; margin-bottom:6px; border-radius:6px; border-left:4px solid #2196F3;">
                            <div style="flex:1; word-break:break-all; font-size:13px;">
                                <a href="${url}" target="_blank" style="color:#2196F3; text-decoration:none; font-weight:500;">${i+1}. </a>
                                <a href="${url}" target="_blank" style="color:#333; text-decoration:none;">${displayUrl}</a>
                            </div>
                        </div>
                    `;
                });
                listaDiv.innerHTML = videosHtml;
            } else {
                listaDiv.innerHTML = '<div style="text-align:center; color:#999; padding:10px;">📼 No hay videos guardados para esta pelea</div>';
            }
        })
        .catch(error => {
            console.error("❌ Error cargando videos:", error);
            listaDiv.innerHTML = '<div style="text-align:center; color:#d32f2f; padding:10px;">❌ Error al cargar los videos</div>';
        });
};

// Configurar listener para el selector
const setupVideoSelectListener = () => {
    const select = document.getElementById('video-pelea-select');
    if (select) {
        // Remover listener anterior para evitar duplicados
        select.removeEventListener('change', window.videoSelectHandler);
        
        // Crear nuevo handler
        window.videoSelectHandler = (e) => {
            const textarea = document.getElementById('video-urls-textarea');
            if (textarea) {
                textarea.value = ''; // Limpiar área de texto al cambiar de pelea
            }
            cargarVideosPeleaSeleccionada(); // Cargar videos de la nueva pelea
        };
        
        // Agregar listener
        select.addEventListener('change', window.videoSelectHandler);
    }
};

// Función para limpiar campos

    const select = document.getElementById('video-pelea-select');
    const textarea = document.getElementById('video-urls-textarea');
    const listaDiv = document.getElementById('videos-guardados-lista');
    
    if (select) select.value = '';
    if (textarea) textarea.value = '';
    if (listaDiv) {
        listaDiv.innerHTML = '<div style="text-align:center; color:#999; padding:10px;">Selecciona una pelea para ver sus videos</div>';
    }
    
    AppState.addNotification('🧹 Campos limpiados', 'info');
};

// Función principal para GUARDAR los videos
window.guardarVideosPelea = async () => {
    if (sinInternet()) return;

    const select = document.getElementById('video-pelea-select');
    const textarea = document.getElementById('video-urls-textarea');
    const peleaIndex = select?.value;
    const urlsTexto = textarea?.value.trim();

    // Validar que haya una pelea seleccionada
    if (!peleaIndex || peleaIndex === '') {
        AppState.addNotification('❌ Debes seleccionar una pelea', 'warning');
        select?.focus();
        return;
    }

    // Procesar las URLs
    let urlsArray = urlsTexto.split('\n')
        .map(linea => linea.trim())
        .filter(url => url !== '');

    if (urlsArray.length === 0) {
        AppState.addNotification('❌ Debes ingresar al menos una URL', 'warning');
        textarea?.focus();
        return;
    }

    if (urlsArray.length > 10) {
        AppState.addNotification('⚠️ Máximo 10 URLs permitidas. Se guardarán las primeras 10.', 'warning');
        urlsArray = urlsArray.slice(0, 10);
    }

    // Validación simple de URLs
    const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
    for (let url of urlsArray) {
        if (!urlPattern.test(url)) {
            AppState.addNotification(`❌ La URL "${url.substring(0,30)}..." no es válida`, 'error');
            return;
        }
    }

    // Bloquear botón
    const btnGuardar = document.getElementById('btn-guardar-videos');
    const textoOriginal = btnGuardar.innerHTML;
    btnGuardar.disabled = true;
    btnGuardar.innerHTML = '⏳ GUARDANDO...';
    btnGuardar.style.opacity = '0.7';

    try {
        if (!adminDb || !torneoActual || !torneoActual.cotejoId) {
            AppState.addNotification('❌ No hay un cotejo activo', 'error');
            return;
        }

        // Guardar en Firebase
        const peleaRef = adminDb.ref('COTEJOS')
            .child(uid)
            .child(torneoActual.cotejoId)
            .child('peleas')
            .child(peleaIndex);

        await peleaRef.child('videos').set(urlsArray);

        // Actualizar el objeto local de resultadosCotejo (opcional pero recomendado)
        if (resultadosCotejo?.peleas?.[peleaIndex]) {

    window.seleccionarJuez = (element) => {
        const checkbox = element.querySelector('.juez-checkbox');
        checkbox.checked = !checkbox.checked;

    // --- Función para cargar jueces asignados desde Firebase ---
    const cargarJuecesAsignados = async () => {
        if (!adminDb || !torneoId) return;

        try {
            const snapshot = await adminDb.ref('TORNEOS').child(uid).child(torneoId).once('value');
            const torneoData = snapshot.val();
            
            // Buscar nodos juez1...juez5
            const juecesAsignadosIds = [];
            for (let i = 1; i <= 5; i++) {
                const juezId = torneoData?.[`juez${i}`];
                if (juezId) {
                    juecesAsignadosIds.push(juezId);
                }
            }

            // Cargar tiempo asignado
            const tiempoGuardado = torneoData?.tiempoPermisoJueces;
            if (tiempoGuardado) {
                const select = document.getElementById('tiempo-permiso-jueces');
                if (select) select.value = tiempoGuardado;
            }

            // Marcar seleccionados
            listaCompletaJueces.forEach(j => {
                j.seleccionado = juecesAsignadosIds.includes(j.uid);
            });

            // Mostrar SOLO los asignados
            renderizarJuecesAsignados();

        } catch (error) {
            console.error("Error cargando jueces asignados:", error);
        }
    };

    window.asignarJuecesATorneo = async () => {
        if (sinInternet()) return;

        if (juecesSeleccionados.length === 0) {
            AppState.addNotification('❌ No has seleccionado ningún juez', 'warning');
            return;
        }

        const tiempoSeleccionado = document.getElementById('tiempo-permiso-jueces').value;

        if (!confirm(`¿Asignar ${juecesSeleccionados.length} juez(es) con permiso de ${tiempoSeleccionado} minutos?`)) {
            return;
        }

        const btnAsignar = document.getElementById('btn-asignar-jueces');
        btnAsignar.disabled = true;
        btnAsignar.innerHTML = '⏳ ASIGNANDO...';

        try {
            const updates = {};
            // Limpiar asignaciones anteriores
            for (let i = 1; i <= 5; i++) {
                updates[`juez${i}`] = null;
            }
            // Asignar nuevas
            juecesSeleccionados.slice(0, 5).forEach((juezId, index) => {
                updates[`juez${index + 1}`] = juezId;
            });
            updates.tiempoPermisoJueces = parseInt(tiempoSeleccionado, 10);

            await adminDb.ref('TORNEOS').child(uid).child(torneoId).update(updates);

            AppState.addNotification(`✅ ${juecesSeleccionados.length} juez(es) asignado(s)`, 'success');
            
            // Actualizar vista (solo asignados)
            renderizarJuecesAsignados();
            
            // Limpiar búsqueda
            document.getElementById('buscador-jueces').value = '';
            document.getElementById('lista-jueces-container').style.display = 'none';

        } catch (error) {
            console.error("Error asignando jueces:", error);
            AppState.addNotification('❌ Error al asignar jueces', 'error');

            btnAsignar.disabled = false;

const guardarEdicionGallo = async (nombrePartido, anilloOriginal, nuevoAnillo, nuevoPeso, nuevoColor) => {
    if (sinInternet()) return false; // ← PEGA ESTO

    // ... (código de validación inicial: anillo vacío, formato, etc.) ...

    // --- TU CÓDIGO DE VALIDACIÓN INICIAL (se mantiene) ---
    if (!nuevoAnillo || nuevoAnillo.trim() === '') {
        AppState.addNotification('❌ El número de anillo es obligatorio', 'error');
        return false;
    }
    if (!/^\d{3,4}$/.test(nuevoAnillo)) {
        AppState.addNotification('❌ El anillo debe tener 3 o 4 dígitos', 'error');
        return false;
    }
    const anilloFormateado = nuevoAnillo.padStart(3, '0');
    const anilloOriginalFormateado = anilloOriginal.padStart(3, '0');

    try {
        // ================================================================
        // PASO 1: OBTENER LISTA COMPLETA DE ANILLOS DEL TORNEO
        // ================================================================
        // Vamos a leer TODOS los partidos y TODOS los gallos del torneo actual
        // para construir un Set con los anillos existentes.
        const todosLosAnillos = new Set();
        
        // Recorremos la lista local 'partidosList' que ya tiene todos los gallos cargados.
        // Esta lista es más rápida que hacer una nueva consulta a Firebase.
        partidosList.forEach(gallo => {
            // Agregamos el anillo de CADA gallo al Set.
            // Un Set automáticamente maneja los duplicados, así que no hay problema.
            todosLosAnillos.add(gallo.anillo);
        });

        console.log("🔍 Anillos existentes en el torneo:", Array.from(todosLosAnillos));

        // ================================================================
        // PASO 2: VALIDACIÓN DE UNICIDAD (Solo si el anillo cambió)
        // ================================================================
        if (anilloFormateado !== anilloOriginalFormateado) {
            // ← NUEVA VALIDACIÓN: Verificar si el NUEVO anillo ya existe en el Set
            if (todosLosAnillos.has(anilloFormateado)) {
                // Buscar el partido donde está ese anillo para dar un mensaje más específico
                const partidoExistente = partidosList.find(p => p.anillo === anilloFormateado);
                AppState.addNotification(
                    `❌ El anillo ${nuevoAnillo} ya está registrado en el partido "${partidoExistente?.partido || 'desconocido'}"`, 
                    'error'
                );
                return false; // Detenemos el proceso de guardado
            }
        }

        // ================================================================
        // PASO 3: CONTINUAR CON EL GUARDADO (tu código existente)
        // ================================================================
        // Buscar el matchId del partido
        const partidosSnap = await adminDb.ref('TORNEOS')
            .child(uid)
            .child(torneoId)
            .child('REGISTRO')
            .once('value');

        let matchId = null;
        if (partidosSnap.exists()) {
            const pData = partidosSnap.val();
            for (let id in pData) {
                if (pData[id].nombre === nombrePartido) {
                    matchId = id;
                    break;
                }
            }
        }

        if (!matchId) {
            AppState.addNotification('❌ No se encontró el partido', 'error');
            return false;
        }

        // Validar peso (tu código)
        if (nuevoPeso > 0) {
            if (nuevoPeso < configuracion.pesoMin || nuevoPeso > configuracion.pesoMax) {
                AppState.addNotification(`❌ El peso debe estar entre ${configuracion.pesoMin} y ${configuracion.pesoMax} gramos`, 'error');
                return false;
            }
        }

        const representanteActual = partidosList.find(p => p.partido === nombrePartido)?.representante || '';

        // Actualizar en Firebase
        if (anilloFormateado !== anilloOriginalFormateado) {
            await adminDb.ref('TORNEOS')
                .child(uid)
                .child(torneoId)
                .child('REGISTRO')
                .child(matchId)
                .child('gallos')
                .child(anilloOriginalFormateado)
                .remove();

            await adminDb.ref('TORNEOS')
                .child(uid)
                .child(torneoId)
                .child('REGISTRO')
                .child(matchId)
                .child('gallos')
                .child(anilloFormateado)
                .set({
                    peso: nuevoPeso,
                    color: nuevoColor || ''
                });
        } else {
            await adminDb.ref('TORNEOS')
                .child(uid)
                .child(torneoId)
                .child('REGISTRO')
                .child(matchId)
                .child('gallos')
                .child(anilloFormateado)
                .update({
                    peso: nuevoPeso,
                    color: nuevoColor || ''
                });
        }

        // Actualizar lista local
        partidosList = partidosList.filter(p => 
            !(p.partido === nombrePartido && p.anillo === anilloOriginalFormateado)
        );
        
        partidosList.push({
            anillo: anilloFormateado,
            peso: nuevoPeso,
            color: nuevoColor || '',
            partido: nombrePartido,
            representante: representanteActual
        });

        // Guardar color nuevo si es necesario
        if (nuevoColor && nuevoColor.trim() !== '' && !coloresGallosList.includes(nuevoColor)) {
            const colRef = adminDb.ref('COLORGALLOS').push();
            await colRef.set({ nombre: nuevoColor });
            coloresGallosList.push(nuevoColor);
        }

 if (resultadosCotejo && resultadosCotejo.peleas && resultadosCotejo.peleas.length > 0 && !torneoActual?.cotejoId) {
            console.log("🧹 Limpiando cotejo temporal porque se editó un gallo");
            resultadosCotejo = {
                peleas: [],
                noEmparejados: [],
                metricas: {
                    totalGallos: 0,
                    peleasGeneradas: 0,
                    noEmparejados: 0,
                    diferenciaPromedio: 0,
                    conflictosConsecutivos: 0
                }
            };
            
            if (window.AppState) {
                AppState.rooster.cotejoState = false;
            }
        }


        AppState.addNotification(`✅ Gallo ${nuevoAnillo} actualizado`, 'success');
actualizarPantallaLigera();
        return true;

    } catch (error) {
        console.error('Error actualizando gallo:', error);
        AppState.addNotification('❌ Error al actualizar', 'error');
        return false;
    }
};

        if (!resultadosCotejo || !resultadosCotejo.peleas) return '<option value="">No hay peleas disponibles</option>';
        
        // 🔥 NUEVO: La opción vacía SIEMPRE va primero
        let opciones = '<option value="">-- Selecciona una pelea para calificar --</option>';
        
        // Clasificar peleas
        const peleasNoCalificadas = [];
        const peleasCalificadas = [];
        
        resultadosCotejo.peleas.forEach((pelea, index) => {
            const calificacion = calificacionesCargadas.get(index);
            const peleaConIndex = { ...pelea, indexOriginal: index };
            
            if (calificacion) {
                peleasCalificadas.push(peleaConIndex);
            } else {
                peleasNoCalificadas.push(peleaConIndex);
            }
        });
        
        // Ordenar calificadas por puntos (menor a mayor)
        peleasCalificadas.sort((a, b) => {
            const calA = calificacionesCargadas.get(a.indexOriginal);
            const calB = calificacionesCargadas.get(b.indexOriginal);
            const puntosA = (calA?.gallo1?.puntos || 0) + (calA?.gallo2?.puntos || 0);
            const puntosB = (calB?.gallo1?.puntos || 0) + (calB?.gallo2?.puntos || 0);
            return puntosA - puntosB;
        });

        // Agregar peleas NO calificadas
        peleasNoCalificadas.forEach(p => {
            const selectedAttr = (peleaSeleccionadaActual?.indexOriginal === p.indexOriginal) ? 'selected' : '';
            opciones += `<option value="${p.indexOriginal}" ${selectedAttr} style="font-weight:normal;">`;
            opciones += `Pelea #${p.numero}: ${p.gallo1.partido} vs ${p.gallo2.partido}`;
            if (peleaSeleccionadaActual?.indexOriginal === p.indexOriginal) {
                opciones += ` 🔵 (SELECCIONADA)`;
            }
            opciones += `</option>`;
        });

        // Agregar peleas CALIFICADAS (SOLO UNA VEZ)
        peleasCalificadas.forEach(p => {
            const cal = calificacionesCargadas.get(p.indexOriginal);
            let ganadorTexto = '';
            if (cal) {
                if (cal.ganador === 'rojo') ganadorTexto = `🔴 ${p.gallo1.partido}`;
                else if (cal.ganador === 'verde') ganadorTexto = `🟢 ${p.gallo2.partido}`;
                else if (cal.ganador === 'empate') ganadorTexto = ' TABLA';
            }
            const selectedAttr = (peleaSeleccionadaActual?.indexOriginal === p.indexOriginal) ? 'selected' : '';
            opciones += `<option value="${p.indexOriginal}" ${selectedAttr} style="background-color:#e8f5e8; font-weight:bold;">`;
            opciones += `Pelea #${p.numero}: ${p.gallo1.partido} vs ${p.gallo2.partido}`;
            opciones += ` ✓ (CALIFICADA: ${ganadorTexto} / ${cal?.tiempo || '??'})`;
            if (peleaSeleccionadaActual?.indexOriginal === p.indexOriginal) {
                opciones += ` 🔵 (SELECCIONADA)`;
            }
            opciones += `</option>`;
        });

        return opciones;
    };

    window.crearNuevoTorneo = async function(formData) {
        // Detener listeners
        calificacionListeners.forEach(off => off());
        calificacionListeners = [];
        
        const resultado = await crearNuevoTorneoOriginal.call(this, formData);
        
        // Limpiar mapa de calificaciones
        calificacionesCargadas.clear();
        
        return resultado;
    };

    // ========================================================================
    // FIN DE FUNCIONES DE CALIFICACIÓN
    // ========================================================================

    // ========================================================================
    // INICIAR TODO (INICIALIZACIÓN INMEDIATA)
    // ========================================================================
    initAdmin();

window.adminKiller = function() {
    console.log("🔪 Matando TODOS los recursos de admin...");
    
    // ==============================================
    // 1. DETENER TODOS LOS LISTENERS
    // ==============================================
    
    // Listeners de calificación
    if (typeof calificacionListeners !== 'undefined' && calificacionListeners) {
        console.log(`🧹 Deteniendo ${calificacionListeners.length} listeners de calificación`);
        calificacionListeners.forEach(off => off());
        calificacionListeners = [];
    }
    
    // Listeners de Firebase admin
    if (typeof adminDb !== 'undefined' && adminDb) {
        try {
            if (adminDb.ref && torneoActual?.cotejoId) {
                adminDb.ref(`COTEJOS/${uid}/${torneoActual.cotejoId}/peleas`).off();
            }
        } catch(e) {}
        adminDb = null;
    }
    
    // ==============================================
    // 2. ELIMINAR TODAS LAS APPS DE FIREBASE
    // ==============================================
    
    
    
    // Eliminar app 'admin_rooster'
    try {
        const roosterApp = firebase.app('admin_rooster');
        roosterApp.delete();
        console.log("✅ App admin_rooster eliminada");
    } catch(e) {}
    
    // Eliminar app 'admin_ventas'
    try {
        const ventasApp = firebase.app('admin_ventas');
        ventasApp.delete();
        console.log("✅ App admin_ventas eliminada");
    } catch(e) {}
    
    // Eliminar app 'share'
    try {
        const shareApp = firebase.app('share');
        shareApp.delete();
        console.log("✅ App share eliminada");
    } catch(e) {}
    
    // ==============================================
    // 3. CERRAR MODALES ABIERTOS
    // ==============================================
    
    const modalesIds = [
        'tournament-modal-overlay',
        'modal-eliminar-torneo-overlay',
        'modal-eliminar-cotejo-overlay',
        'modal-descarga-cotejo-overlay',
        'editar-partido-overlay',
        'editar-gallo-overlay',
        'edicion-opciones-overlay',
        'modal-mover-pelea-overlay'
    ];
    
    modalesIds.forEach(id => {
        const modal = document.getElementById(id);
        if (modal) modal.remove();
    });
    
    if (window.activeModal) {
        window.activeModal.remove();
        window.activeModal = null;
    }
    
    // ==============================================
    // 4. DETENER OBSERVADORES
    // ==============================================
    
    if (window.roosterObserver) {
        window.roosterObserver.disconnect();
        window.roosterObserver = null;
    }
    
    if (window.adminObserver) {
        window.adminObserver.disconnect();
        window.adminObserver = null;
    }
    
    // ==============================================
    // 5. CANCELAR TIMEOUTS PENDIENTES
    // ==============================================
    
    if (window.loadingTimeoutId) {
        clearTimeout(window.loadingTimeoutId);
        window.loadingTimeoutId = null;
    }
    
    if (window.debounceTimer) {
        clearTimeout(window.debounceTimer);
        window.debounceTimer = null;
    }
    
    if (window.activationNotificationTimeout) {
        clearTimeout(window.activationNotificationTimeout);
        window.activationNotificationTimeout = null;
    }
    
    if (window.modalInformativoTimeout) {
        clearTimeout(window.modalInformativoTimeout);
        window.modalInformativoTimeout = null;
    }
    
    // ==============================================
    // 6. LIMPIAR VARIABLES GLOBALES
    // ==============================================
    
    // Calificaciones
    if (typeof calificacionesCargadas !== 'undefined') {
        calificacionesCargadas.clear();
        calificacionesCargadas = null;
    }
    peleaSeleccionadaActual = null;
    puntosConfiguracion = null;
    
    // Torneo
    torneoActual = null;
    torneoId = null;
    partidosList = null;
    resultadosCotejo = null;
    configuracion = null;
    ultimoAnillo = null;
    
    // Listas
    representantesList = null;
    coloresGallosList = null;
    palenquesList = null;
    nombresPartidosList = null;
    nombresPartidosUnificados = null;
    
    // Serial
    serialIdActual = null;
    torneosEnSerialActual = null;
    torneosAnteriores = null;
    
    // Cotejo
    cotejoEnProceso = false;
    cotejoUltimoModo = null;
    
    // UI
    isAdminReady = false;
    isLoading = true;
    errorMessage = null;
    
    // ==============================================
    // 7. LIMPIAR CACHÉ DE ESTA PANTALLA
    // ==============================================
    
    const keysToRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.includes('cotejo') || 
                    key.includes('admin') || 
                    key.includes('torneo') ||
                    key.includes('pelea'))) {
            keysToRemove.push(key);
        }
    }
    keysToRemove.forEach(key => localStorage.removeItem(key));
    
    // ==============================================
    // 8. FLAG PARA CANCELAR OPERACIONES EN CURSO
    // ==============================================
    
    window._cancelarOperacionesAdmin = true;
    setTimeout(() => {
        window._cancelarOperacionesAdmin = false;
    }, 1000);
    
    // ==============================================
    // 9. LIMPIAR REFERENCIAS DEL DOM
    // ==============================================
    
    const container = document.getElementById('admin-main-container');
    if (container) {
        container.innerHTML = '';
    }
    
    console.log("✅ adminKiller COMPLETADO - Todos los recursos liberados");
};

    // ========================================================================
    // HTML INICIAL
    // ========================================================================
    return `
    <div id="admin-main-container" style="padding-top:0; min-height:100vh; background:#f8f9fa;">
        ${window.renderMobileNavBar ? window.renderMobileNavBar() : ''}
        ${isLoading ? renderLoading() : (errorMessage ? renderError() : (torneoActual ? renderContenidoPrincipal() : renderSinTorneo()))}
    </div>
    `;
};

// NOTA: Las funciones renderScreenSkeleton, renderMobileNavBar, etc., están definidas globalmente en AppState
// en el script original, pero para que este html sea autocontenido y no falle, definimos una versión mínima.
// Como el script original YA define renderLoading usando renderScreenSkeleton, necesitamos esa función.
// La agregamos aquí si no existe.
if (typeof window.renderScreenSkeleton !== 'function') {
    window.renderScreenSkeleton = (type) => {
        return `<div style="display:flex; justify-content:center; align-items:center; height:100vh;"><div>⏳ Cargando panel...</div></div>`;
    };
}
if (typeof window.renderMobileNavBar !== 'function') {
    window.renderMobileNavBar = () => '';
}

// Finalmente, para que la app se muestre automáticamente, ejecutamos el render.
// Pero primero esperamos a que Firebase esté listo y AppState tenga el usuario.
// Como ya inicializamos Firebase arriba, simplemente llamamos al render después de un pequeño delay.
// Finalmente, para que la app se muestre automáticamente, esperamos al usuario
// INICIAR PANEL DIRECTAMENTE
(async function() {
    console.log("🟢 INICIANDO PANEL...");
    const root = document.getElementById('app-root');
    if (root && window.renderAdminScreen) {
        const panelHTML = await window.renderAdminScreen();
        root.innerHTML = panelHTML;
    }
})();

    </script>
</body>
</html>
