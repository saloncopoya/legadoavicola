        // ==============================================
        // FUNCIÓN PARA CARGAR DATOS GLOBALES (PARTIDOS Y PALENQUES)
        // ==============================================
        async function cargarDatosGlobales() {
            const cacheKey = 'globalData';
            const cached = AppState.persistentCache.getGlobal(cacheKey);
            if (cached && cached.expires > Date.now()) {
                console.log("📦 Usando cache global");
                return cached.data;
            }
            
            const adminDb = getAdminDatabase();
            if (!adminDb) {
                return { partidos: [], palenques: [] };
            }
            
            try {
                // Cargar partidos
                const partidosSnapshot = await adminDb.ref('NOMPARTIDOS').once('value');
                const partidos = [];
                if (partidosSnapshot.exists()) {
                    const data = partidosSnapshot.val();
                    for (const key in data) {
                        if (data[key] && data[key].nombre) {
                            partidos.push(data[key].nombre);
                        }
                    }
                }
                
                // Cargar palenques
                const palenquesSnapshot = await adminDb.ref('PALENQUES').once('value');
                const palenques = [];
                if (palenquesSnapshot.exists()) {
                    const data = palenquesSnapshot.val();
                    for (const key in data) {
                        if (data[key] && data[key].nombre) {
                            palenques.push(data[key].nombre);
                        }
                    }
                }
                
                const globalData = { partidos, palenques };
                AppState.persistentCache.setGlobal(cacheKey, {
                    data: globalData,
                    expires: Date.now() + 5 * 60 * 1000 // 5 minutos
                });
                
                console.log(`📋 Datos globales cargados: ${partidos.length} partidos, ${palenques.length} palenques`);
                return globalData;
            } catch (error) {
                console.error("Error cargando datos globales:", error);
                return { partidos: [], palenques: [] };
            }
        }

            // ========================================================================
            // CAPÍTULO 4: UTILIDADES

            const Utils = {
                escapeHTML: (str) => {
                    if (!str) return '';
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                },
                obtenerFechaHoy: () => {
                    const hoy = new Date();
                    const dia = hoy.getDate().toString().padStart(2, '0');
                    const mes = (hoy.getMonth() + 1).toString().padStart(2, '0');
                    const anio = hoy.getFullYear();
                    return `${dia}/${mes}/${anio}`;
                },
                timeAgo: (timestamp) => {
                    if (!timestamp) return 'Recién';
                    const seconds = Math.floor((Date.now() - timestamp) / 1000);
                    if (seconds < 60) return `hace ${seconds} seg`;
                    const minutes = Math.floor(seconds / 60);
                    if (minutes < 60) return `hace ${minutes} min`;
                    const hours = Math.floor(minutes / 60);
                    if (hours < 24) return `hace ${hours} h`;
                    const days = Math.floor(hours / 24);
                    if (days < 7) return `hace ${days} d`;
                    return new Date(timestamp).toLocaleDateString();
                },
                formatDate: (timestamp) => {
                    if (!timestamp) return '';
                    const date = new Date(timestamp);
                    return date.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
                },
                getColorStyle: (colorNombre) => {
                    if (!colorNombre) return { background: '#FFFFFF', color: '#333' };
                    const color = Object.values(COLORES).find(c => c.nombre === colorNombre);
                    if (color) {
                        if (color.codigo.includes('linear-gradient')) {
                            return { background: color.codigo, color: color.texto, backgroundImage: color.codigo };
                        }
                        return { background: color.codigo, color: color.texto };
                    }
                    return { background: '#FFFFFF', color: '#333' };
                }
            };
            
            // ========================================================================

                const logoUrl = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi0T3uNTRD3YcwGAC4QM6ZJg_ylxluOI6yCOVTW4yf1hhgK4qP6rl8aF1INqcVBJ-2ph5U9w-FV67mUY8sGGheW7AQ3x00fZz3SyG7Kt0b3sxGE0G3G578DgZAWW8-Z-GWXCSK_6Iyoe0QP41AMCBfdKtwqxs0aXjVoAvqYV7_oxBBvuUW18I5Az01uDBup/s1024/abrir.jpg';
                const fechaGeneracion = new Date().toLocaleString('es-MX');
                let pageSizeCSS = { letter: 'Letter', legal: 'Legal', a4: 'A4' }[opciones.pageSize] || 'Letter';
                const htmlImpresion = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${Utils.escapeHTML(tabla.titulo)}</title><style>@page{size:${pageSizeCSS};margin:0.8cm 1cm}body{font-family:${opciones.fontFamily};font-size:${opciones.fontSize}px}.header-supercompact{display:flex;align-items:center;gap:10px;margin-bottom:10px}.header-logo img{width:68px}.tabla-container table{width:100%;border-collapse:collapse}th{background:#8B4513;color:white;padding:5px}td{padding:4px;border:1px solid #ddd}</style></head><body><div class="header-supercompact"><div class="header-logo"><img src="${logoUrl}"></div><div><h2>${Utils.escapeHTML(tabla.titulo)}</h2><div>📅 ${Utils.escapeHTML(tabla.fecha)} | 🏟️ ${Utils.escapeHTML(tabla.palenque)} | ${Utils.escapeHTML(tabla.organizador)}</div></div></div><div class="tabla-container">${tablaClone.outerHTML}</div><div style="margin-top:20px;text-align:center;font-size:10px;"><a href="${urlTabla}">${urlTabla}</a><br>© LEGADO AVICOLA - Generado: ${fechaGeneracion}</div></body></html>`;
                const ventanaImpresion = window.open('', '_blank');
                if (!ventanaImpresion) { AppState.addNotification('❌ Permite ventanas emergentes', 'error'); return; }
                ventanaImpresion.document.write(htmlImpresion);
                ventanaImpresion.document.close();
                ventanaImpresion.onload = () => setTimeout(() => ventanaImpresion.print(), 500);
            };
            
            // ========================================================================
            // MODALES DE COMPRA - VERSIÓN SIMPLIFICADA ESENCIAL
            // ========================================================================
            let modalCompraActivo = false;
            let modalCompraTimeout = null;
            let ultimoModalClick = 0;
            const TIEMPO_ESPERA_MODAL = 2000;
            
            async function obtenerTelefonoCreadorTabla(uidCreador, idTabla) {
                if (!ventasDb) return null;
                try {
                    const snapshot = await ventasDb.ref(`VENTAS/${uidCreador}/${idTabla}`).once('value');
                    if (snapshot.exists()) {
                        let telefono = snapshot.val().telefonoCreador;
                        if (telefono) {
                            let telefonoLimpio = String(telefono).replace(/\D/g, '');
                            if (telefonoLimpio.length === 10) telefonoLimpio = '52' + telefonoLimpio;
                            if (telefonoLimpio.length >= 10) return telefonoLimpio;
                        }
                    }
                    return null;
                } catch(e) { return null; }
            }
            
            function mostrarModalMultiCompra({ nombrePartido, columnas, nombreTorneo, fechaTorneo, idTabla, uidCreador }) {
                if (modalCompraActivo) { AppState.addNotification('⏳ Espera...', 'warning', 1000); return; }
                const ahora = Date.now();
                if (ahora - ultimoModalClick < TIEMPO_ESPERA_MODAL) return;
                modalCompraActivo = true;
                ultimoModalClick = ahora;
                modalCompraTimeout = setTimeout(() => { modalCompraActivo = false; }, 5000);
                
                const userActual = AppState.user.current;
                const profileActual = AppState.user.profile;
                
                const columnasVacias = [];
                const partidoActual = tablaDetalle?.partidos?.find(p => p.nombre === nombrePartido);
                columnas.forEach((col, idx) => {
                    let tieneDatos = false;
                    if (partidoActual) {
                        const monto = partidoActual.montos && partidoActual.montos[idx];
                        const comprador = partidoActual.compradores && partidoActual.compradores[idx];
                        const montoVacio = !monto || monto.toString().trim() === '';
                        const compradorEsSinPostor = comprador && comprador.toString().toLowerCase().trim() === 'sin postor';
                        if (!montoVacio || (comprador && comprador.trim() !== '' && !compradorEsSinPostor)) tieneDatos = true;
                    }
                    if (!tieneDatos) columnasVacias.push({ col, idx, nombreColumna: col.nombre || `Columna ${idx+1}`, montoBase: col.monto || 0 });
                });
                
                let columnasHTML = '';
                if (columnasVacias.length === 0) {
                    columnasHTML = `<div style="grid-column:span 3;text-align:center;padding:40px;"><span style="font-size:40px;">✅</span><p>SELECCIONA OTRO PARTIDO</p></div>`;
                } else {
                    columnasVacias.forEach(item => {
                        columnasHTML += `<button class="modal-columna-btn" data-columna-nombre="${Utils.escapeHTML(item.nombreColumna)}" data-monto-base="${item.montoBase}" style="background:linear-gradient(145deg,#1a1a2e,#0f0f1a);border:2px solid #f5c542;border-radius:16px;padding:20px 8px;cursor:pointer;text-align:center;"><div style="font-weight:900;color:#f5c542;">${Utils.escapeHTML(item.nombreColumna)}</div><div style="font-size:26px;font-weight:900;color:white;">${item.montoBase.toLocaleString()}</div></button>`;
                    });
                }
                
                const overlay = document.createElement('div');
                overlay.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:20000;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:16px;`;
                const modal = document.createElement('div');
                modal.style.cssText = `background:white;border-radius:40px;width:100%;max-width:720px;max-height:85vh;overflow-y:auto;padding:24px;`;
                modal.innerHTML = `<h2 style="text-align:center;font-size:26px;color:#8B4513;">${Utils.escapeHTML(nombrePartido)}</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0;">${columnasHTML}</div><button id="modal-btn-cancelar" style="width:100%;background:#a35117;color:white;padding:13px;border-radius:50px;">Cancelar</button>`;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                
                document.querySelectorAll('.modal-columna-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const nombreColumna = btn.getAttribute('data-columna-nombre');
                        const montoBase = parseInt(btn.getAttribute('data-monto-base')) || 0;
                        overlay.remove();
                        modalCompraActivo = false;
                        mostrarModalCantidad({ nombrePartido, nombreColumna, montoBase, nombreTorneo, fechaTorneo, idTabla, uidCreador });
                    });
                });
                document.getElementById('modal-btn-cancelar').onclick = () => { overlay.remove(); modalCompraActivo = false; if(modalCompraTimeout) clearTimeout(modalCompraTimeout); };
                overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); modalCompraActivo = false; } };
            }
            
            function mostrarModalCantidad({ nombrePartido, nombreColumna, montoBase, nombreTorneo, fechaTorneo, idTabla, uidCreador }) {
                if (modalCompraActivo) return;
                const userActual = AppState.user.current;
                const profileActual = AppState.user.profile;
                modalCompraActivo = true;
                
                const overlay = document.createElement('div');
                overlay.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:20001;display:flex;align-items:center;justify-content:center;`;
                const modal = document.createElement('div');
                modal.style.cssText = `background:white;border-radius:28px;width:90%;max-width:450px;padding:28px 24px;`;
                const montoBaseNumerico = parseInt(montoBase) || 0;
                let comboOpciones = '';
                if (montoBaseNumerico > 0) {
                    for (let i = 1; i <= 10; i++) comboOpciones += `<option value="${montoBaseNumerico * i}">${(montoBaseNumerico * i).toLocaleString()} pts</option>`;
                    modal.innerHTML = `<h2 style="text-align:center;color:#8B4513;">${Utils.escapeHTML(nombrePartido)}</h2><div style="text-align:center;margin-bottom:20px;">${Utils.escapeHTML(nombreColumna)}</div><div><label>Seleccionar pts:</label><select id="modal-monto-combo" style="width:100%;padding:14px;border-radius:12px;">${comboOpciones}</select><button id="modal-cambiar-a-manual" style="margin-top:10px;background:none;color:#2196F3;">✏️ Escribir otro monto</button></div><div id="modal-monto-manual-container" style="display:none;"><label>Escribir pts:</label><input type="number" id="modal-monto-manual" style="width:100%;padding:14px;border-radius:12px;"><button id="modal-cambiar-a-combo" style="margin-top:10px;background:none;color:#2196F3;">🔽 Volver a seleccionar</button></div><div style="display:flex;gap:12px;margin-top:20px;"><button id="modal-cantidad-cancelar" style="flex:1;background:#f0f2f5;padding:14px;border-radius:12px;">CANCELAR</button><button id="modal-cantidad-comprar" style="flex:2;background:#2E7D32;color:white;border:3px solid #FFD700;padding:14px;border-radius:12px;">ADQUIRIR</button></div>`;
                } else {
                    modal.innerHTML = `<h2 style="text-align:center;color:#8B4513;">${Utils.escapeHTML(nombrePartido)}</h2><div style="text-align:center;margin-bottom:20px;">${Utils.escapeHTML(nombreColumna)}</div><div><label>Escribir pts:</label><input type="number" id="modal-monto-manual" placeholder="Ej: 5000" style="width:100%;padding:14px;border-radius:12px;"></div><div style="display:flex;gap:12px;margin-top:20px;"><button id="modal-cantidad-cancelar" style="flex:1;background:#f0f2f5;padding:14px;border-radius:12px;">CANCELAR</button><button id="modal-cantidad-comprar" style="flex:2;background:#2E7D32;color:white;border:3px solid #FFD700;padding:14px;border-radius:12px;">ADQUIRIR</button></div>`;
                }
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
                
                if (montoBaseNumerico > 0) {
                    const comboContainer = document.getElementById('modal-monto-combo-container');
                    const manualContainer = document.getElementById('modal-monto-manual-container');
                    document.getElementById('modal-cambiar-a-manual').onclick = () => { document.getElementById('modal-monto-combo-container').style.display = 'none'; document.getElementById('modal-monto-manual-container').style.display = 'block'; };
                    document.getElementById('modal-cambiar-a-combo').onclick = () => { document.getElementById('modal-monto-combo-container').style.display = 'block'; document.getElementById('modal-monto-manual-container').style.display = 'none'; };
                }
                
                document.getElementById('modal-cantidad-cancelar').onclick = () => { overlay.remove(); modalCompraActivo = false; };
                document.getElementById('modal-cantidad-comprar').onclick = async () => {
                    let monto = 0;
                    if (montoBaseNumerico > 0 && document.getElementById('modal-monto-combo-container')?.style.display !== 'none') {
                        monto = parseInt(document.getElementById('modal-monto-combo').value) || 0;
                    } else {
                        monto = parseInt(document.getElementById('modal-monto-manual').value) || 0;
                    }
                    if (monto <= 0) { AppState.addNotification('❌ Monto válido requerido', 'error'); return; }
                    const btnComprar = document.getElementById('modal-cantidad-comprar');
                    btnComprar.disabled = true;
                    btnComprar.textContent = '⏳ ENVIANDO...';
                    try {
                        const telefonoCreador = await obtenerTelefonoCreadorTabla(uidCreador, idTabla);
                        if (!telefonoCreador) throw new Error('Teléfono no encontrado');
                        const fechaHoraActual = new Date().toLocaleString('es-MX');
                        const nombreUsuario = profileActual?.displayName || userActual?.displayName || 'Invitado';
                        const urlTabla = `${window.location.origin}${window.location.pathname}?section=ventas&v=${idTabla}`;
                        let mensajeWhatsApp = `*📋 SOLICITUD:*\n\n🏆 Torneo: ${nombreTorneo}\n📅 Fecha: ${fechaTorneo}\n\n🐓 PARTIDO: ${nombrePartido}\n💰 ${nombreColumna}: ${monto.toLocaleString()} pts\n\n👤 Usuario: ${nombreUsuario}\n📅 Solicitud: ${fechaHoraActual}\n\n🔗 ${urlTabla}`;
                        const urlWhatsApp = `https://wa.me/${telefonoCreador}?text=${encodeURIComponent(mensajeWhatsApp)}`;
                        window.open(urlWhatsApp, '_blank');
                        overlay.remove();
                        modalCompraActivo = false;
                        AppState.addNotification('✅ Solicitud enviada', 'success', 5000);
                    } catch(e) {
                        AppState.addNotification('❌ Error al procesar', 'error');
                        btnComprar.disabled = false;
                        btnComprar.textContent = 'ADQUIRIR';
                    }
                };
                overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); modalCompraActivo = false; } };
            }
            
            // ========================================================================
            // INICIALIZACIÓN
            // ========================================================================
            const init = async () => {
                isLoading = true;
                renderUI();
                const urlParams = new URLSearchParams(window.location.search);
                const shareId = urlParams.get('v');
                if (shareId) tablaCompartidaId = shareId;
                const dbOk = await initVentasDB();
                if (!dbOk) { isLoading = false; renderUI(); return; }
                await cargarTablasVentas();
                await cargarPartidosDesdeFirebase();
                if (tablaCompartidaId) {
                    const tablaEncontrada = tablasVentas.find(t => t.id === tablaCompartidaId);
                    if (tablaEncontrada) { tablaDetalle = tablaEncontrada; porcentajeDescuento = tablaEncontrada.descuento || 0; modoVista = 'cliente'; }
                    else AppState.addNotification('Tabla compartida no existe', 'error');
                }
                isLoading = false;
                renderUI();
            };
            init();
            
            return `<div id="ventas-main-container" style="min-height:100vh;background:#f8f9fa;"></div>`;
        };
        
        // ==============================================
        // RENDERIZADO PRINCIPAL
        // ==============================================
        function renderApp() {
            const root = document.getElementById('app-root');
            if (!root) return;
            const urlParams = new URLSearchParams(window.location.search);
            const section = urlParams.get('section');
            window.currentRenderFunction = window.renderVentasScreen;
            root.innerHTML = window.renderVentasScreen();
        }
        
        renderApp();
    </script>
</body>
</html>
